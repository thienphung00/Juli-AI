# Reboot persistence for the Cloudflare origin lockdown (#941).
#
# Install to:
#   /etc/systemd/system/juli-cloudflare-ip-refresh.service.d/10-boot-persistence.conf
# then:
#   systemctl daemon-reload
#   systemctl enable juli-cloudflare-ip-refresh.service   # the SERVICE, not only the timer
#
# The problem this fixes
# ----------------------
# The CLOUDFLARE_INGRESS chain lives only in the running kernel. ufw, by contrast,
# persists these across reboots:
#
#     80/tcp   ALLOW IN  Anywhere
#     443/tcp  ALLOW IN  Anywhere
#
# So a reboot did not merely drop the lockdown — it restored a permissive ruleset and
# left the origin fully exposed until the hourly timer next fired. With
# OnCalendar=hourly plus RandomizedDelaySec=5m and no OnBootSec, that window reached
# ~65 minutes. The service unit already declared WantedBy=multi-user.target but was
# never enabled, so it only ever ran from the timer.
#
# Why not iptables-persistent
# ---------------------------
# ufw owns the filter table and performs its own restore at boot, which would clobber
# a ruleset replayed by netfilter-persistent. Re-running the lockdown *after* ufw is
# the ordering-correct fix and needs no new package.
#
# Before=nginx.service closes the residual gap: nginx must not begin serving on 80/443
# until the lockdown has been applied. This is ordering only, not a hard dependency —
# if this unit fails, nginx still starts, and the script already fails closed on its
# own (it aborts rather than emitting a permissive ruleset).
[Unit]
After=ufw.service
Before=nginx.service

[Service]
# The script fetches Cloudflare's published ranges over the network. A hung fetch must
# never block boot; the script's own CURL_TIMEOUT_SEC guards the request, this guards
# the unit.
TimeoutStartSec=120
