# Explicit journald retention for the production VPS (#906, parent #889 — first-user
# security baseline / ADR-061).
#
# Install to:
#   /etc/systemd/journald.conf.d/10-retention.conf
# then:
#   systemctl restart systemd-journald
#
# The problem this fixes
# -----------------------
# `/etc/systemd/journald.conf` on the VPS has never set SystemMaxUse, MaxRetentionSec, or
# SystemKeepFree — pure distribution defaults. Retention is therefore whatever the distro
# happens to ship, undocumented, and could change or reset on an OS upgrade without anyone
# noticing. The journal is also where the security-events logging floor (ADR-061 §2c,
# #905) actually lands: `dictConfig` writes structured JSON to stdout and journald
# captures it — webhook signature rejections, failed auth, `shop_access_denied`, and
# limiter 429s all live here, not in a separate security log.
#
# Why 90 days
# -----------
# The whole point of #905's security events is retrospective investigation of things that
# do not announce themselves at the moment they happen — a slow-paced credential-stuffing
# run or a probing series of rejected webhook signatures, spread out specifically to stay
# under any per-minute alerting threshold. This is a single-founder operation with no
# dedicated on-call rotation (PRD #889): the realistic way this gets noticed is a lagging
# symptom — a customer report, a billing anomaly, a periodic manual look — not a live page.
# 90 days is the industry floor for security-relevant log retention for exactly this
# reason (it is PCI DSS's minimum "hot" window), and there is no observability platform
# to fall back on yet — Phase 2.11 (DOCP) is still at proposal stage (CONTEXT.md), so
# whatever is in the journal when someone finally looks IS the evidence. A week or a month
# is not enough headroom for a "we noticed something looked odd" trigger that lags the
# actual activity.
#
# Why also a hard size cap (not retention-window-only)
# ------------------------------------------------------
# MaxRetentionSec alone is not an absolute bound: a burst of log volume (e.g. an actual
# attack, which is precisely when this matters most) could otherwise fill the disk before
# 90 days elapses. SystemMaxUse caps the journal's own footprint regardless of age, and
# SystemKeepFree guarantees headroom for everything else on the box (the app, deploys,
# nginx logs below) even if the journal cap is hit.
#
# Disk assumption (ASSUMPTION — not measured; no VPS access from this change): this is a
# single low-cost VPS per ADR-057/PRD #889 ("single host, pre-first-user"), sized in the
# 40-80GB SSD class typical of a $12-24/mo droplet. SystemMaxUse=1G plus the nginx
# logrotate ceiling documented in infra/logrotate/nginx (worst case ~4.6GB) together stay
# comfortably under 10% of even the smaller end of that range, leaving room for the OS,
# the app checkouts under ~/releases, and Nginx/Certbot state.
[Journal]
# Hard, absolute cap — cannot be exceeded regardless of MaxRetentionSec below. This is
# the "rotation cannot fill the disk" bound: journald starts vacuuming the oldest entries
# once the journal directory reaches this size, independent of how recent they are.
SystemMaxUse=1G
# Always leave at least this much free on the filesystem holding /var/log/journal,
# regardless of SystemMaxUse — a second, independent floor under the size cap above.
SystemKeepFree=2G
# Age bound tied to the detection-window reasoning above. Journald prunes whichever of
# SystemMaxUse or MaxRetentionSec is hit first, so this is a ceiling on how long an entry
# survives, not a guarantee it survives this long if SystemMaxUse is reached sooner.
MaxRetentionSec=90day
