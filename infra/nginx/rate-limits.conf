# Inbound edge rate limiting — Issue #898 / ADR-061 decision 2b.
#
# infra/systemd/juli-api.service runs uvicorn with `--workers 1`: one process serves all
# API traffic, so a single unthrottled client can saturate the whole product. Nothing
# upstream of Python currently rejects a flood, and rejecting it before it reaches the
# sole worker is the only place that actually works (ADR-061 §2b) — an application-level
# limiter still lets the flood hit the worker, and would depend on Redis, which is
# optional and configured to fail open (`api/main.py:36`), reproducing the same fail-open
# shape as the SUPABASE_JWT_SECRET finding.
#
# `limit_req_zone` directives must live in the `http` context, so this file is installed
# to /etc/nginx/conf.d/rate-limits.conf by provision-nginx.sh — Ubuntu's stock
# /etc/nginx/nginx.conf already `include`s conf.d/*.conf inside `http {}`, before
# sites-enabled/*, so these zones are defined before any vhost location references them.
# The `limit_req zone=... burst=... nodelay;` directives that consume these zones live in
# infra/nginx/api.app-juli.com.conf, next to the locations they protect.
#
# Every zone is keyed by $binary_remote_addr (per client IP) and sized 10m, which nginx's
# own docs put at roughly 160,000 tracked IP states — orders of magnitude above what a
# single-VPS, pre-first-user deployment will ever see concurrently.
#
# 429 (Too Many Requests) is the correct rejection status for a caller being throttled —
# the app is fine, only this client is capped — but nginx's own default for a rejected
# limit_req is 503 (Service Unavailable), which reads as "the service is down". Override
# it once, globally, so every zone below returns the correct code without repeating the
# directive per location.
limit_req_status 429;

# webhook_tiktok — strict, and PLATFORM-WIDE, not per-shop (issue #928, fast-follow on
# #898/#915). /webhooks/tiktok is never called by a shop's own systems — Juli registers
# ONE ISV callback URL with TikTok Shop Partner Center, and TikTok's own sending
# infrastructure relays every subscribed shop's events to that single URL. The handler
# resolves which shop an event belongs to from the JSON payload, not the connection
# (backend/src/juli_backend/services/tiktok/webhook.py reads `event.shop_id` off the
# parsed body — see the `webhook_event_received` log and the handoff call just below it).
# So `$binary_remote_addr` on this zone resolves to TikTok's own egress addresses, not a
# shop's, and every shop subscribed to the platform contends for the SAME bucket. Keying
# by IP therefore cannot discriminate between shops at all — nginx's stock `limit_req`
# has nothing else to key on without parsing the request body (an njs/Lua module, out of
# scope for this slice), so the fix taken here is to size the shared ceiling for multiple
# concurrently active shops instead of pretending the key discriminates.
#
# Sizing (ASSUMPTION — not a measured production number or a documented TikTok limit;
# docs/integrations/tiktok_api/webhooks.md and rate-limits.md do not publish an ISV
# callback delivery rate, and this repo has no production webhook volume yet since the
# config below is not applied to the host). The prior 5 req/s was already headroom above
# one shop's estimated real event rate (order/refund/product events land in low single
# digits per second even during a flash sale, per the original #898 review). This zone
# keeps that same per-shop headroom figure and multiplies it by an assumed 5 concurrently
# active shops for the near-term rollout — consistent with ADR-057's "single-VPS,
# pre-first-user deployment" framing, i.e. a small cohort, not tens of shops — giving
# rate=25r/s. burst=40 (applied at the location) is scaled by 2x rather than the full 5x:
# TikTok redelivery retries cluster per-shop on a failed/timed-out delivery, which is a
# rarer, less-correlated event than steady per-shop traffic, so it is unlikely that all
# assumed shops retry in the same instant.
#
# This must be revisited once real numbers exist: either measured production 429/limit_req
# rejection counts once shops are live, or a documented TikTok ISV callback rate ceiling if
# TikTok ever publishes one. Neither exists today.
limit_req_zone $binary_remote_addr zone=webhook_tiktok:10m rate=25r/s;

# demo_public — strict. GET /v1/demo/* and POST /v1/demo/decisions/*/approve are
# deliberately unauthenticated (ADR-037) so App Review and prospects can click through
# real data with no login — which also means there is no auth cost gating a scraping
# bot or credential-free abuse the way every other route has. 10 req/s covers a human
# clicking through the demo (several XHRs per page load) with room to spare; burst=20
# (applied at the location) absorbs a page load's XHR fan-out.
limit_req_zone $binary_remote_addr zone=demo_public:10m rate=10r/s;

# auth_callback — strict. /v1/auth/* is the OAuth callback / connect surface for TikTok
# Seller and the two Business (advertiser / account-holder) auth flows — the credential-
# stuffing and callback-replay target ADR-061 calls out explicitly. A real user completes
# an OAuth handshake once, so 2 req/s is already generous; burst=5 (applied at the
# location) only exists to absorb a double-click or a browser redirect retry, not to
# support any sustained rate.
limit_req_zone $binary_remote_addr zone=auth_callback:10m rate=2r/s;

# api_authenticated — generous. Every other /v1/* route (orders, products, action-cards,
# recommendations, outcomes, executions, ...) requires a valid session — the caller has
# already paid an auth cost, so this zone exists only to stop one compromised or
# misbehaving authenticated client from taking the sole worker down, not to shape normal
# interactive use. 50 req/s is well above any real dashboard polling rate; burst=100
# (applied at the location) absorbs a dashboard's first-paint fan-out of parallel calls.
limit_req_zone $binary_remote_addr zone=api_authenticated:10m rate=50r/s;
