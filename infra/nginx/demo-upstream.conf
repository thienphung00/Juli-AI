# Demo upstream — SEED definition only (Issue #839, slice P0-DEL-SWITCH of PRD #820).
#
# provision-nginx.sh installs this file ONCE, to /etc/nginx/juli/demo-upstream.conf,
# and never overwrites it afterwards. From that point on the installed copy is owned by
# the deployment: infra/scripts/deploy-demo-release.sh replaces it atomically at cutover
# and reloads nginx gracefully, keeping the immediately previous definition beside it as
# demo-upstream.conf.prev.
#
# The installed copy — not this file, and not the vhost — is the single source of truth
# for which Demo instance is serving demo.app-juli.com:
#
#   awk '/server 127.0.0.1/' /etc/nginx/juli/demo-upstream.conf
#
# The Demo lane alternates between two loopback ports (3001 and 3021): whichever the live
# definition names is serving, and the other one is where the next candidate is started.
# 3001 is the seed because it is what juli-demo.service defaults to.
upstream juli_demo {
    server 127.0.0.1:3001;
    keepalive 16;
}
