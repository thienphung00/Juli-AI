# Demo upstream — SEED definition only (Issue #839, slice P0-DEL-SWITCH of PRD #820).
#
# provision-nginx.sh installs this file ONCE, to /etc/nginx/juli/landing-upstream.conf,
# and never overwrites it afterwards. From that point on the installed copy is owned by
# the deployment: infra/scripts/deploy.sh (landing lane) replaces it atomically at cutover
# and reloads nginx gracefully, keeping the immediately previous definition beside it as
# landing-upstream.conf.prev.
#
# The installed copy — not this file, and not the vhost — is the single source of truth
# for which Landing instance is serving app-juli.com:
#
#   awk '/server 127.0.0.1/' /etc/nginx/juli/landing-upstream.conf
#
# The Landing lane alternates between two loopback ports (3007 and 3027): whichever the live
# definition names is serving, and the other one is where the next candidate is started.
# 3001 is the seed because it is what juli-landing.service defaults to.
upstream juli_landing {
    server 127.0.0.1:3007;
    keepalive 16;
}
