# Demo frontend — demo.app-juli.com (Phase 2.6, Issue #406; upstream indirection #839)
#
# Serves apps/demo via the juli-demo systemd service on the review VPS.
# Static assets (/_next/static) are served by next start — same proxy-all pattern as
# app-juli.com / juli-web; no filesystem alias for hashed chunks.
# Independent upstream from app-juli.com (3000) and api.app-juli.com (8000).
# HTTPS certificates are issued/renewed by certbot.
#
# THE UPSTREAM IS NOT DEFINED HERE (#839). It lives in a file the deployment owns and
# replaces atomically at cutover, so a release is a graceful `nginx -s reload` instead of
# a `systemctl restart juli-demo` — which used to drop every in-flight request.
#
#   /etc/nginx/juli/demo-upstream.conf        what is serving RIGHT NOW (source of truth)
#   /etc/nginx/juli/demo-upstream.conf.prev   the immediately previous definition (the undo)
#
# ONE-TIME PROVISIONING: this include is an explicit filename, so nginx refuses to load
# ANY site if it is missing. `sudo ./infra/scripts/provision-nginx.sh` installs the seed
# from infra/nginx/demo-upstream.conf and never overwrites an existing one. It must run
# once before the first deploy that uses the indirection.
include /etc/nginx/juli/demo-upstream.conf;

server {
    listen 80;
    listen [::]:80;
    server_name demo.app-juli.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://demo.app-juli.com$request_uri;
    }
}

server {
    # http2 as a listen flag, not the standalone `http2 on;` directive: the review
    # VPS runs nginx 1.24.0 and the directive form (>= 1.25.1) fails nginx -t.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.app-juli.com;

    ssl_certificate     /etc/letsencrypt/live/demo.app-juli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.app-juli.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ------------------------------------------------------------------------
    # SAME-ORIGIN /v1 PROXY (issue #1970, owner decision 2026-09-15).
    #
    # apps/demo calls the API with RELATIVE paths — `/v1/shops`
    # (src/lib/shops-client.ts), `/v1/auth/tiktok/start` — and deliberately has
    # no client-side API base env var (#397). Before this, demo.app-juli.com's
    # ONLY location was `/` -> juli_demo, so every one of those calls was served
    # by Next.js and 404'd: a signed-in seller could not list their shops and had
    # no route at all to connect one.
    #
    # Same-origin proxy rather than pointing the browser at api.app-juli.com:
    # cross-origin would need CORS with credentials on an auth surface, a
    # preflight on every call, and a second place for an allowed-origin list to
    # drift. The owner chose the proxy on 2026-09-15.
    #
    # THE UPSTREAM IS NOT INCLUDED HERE, ON PURPOSE. `upstream juli_api` is
    # defined by /etc/nginx/juli/api-upstream.conf, which api.app-juli.com.conf
    # already includes. nginx upstreams live in the `http` context and are shared
    # by every vhost, so including that file a second time is a hard
    # "duplicate upstream" error that stops nginx loading ANY site. Order does
    # not matter — upstream names are resolved after the whole config is parsed.
    # The dependency is real and one-directional (disabling the api vhost breaks
    # this proxy), so it is stated here rather than left to be discovered.
    #
    # The limit_req zones mirror api.app-juli.com.conf location for location
    # (infra/nginx/rate-limits.conf, #898/ADR-061 §2b). They MUST: these three
    # locations reach the same single-uvicorn-worker API, so leaving them
    # unthrottled here would just move the unthrottled door to another hostname.
    # Zones key on $binary_remote_addr, so a client hitting both hostnames shares
    # one bucket per zone — which is the intent.

    # Public, unauthenticated Demo read surface (ADR-037). Most specific first.
    location /v1/demo/ {
        limit_req zone=demo_public burst=20 nodelay;
        proxy_pass http://juli_api/v1/demo/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth connect surface: /v1/auth/tiktok/start (JWT-gated, #1970) and the
    # sibling Business auth routes. Strict edge limit against credential-stuffing
    # and callback replay; burst=5 covers a double-click or a redirect retry.
    #
    # /v1/auth/tiktok/callback is NOT expected here — TikTok redirects to the
    # registered TIKTOK_REDIRECT_URI on api.app-juli.com. It stays reachable
    # through this location if that ever changes, under the same limit.
    location /v1/auth/ {
        limit_req zone=auth_callback burst=5 nodelay;
        proxy_pass http://juli_api/v1/auth/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Every other /v1/* route — /v1/shops first among them. The caller has
    # already paid an auth cost, so this only stops one misbehaving client from
    # saturating the sole worker.
    location /v1/ {
        limit_req zone=api_authenticated burst=100 nodelay;
        proxy_pass http://juli_api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Next.js app. A prefix location, so the three /v1/ blocks above win for
    # anything under /v1/ — nginx picks the LONGEST matching prefix, not the first.
    location / {
        proxy_pass http://juli_demo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
