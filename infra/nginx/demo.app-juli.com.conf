# Demo frontend — demo.app-juli.com (Phase 2.6, Issue #406; upstream indirection #839)
#
# Serves apps/demo via the juli-demo systemd service on the review VPS.
# Static assets (/_next/static) are served by next start — same proxy-all pattern as
# app-juli.com / juli-web; no filesystem alias for hashed chunks.
# Independent upstream from app-juli.com (3000) and api.app-juli.com (8000).
# HTTPS certificates are issued/renewed by certbot.
#
# THE UPSTREAM IS NOT DEFINED HERE (#839). It lives in a file the deployment owns and
# replaces atomically at cutover, so a release is a graceful `nginx -s reload` instead of
# a `systemctl restart juli-demo` — which used to drop every in-flight request.
#
#   /etc/nginx/juli/demo-upstream.conf        what is serving RIGHT NOW (source of truth)
#   /etc/nginx/juli/demo-upstream.conf.prev   the immediately previous definition (the undo)
#
# ONE-TIME PROVISIONING: this include is an explicit filename, so nginx refuses to load
# ANY site if it is missing. `sudo ./infra/scripts/provision-nginx.sh` installs the seed
# from infra/nginx/demo-upstream.conf and never overwrites an existing one. It must run
# once before the first deploy that uses the indirection.
include /etc/nginx/juli/demo-upstream.conf;

server {
    listen 80;
    listen [::]:80;
    server_name demo.app-juli.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://demo.app-juli.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.app-juli.com;

    ssl_certificate     /etc/letsencrypt/live/demo.app-juli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.app-juli.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://juli_demo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
