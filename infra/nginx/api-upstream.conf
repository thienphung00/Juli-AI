# Demo upstream — SEED definition only (Issue #839, slice P0-DEL-SWITCH of PRD #820).
#
# provision-nginx.sh installs this file ONCE, to /etc/nginx/juli/api-upstream.conf,
# and never overwrites it afterwards. From that point on the installed copy is owned by
# the deployment: infra/scripts/deploy.sh (api lane) replaces it atomically at cutover
# and reloads nginx gracefully, keeping the immediately previous definition beside it as
# api-upstream.conf.prev.
#
# The installed copy — not this file, and not the vhost — is the single source of truth
# for which API instance is serving api.app-juli.com:
#
#   awk '/server 127.0.0.1/' /etc/nginx/juli/api-upstream.conf
#
# The API lane alternates between two loopback ports (8000 and 8020): whichever the live
# definition names is serving, and the other one is where the next candidate is started.
# 3001 is the seed because it is what juli-api.service defaults to.
upstream juli_api {
    server 127.0.0.1:8000;
    keepalive 16;
}
