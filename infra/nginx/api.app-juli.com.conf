# App Review backend — api.app-juli.com (Phase 2.5)
#
# Serves the FastAPI app (backend.api.api.main:app) via the juli-api
# systemd service on the single review VPS. Review-only surface exposing health,
# reviewer auth, and the TikTok OAuth callback. HTTPS via certbot.
#
# Reviewer-relevant routes:
#   GET  /health                        -> liveness probe (2xx JSON)
#   *    /v1/auth/tiktok/callback       -> TikTok OAuth callback (route lands in #259)
#
# Inbound rate limiting (#898/ADR-061 §2b): the `limit_req_zone` definitions and their
# per-zone rationale live in infra/nginx/rate-limits.conf, installed to
# /etc/nginx/conf.d/ (http context) by provision-nginx.sh. `/health` intentionally
# carries no `limit_req` so uptime polling is never throttled.

# The upstream lives in a deployment-owned include (#843, same pattern as Demo/#839):
# /etc/nginx/juli/api-upstream.conf is the source of truth for which API instance is
# serving; deploy.sh replaces it atomically and reloads gracefully at cutover.
include /etc/nginx/juli/api-upstream.conf;

server {
    listen 80;
    listen [::]:80;
    server_name api.app-juli.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://api.app-juli.com$request_uri;
    }
}

server {
    # http2 as a listen flag, not the standalone `http2 on;` directive: the review
    # VPS runs nginx 1.24.0 and the directive form (>= 1.25.1) fails nginx -t.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.app-juli.com;

    ssl_certificate     /etc/letsencrypt/live/api.app-juli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.app-juli.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Health probe used by the smoke test and reviewers.
    location = /health {
        proxy_pass http://juli_api/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # TikTok webhook receiver (issue #381) — not under /v1. Strict edge limit: the
    # signature check (hmac.compare_digest over the raw body) costs real CPU before it
    # can reject a forged request. burst=20 absorbs TikTok's own delivery-retry bursts;
    # see infra/nginx/rate-limits.conf for the zone and its rate rationale.
    location = /webhooks/tiktok {
        limit_req zone=webhook_tiktok burst=20 nodelay;
        proxy_pass http://juli_api/webhooks/tiktok;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public, unauthenticated Demo read surface (ADR-037): GET /v1/demo/analytics,
    # GET /v1/demo/decisions[/{id}], POST /v1/demo/decisions/{id}/approve. Strict edge
    # limit because no login cost gates abuse here the way it does elsewhere. burst=20
    # absorbs one page load's XHR fan-out; see infra/nginx/rate-limits.conf.
    location /v1/demo/ {
        limit_req zone=demo_public burst=20 nodelay;
        proxy_pass http://juli_api/v1/demo/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth callback / connect surface (route implemented in issue #259):
    # /v1/auth/tiktok/callback and the sibling Business auth routes under
    # /v1/auth/tiktok/business/*. Strict edge limit against credential-stuffing /
    # callback-replay; burst=5 only covers a double-click or redirect retry. See
    # infra/nginx/rate-limits.conf.
    location /v1/auth/ {
        limit_req zone=auth_callback burst=5 nodelay;
        proxy_pass http://juli_api/v1/auth/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authenticated catch-all — every other /v1/* route. Generous edge limit: the
    # caller already paid an auth cost, so this exists only to stop one misbehaving
    # authenticated client from saturating the sole worker, not to shape normal use.
    # burst=100 absorbs a dashboard's first-paint fan-out. See
    # infra/nginx/rate-limits.conf.
    location / {
        limit_req zone=api_authenticated burst=100 nodelay;
        proxy_pass http://juli_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
