# Juli Ops — ops.app-juli.com (fast track P16, DECISIONS D25.1)
#
# The internal console, built from apps/demo (route group /ops) so staff see
# exactly the seller's screens. TWO gates, both required:
#   1. Cloudflare Access (Zero Trust application, Google IdP, @app-juli.com only)
#      in front of the hostname. Cloudflare adds `Cf-Access-Jwt-Assertion` to
#      every request it lets through; the API VERIFIES it (team certs + AUD) on
#      every /v1/ops/* call and fails closed without it.
#   2. An active `ops_staff` row for the signed-in Supabase user.
# The origin accepts Cloudflare's IPs only (infra/scripts/cloudflare-origin-lockdown.sh),
# so nobody reaches this vhost around Access.
#
# Same Next.js process as demo.app-juli.com: `juli_demo` is defined by
# /etc/nginx/juli/demo-upstream.conf, which demo.app-juli.com.conf already includes
# (do NOT include it again here -- a duplicate upstream stops nginx loading any site).
# The app's middleware serves only /ops/* on this host and adds X-Robots-Tag.
#
# CERTIFICATE: the demo certificate expanded with this name (runbook
# docs/runbooks/ops-console-runbook.md):
#   certbot certonly --nginx --cert-name demo.app-juli.com -d demo.app-juli.com -d ops.app-juli.com --expand
#
# Installed by `INSTALL_OPS_VHOST=1 sudo ./infra/scripts/provision-nginx.sh` -- only
# after that expansion, because nginx -t fails (for every site) on a missing name.

server {
    listen 80;
    listen [::]:80;
    server_name ops.app-juli.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://ops.app-juli.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ops.app-juli.com;

    ssl_certificate     /etc/letsencrypt/live/demo.app-juli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.app-juli.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;

    # The ops API only. Cloudflare's `Cf-Access-Jwt-Assertion` request header is
    # passed through unchanged (nginx forwards request headers by default); the
    # API verifies it. Same zone as the seller's authenticated /v1/ traffic.
    location /v1/ops/ {
        limit_req zone=api_authenticated burst=100 nodelay;
        proxy_pass http://juli_api/v1/ops/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No other API surface on the ops host (seller routes live on demo.app-juli.com).
    location /v1/ {
        return 404;
    }

    location / {
        proxy_pass http://juli_demo;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
