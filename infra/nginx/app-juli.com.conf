# Main domain — app-juli.com serves the Landing page (#842)
#
# Serves apps/landing via the juli-landing systemd service on 127.0.0.1:3007
# (see infra/systemd/juli-landing.service; #841 gave Landing this port).
# HTTPS certificates are issued/renewed by certbot — the repoint reuses the
# existing certificate; no new DNS record or TLS work (#842 AC).
#
# The internal dashboard (apps/dashboard, formerly juli-web on :3000) is retired
# from production by #842: still built and tested in CI, never deployed. The
# upstream name is kept so the server blocks below are untouched in shape.

# The upstream lives in a deployment-owned include (#843, same pattern as Demo/#839):
# /etc/nginx/juli/landing-upstream.conf is the source of truth for which Landing
# instance is serving the main domain; deploy.sh replaces it atomically and reloads
# gracefully at cutover. The include carries the juli_landing upstream name.
include /etc/nginx/juli/landing-upstream.conf;

server {
    listen 80;
    listen [::]:80;
    server_name app-juli.com www.app-juli.com;

    # Allow ACME HTTP-01 challenges, redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://app-juli.com$request_uri;
    }
}

server {
    # http2 as a listen flag, not the standalone `http2 on;` directive: the review
    # VPS runs nginx 1.24.0 and the directive form (>= 1.25.1) fails nginx -t.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app-juli.com;

    ssl_certificate     /etc/letsencrypt/live/app-juli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-juli.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://juli_landing;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
