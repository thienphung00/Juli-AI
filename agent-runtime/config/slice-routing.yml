# rate limiting and the audit trail all reach production behaviour directly.
# ---------------------------------------------------------------------------

# AGT-W7A-DP — #1325 W7 isolation lane, data-platform domain (#1326, #1328,
# #1329). The database's own tenancy: a non-owner juli_app role and its explicit
# grant map, RLS policies that actually deny, and a two-tenant proof enumerated
# from pg_catalog. The role lands BEFORE any policy, because the runtime connects
# as the pooler `postgres` role — the table owner, which Postgres exempts from row
# policies — so policies written first would be inert (migration 032's docstring).
# Real Postgres 16 only: SQLite cannot express roles, RLS or row locks.
AGT-W7A-DP:
  executorDomain: data-platform
  requiredDocs:
    - "{handoffPath}"
    - CONTEXT.md
    - docs/adr/061-first-user-security-baseline.md
    - backend/src/juli_backend/database/MODULE.md
  requiredModules:
    - backend/src/juli_backend/models/models.py
    - backend/src/juli_backend/database/migrations/versions/032_close_public_schema_defaults.py
    - backend/src/juli_backend/database/migrations/versions/021_medallion_schemas.py
  loadWhenNeeded:
    - backend/src/juli_backend/database/migrations/versions/001_create_users_shops_tiktok_credentials.py
    - backend/src/juli_backend/database/migrations/versions/002_add_commerce_analytics_tables.py
    - backend/src/juli_backend/database/database.py
    - tests/integration/test_migrations.py
    - tests/integration/test_schema_parity.py
    - agent-runtime/scripts/ci/ensure_postgrest_client_roles.py
    - agent-runtime/scripts/ci/check_public_schema_privileges.py
    - .github/workflows/pr.yml
    - infra/scripts/safe-alembic-upgrade.sh
  doNotLoad:
    - apps/
    - ios/
    - packages/
    - backend/src/juli_backend/services/agent/
    - backend/src/juli_backend/api/routes/
    - backend/src/juli_backend/ai/
    - docs/product/design/
    - docs/integrations/tiktok_corpora/
    - Sibling issue context caches

# AGT-W7A-BE — #1325 W7 runtime-seam lane, backend domain (#1327, #1330). The
# tenant GUC set with SET LOCAL at the unit-of-work seam (never SET — session
# scope leaks across pool checkouts), fail-closed in Python before any SQL is
# emitted, plus the seventh boot check that makes the production-write capability
# refuse to start against a database it can bypass. Split from AGT-W7A-DP because
# this is application plumbing, not schema work, and dual-loading backend +
# data-platform is forbidden. core/security/dependencies.py is W6 #1313's file.
AGT-W7A-BE:
  executorDomain: backend
  requiredDocs:
