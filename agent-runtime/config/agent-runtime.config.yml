    1058:
      defaultSliceId: AGT-W2B
      handoffPath: docs/adr/077-incremental-impact-measurement.md
      parentScopeBlock: "# Parent #1058 - Incremental impact measurement (constant)\n## Product boundary\n- New module services/impact/ plus workers/impact_reader/ and one table; outcome_tracking touch-ups only\n- No UI, no agent-loop changes; reads analytics_performance_intervals and the ToolExecution schema\n## Architect locks\n- Ratio-form DiD against K=5 nearest-CORRELATED siblings (min 3), equal-weighted. Correlation beats category because it measures shared shock exposure, which is what DiD needs.\n- Day T is excluded from every window. A second Juli run inside either window marks the reading confounded.\n- Below the per-metric volume floor is a DESIGNED state (Chua du du lieu de uoc tinh), not an error. Conversion's floor reads the real visitors column - never impressions as a proxy.\n- A fallback-path reading can never be awarded Cao.\n- Declared plainly a heuristic z-analogue; tfcausalimpact is the graduation path. Never imply statistical rigour the method lacks.\n- Copy: every number hedged uoc tinh, never causal language, inline method disclaimer, negative impact rendered as honestly as positive.\n- Stdlib only - no numpy/scipy/pandas/statsmodels for means or correlations.\n- Fixtures never mix datetime.now() with hardcoded calendar dates; derive every date from one injected reference point.\n## Epic deferrals\n- The one real end-to-end reading for a sandbox run with backdated T - W3-A, no workflow_runs table or runner exists yet\n- impact_readings.run_id foreign key - deferred until W3-A creates workflow_runs\n- Demo UI surfacing and the business-impact aggregation row - P-UI / P10\n"
