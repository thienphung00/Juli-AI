    # 1213 — W5 PRD; registered 2026-08-21. Two lanes under one parent:
    # AGT-W5A (P9 approval gate, ADR-075 d.1/d.2) is the default; the P14
    # security slices route to AGT-W5B via childSlices, and the one schema
    # slice routes to AGT-W5A-DP. Note #1213 itself is CLOSED on GitHub while
