    1308:
      defaultSliceId: AGT-W6A
      handoffPath: docs/adr/084-agent-demo-surface-tenancy-and-replay.md
      parentScopeBlock: "# Parent #1308 - W6: sellers can watch Juli work and choose what it does (P-UI) (constant)\n## Which lane you are in\n- W6-B / AGT-W6B - the server contract the interface reads: #1309 #1310 #1272 #1311 #1313\n- W6-B / AGT-W6B-DP - the wave's ONLY seed/schema slice: #1312\n- W6-A / AGT-W6A - apps/demo and its TypeScript: #1314 #1315 #1316 #1317 #1318 #1319 #1320 #1321\nRead only your lane's section. The other lanes are other executors' trees; never edit their files.\n## Product boundary\n- W6-B touches api/routes/demo_decisions.py, a new run-list route, services/agent/approval.py, services/agent/runner/core.py, a scenario capture/replay module, and packages/contracts TS mirrors of shapes it changes\n- W6-B-DP touches the demo-tenant seed plus at most one additive migration; nothing else\n- W6-A touches apps/demo/**, packages/theme (a SCOPED layer only), packages/contracts TS surface\n- Optimize Product only. The other ten workflows keep their existing demo flows untouched - P13/W10 onboards them\n- No RLS, no production-write capability flip, no impact reading - all W7/W8\n## Architect locks - all lanes\n- WRITES STAY SANDBOX-BOUND FOR THE ENTIRE WAVE. Owner decision 2026-08-21: no approval and no write against Fujiwa Vietnam Store (shop 2b1da87b-d0a8-46a6-b3c6-2132be0b5f4f). A production mutation additionally requires functional RLS, a manual red-team pass, and explicit per-mutation owner authorization - none of which are in this wave.\n- NO REAL MERCHANT'S DATA REACHES THE DEMO SURFACE. DEMO_REFERENCE_SHOP_ID resolves to a live seller's production shop on the deployed host; that is how #1283 happened. Falling back to it when the demo-tenant setting is unset is structurally forbidden - fail loudly instead.\n- ADR NUMBERING: ADR-084 is this wave's design authority and amends ADR-076 d.1/d.2/d.4. ADR-082 is the PRODUCT BINDING adr (server-derived, highest revenue, snapshot). The concurrency/progress target NFRs moved from 082 to ADR-083 on 2026-08-25 because the two collided - if you read \"ADR-082\" in an older comment, check which one it means.\n- HAND-AUTHORED EVENT JSON IS FORBIDDEN anywhere in the scenario pipeline or the reducer's tests. Scenarios come from the capture tool (#1311) run against real persisted workflow_run_events. A second hand-maintained source is exactly the defect class that produced six W3 post-merge fixes; a scenario the tool cannot produce is a gap in the tool, not a licence to write JSON.\n- A shape that crosses a module boundary is a TypedDict or Pydantic model, never an untyped dict, and the producer's tests call the REAL consumer. Any Pydantic payload change and its packages/contracts TypeScript mirror move in the SAME PR or the cross-language contract test fails CI.\n- Cross-tenant and nonexistent both return 404, never 403. No existence oracle, anywhere.\n- ADR-035 PUBLIC RELEASE: apps/demo is a deployed lane (demo.app-juli.com; deploy.sh lane order api -> demo -> landing) with a Playwright suite in release.yml. Every slice touching apps/demo, packages/theme, packages/contracts or a public /v1 route is public-release and MUST carry a schema-valid releaseEvidencePlan. Meta halts without one; never infer or waive it.\n- Tests live flat in tests/unit and tests/integration per repo convention.\n- MIGRATION NUMBERING IS ASSIGNED BY META, never read from head. Only #1312 may add a migration, and only if a pure seed genuinely cannot work.\n## Architect locks - W6-B only\n- approval.py TODAY pins every run to OPTIMIZE_PRODUCT_PLAYBOOK.workflow_key regardless of the card's own workflow_key, and says so in a comment. #1309 makes that a NAMED 409 refusal for cards whose workflow has no registered playbook - never a substitution. It does NOT generalize to the other ten workflows; that is P13/W10.\n- The demo Decisions envelope deliberately withholds workflow_key (see _build_masked_item's docstring, the no-PII/no-raw-payload/no-workflow_key discipline). The executability discriminator must reveal NO workflow taxonomy, and a schema test must assert workflow_key is still absent.\n- The discriminator is derived from the REAL playbook registry, never a second hand-maintained literal. Prove it by registering a fixture playbook and observing the value change.\n- The run list (#1310) is a POLLED POSTGRES READ MODEL over the rows the event stream already persists (ADR-083 T4), so the list and any opened stream cannot disagree and a queued run with zero events is still visible. It is NOT a multiplexed per-shop stream - that stays deferred behind ADR-083 T4's own trigger.\n- Scenario replay (#1311) seeds real workflow_run_events rows and serves them through the EXISTING GET /v1/demo/runs/{id}/events handler. An in-memory shortcut that bypasses the handler defeats the entire point of \"replay and live are one code path\" - the test must assert the real handler ran.\n- #1272 is ADOPTED, not re-filed: its body of 2026-08-21 is the spec, plus the W6 acceptance criteria in its adoption comment. The leak invariant is asserted over a REAL run's persisted event log, not one constructed payload. Internal detail is RELOCATED to server-side logs keyed to the run, never deleted.\n- #1313 must verify a token minted through the REAL identity provider path (ES256/JWKS). The W5 gate found the verifier hardcoded to HS256 while Supabase issued ES256, and the suite passed because it minted its own HS256 tokens with a test secret. A self-signed test token verifies the code against its own assumption and proves nothing.\n- Anonymous sign-in must be enabled on the Supabase project. If it is not, HALT and report - do not substitute a shared demo account (rejected in ADR-076 d.1 and still rejected).\n## Architect locks - W6-B-DP only\n- The seed is IDEMPOTENT and COMMITTED. Running it twice leaves one shop, one card set, one product set - proven against a real database, not SQLite.\n- The demo shop must hold NO tiktok_credentials row granting any write capability, and must be pairwise distinct from both the reference merchant shop and the sandbox-write shop. Assert all three ids differ.\n- Seeded cards are active AND surfaced (surfaced_at set). #1289 was exactly the \"cards exist but never surface\" defect on a different shop; do not re-create it.\n- Seeded content must not contain any real merchant's strings. Assert the seeded values do not appear in the reference shop's rows.\n- Prefer a pure seed. If a migration turns out to be unnecessary, say so - that is the better outcome, not a shortfall.\n## Architect locks - W6-A only\n- PUI-DESIGN.md is the design authority: wireframes, the six-stage model, the eight-row motion table, the copy table. No new external design reference was gathered for this wave because the surface was already grilled to that level. Do not invent a palette that contradicts it, and do not reach for an MCP - executors have none by construction.\n- TOKEN FREEDOM IS SCOPED. New tokens live in a scoped layer (packages/theme extension or surface-local) and NEVER overwrite app-wide values. A test must assert the dashboard's and the other ten workflows' computed token values are byte-identical before and after.\n- The accent token is reserved for the LIVE EDGE only - active stepper node, streaming caret, armed CTA. Not for ordinary emphasis.\n- Motion is choreography for the stream. Every primitive requires an event or a state transition as its trigger, so \"animate to look busy\" is not expressible. Every one of the eight motion-table entries needs its stated prefers-reduced-motion alternative, asserted per entry.\n- The fetch-streaming client already exists at apps/demo/src/lib/agent-event-stream.ts (#1132, merged). useRunStream BUILDS ON IT. Do not write a second client.\n- The reducer is PURE: no React, no fetch, no Date.now(). Its tests run on captured scenario files, never on hand-built event objects.\n- TWO-STEP CONSENT IS STRUCTURAL: no single interaction may send a confirmation. Assert with a test that clicks once and expects zero requests. Every rendered number on an option card traces to an event-payload field - nothing about expected effect is computed client-side.\n- NO RETRY-IN-PLACE CONTROL, asserted by scanning the rendered tree so it cannot be added later without failing the test. A new run requires a new approval by the approval gate's design; a convenience button is how that gate gets bypassed.\n- Completed runs consume their card permanently; only failures revert (#1305, by design). Render that honestly - the path to a new recommendation is a refresh.\n- Deleting the mock layer (#1320) is SCOPED to the Optimize Product surfaces. The other ten workflows' suites are the regression net and must stay green and UNEDITED.\n- Seller copy is Vietnamese from dictionary.md in the \"b\u1ea1n\" voice, passing the banned-pattern guard through the SHARED source in packages/contracts - never a local copy.\n## Epic deferrals\n- Functional RLS, the manual red-team pass, the ADR-068 capability flip, any production write, and the first real impact reading - W7/W8\n- Onboarding the remaining ten workflows to the agent path - P13/W10. This wave makes the single-workflow constraint HONEST; it does not remove it.\n- Product-scoped action cards - ADR-082 named them \"a real W6 item\"; they reach scoring, the emission budget, the dashboard and the fixtures, so W6 discloses the bound product at the product-snapshot stage instead\n- Structured output (P7) - the completion stage renders prose; the view tightens against a schema in W9\n- The live merchant OAuth exchange for arbitrary shops - the connect-shop screen is built, the exchange is a flagged follow-up\n- A multiplexed per-shop event stream - deferred behind ADR-083 T4's own trigger\n- The dashboard and iOS\n## Scope protocol\n- Found a gap outside your spec? If your own acceptance criterion is false without the fix, fix it and say so in the PR. Otherwise REPORT it and touch nothing. Never open a new issue.\n"
