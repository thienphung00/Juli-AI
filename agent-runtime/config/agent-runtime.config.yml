    # 1308 - W6 / P-UI. Two disjoint lanes: the interface (AGT-W6A, ui-ux,
    # apps/demo) is the default; the server contract routes to AGT-W6B via
    # childSlices and the one seed slice to AGT-W6B-DP. #1272 was filed
