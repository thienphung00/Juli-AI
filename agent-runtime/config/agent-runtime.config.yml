version: 1
prompt:
  system_prompt: default
  verbosity: medium
  variants:
    default: Meta Agent routes context, assigns one executor domain, and optimizes only declarative harness configuration from runtime artifacts.
  additional_instructions:
    - Preserve product code, ADRs, PRDs, and architecture documents during harness optimization.
    - Prefer measurable changes to context budget, routing, skill loading, model choice, tools, and benchmark thresholds.
model:
  primary: claude-sonnet
  fallback: claude-haiku
  allowed:
    - claude-sonnet
    - claude-haiku
    - gpt-5
    - gpt-5-mini
context:
  budget_tokens: 50000
  max_files: 20
  retrieval_depth: 3
  reserved_reasoning_ratio: 0.1
routing:
  backend_threshold: 0.7
  ui_threshold: 0.6
  data_threshold: 0.7
  ml_threshold: 0.7
  integrations_threshold: 0.7
  # Prefer slice-routing.yml executorDomain when focusSlice / parentLinkage.sliceId is set.
  prefer_slice_executor_domain: true
  # Never dual-load backend + data-platform skills in harnessUtility.
  single_primary_domain_skill: true
  domain_mappings:
    backend:
      - backend/src/juli_backend/api
      - backend/src/juli_backend/core
      - backend/src/juli_backend/services
      - backend/src/juli_backend/workers
      - infra/scripts
      - infra/systemd
    integrations:
      - backend/src/juli_backend/integrations
      - backend/src/juli_backend/services/webhook
      - backend/src/juli_backend/services/analytics_backfill
      - backend/src/juli_backend/workers/services/polling
      - infra/scripts/run-analytics-backfill.sh
    ui-ux:
      - apps/dashboard
      - apps/demo
      - packages/ui
      - packages/theme
      - packages/utils
      - packages/contracts
      - ios
    data-platform:
      - backend/src/juli_backend/database
      - backend/src/juli_backend/database/migrations
      - alembic/
    machine-learning:
      - backend/src/juli_backend/ai
  cross_layer_hints:
    backend:
      related_paths:
        - backend/src/juli_backend/api
        - backend/src/juli_backend/database
        - docs/architecture/MODULES.md
        - docs/architecture/map.md
      note: API and persistence context often required beyond backend/src/juli_backend/api
    ui-ux:
      related_paths:
        - apps/demo
        - packages/ui
        - packages/theme
        - docs/product/design/soul.md
        - docs/architecture/MODULES.md
        - docs/architecture/map.md
      note: Demo/UI library tasks use packages/* and design soul — not apps/dashboard product code
    data-platform:
      related_paths:
        - backend/src/juli_backend/database
        - backend/src/juli_backend/services/etl
        - backend/src/juli_backend/database/migrations
        - docs/architecture/MODULES.md
        - docs/architecture/data-sources.md
      note: Schema and ingestion paths span ordering and database layers
    machine-learning:
      related_paths:
        - backend/src/juli_backend/ai
        - backend/src/juli_backend/database
        - docs/architecture/MODULES.md
        - docs/api/data-models
      note: Feature pipelines depend on canonical data models outside ai/
    integrations:
      related_paths:
        - backend/src/juli_backend/integrations
        - docs/integrations/
        - docs/architecture/MODULES.md
        - docs/architecture/data-sources.md
        - backend/src/juli_backend/services/etl
      note: Vendor HTTP/webhook/polling/backfill; ETL consumer durability stays data-platform
  hints:
    - domain: machine-learning
      signal: synthetic_dataset_small
      action: require_golden_fixture_min_100
    - domain: ui-ux
      signal: external_api_call
      action: load_reliability_and_observability_rules
executors:
  enabled:
    - backend
    - ui-ux
    - data-platform
    - machine-learning
    - integrations
  default: backend
skills:
  backend:
    - backend
    - python-patterns
    - patterns
  ui-ux:
    - ui-ux
    - ui-ux-design
    - nextjs
  data-platform:
    - data-platform
    - postgres-patterns
  machine-learning:
    - machine-learning
  integrations:
    - integrations
    - python-patterns
    - patterns
tools:
  enabled:
    - ReadFile
    - rg
    - Glob
    - ApplyPatch
    - Shell
  disabled: []
  max_invocations_per_run: 80
agents:
  architect:
    phase: planning
    sequence: "[focus, grill-with-docs, to-prd, to-issues]"
    owns: "[prds, adrs, issues, architecture-docs, backlog, scope-alignment]"
    must_not: "[implement, route-executors, validate, ship]"
  meta:
    phase: "[implementation-routing, harness-optimization]"
    built_on: focus
    owns: "[context-routing, skill-routing, executor-assignment, harness-optimization, product-dev-optimization]"
    consumes_artifacts: "[implementation-artifact, review-artifact, validation-artifact]"
    emits_artifacts: "[harness-optimization-artifact, product-development-optimization-artifact]"
    must_not: "[implement-features, bypass-review-agent, auto-edit-skills-rules-adrs]"
    # Hard gate before Executor — no manual "prepare parent cache" prompt required.
    pre_executor_command: "python agent-runtime/scripts/meta_prepare_executor.py --issue {n}"
  executor:
    phase: implementation
    tdd: red-green-refactor
    domain_skills: "[ui-ux, backend, data-platform, machine-learning, integrations]"
    emits_artifacts: "[implementation-artifact]"
    must_not: "[ship, validate, optimize-harness, start-without-valid-workflow-cache]"
    # Unless artifact_gates.quickCommitSkip applies (.worktrees/debug + no issue-<N>).
    skip_artifacts_when: artifact_gates.quickCommitSkip
  review:
    phase: review-and-testing
    sequence: "[intent-review, guardrails, validate, ship-ready]"
    emits_artifacts: "[intent-review-artifact, review-artifact, validation-artifact]"
    must_not: "[route-context, assign-executors, ship-before-validation]"
    skip_artifacts_when: artifact_gates.quickCommitSkip
agent_structure:
  mode: single_executor
baseline_metrics:
  execution_time:
    unit: ms
    source: implementation-artifact.executionDurationMs
  token_usage:
    unit: tokens
    source: implementation-artifact.tokenUsage.total
  test_pass_rate:
    unit: ratio
    source: validation-artifact.testsPassed / validation-artifact.testsExecuted
  test_coverage:
    unit: percent
    source: validation-artifact.coveragePercentage
  review_failure_rate:
    unit: ratio
    source: review-artifact.reviewFailures / 1
  validation_failure_rate:
    unit: ratio
    source: validation-artifact.validationFailures / 1
  retry_count:
    unit: count
    source: validation-artifact.retryCount
  tool_invocation_count:
    unit: count
    source: implementation-artifact.toolInvocationCount
optimization:
  artifact_paths:
    implementation: agent-runtime/artifacts/implementations/implementation-issue-{n}.json
    review: agent-runtime/artifacts/reviews/review-issue-{n}.json
    validation: agent-runtime/artifacts/validation/validation-issue-{n}.json
    harness_output: agent-runtime/artifacts/optimization/harness-issue-{n}-{phaseRunId}.json
    product_dev_output: agent-runtime/artifacts/optimization/product-development-{id}.json
  editable_schema: agent-runtime/config/harness-editable.yml
  safelist: agent-runtime/config/harness-safelist.yml
  config_tool: agent-runtime/scripts/harness_config.py
  dry_run_default: true
  root_cause_categories:
    - context_underloaded
    - context_overloaded
    - wrong_executor_domain
    - insufficient_tdd_evidence
    - review_gap
    - validation_failure
    - tool_overuse
    - phase_loop
    - artifact_incomplete
    - architecture_unclear
  schemas_dir: agent-runtime/docs/schemas/
benchmark:
  enabled: true
  thresholds:
    execution_time_regression_ratio: 0.1
    token_usage_regression_ratio: 0.1
    failure_regression_count: 0
# ADR-003 issue artifacts vs quick GitHub commits (scratch/debug).
# Source of truth for agent behavior. CI mirror lives in .github/workflows/pr.yml
# (skips validate-artifacts when branch lacks issue-<N>). Do NOT teach agents to
# edit pr.yml or Tier-1 rules from .worktrees/debug — that slot resets to main;
# promote config changes via agent/runtime → PR like any harness change.
artifact_gates:
  issueBranchPattern: "issue-([0-9]+)"
  requireIssueArtifactsWhenBranchMatchesIssue: true
  quickCommitSkip:
    enabled: true
    worktreePathContains: ".worktrees/debug"
    branchNames:
      - scratch/debug
    # Both local signals above AND branch must lack issue-<N> (matches CI).
    requireBranchLacksIssueSuffix: true
    recommendedBranchPrefixes:
      - "fix/"
      - "chore/"
      - "docs/"
    skipEmit:
      - implementation-artifact
      - intent-review-artifact
      - review-artifact
      - validation-artifact
      - harness-optimization-artifact
    # Still expected on GitHub for non-issue PRs (pr.yml always-on jobs).
    ciStillRuns:
      - lint-and-typecheck
      - bandit
      - gitleaks
    # Simple YAML loader: one-line string only (no >- blocks).
    agentBehavior: "When cwd contains .worktrees/debug (or branch is scratch/debug) and the working branch name does not match issue-<N>: skip Meta workflow-cache gate, skip Executor/Review ADR-003 artifact emit, open a short PR, merge, reset scratch/debug to origin/main. Never use this path for issue-<N> work."
# Context load efficiency — layers from cheapest/reuse to heaviest.
# Prose SSOT: agent-runtime/docs/agent-runtime.md § Context hierarchy (efficiency).
# Injection prefix order for cache hits: workflow_prompt_cache.injectionOrder below.
context_hierarchy:
  layers:
    - id: L0_tier1_rules
      role: always_on
      note: core-safety, core-orchestration, mcp-usage, git-baseline
    - id: L1_workflow_cache
      role: planned_reusable
      note: parent-cache + issue-context-cache (local, gitignored); highest prefix reuse
    - id: L1b_harnessUtility
      role: routing_index
      note: skills / rulesTier2 / mcps / tools index inside child cache
    - id: L2_focus_context_plan
      role: session_filter
      note: Load / If Needed / DO NOT Load — do not ignore parentDoNotLoad
    - id: L3_skills_tier2_docs_code
      role: model_payload
      note: one primary domain skill; Tier-2 rules only when selected; docs from issueLoadProfile; code majority of window
    - id: L4_implementation_artifact
      role: observed_telemetry
      note: contextFilesLoaded, skillsLoaded, rulesLoaded, mcpsUsed, toolsUsed, tokenUsage — fill after run
    - id: L5_review_validation_harness
      role: gates_and_optimize
      note: ADR-003 CI artifacts + harness-optimization; not default session prompt filler
  antiPatterns:
    - load_all_tier2_rules
    - load_all_skills
    - inject_sibling_issue_caches
    - paste_prior_artifacts_into_next_turn
    - ignore_doNotLoad
workflow_prompt_cache:
  artifactsDir: agent-runtime/artifacts/workflow-cache
  # Meta must not assign Executor unless child cacheStatus == valid.
  requireValidCacheBeforeExecutor: true
  # meta_prepare_executor.py bootstraps missing parent/child caches automatically.
  ensureOnMetaEntry: true
  # Stable blocks first → volatile last (KV prefix reuse across Meta/Executor/Review ticks).
  injectionOrder:
    - parentScopeBlock
    - parentDoNotLoad
    - harnessUtility
    - issueLoadProfile
    - phaseCacheBlocks
    - promptCacheBlock
    - requiredModulesCodeAndModuleMd
  # Review/Validate skills stay out of Executor harnessUtility (phase-scoped).
  executorSkillsOnly:
    - domain/backend
    - domain/ui-ux
    - domain/data-platform
    - domain/machine-learning
    - standalone/ui-ux-design
  reviewSkillsDeferred:
    - standalone/intent-review
    - standalone/guardrails
    - standalone/validate
  bootstrap:
    pinBranch: HEAD
    sourcePaths:
      - .cursor/skills
      - agent-runtime/docs
  # Known epics — ensure_workflow_cache uses these when Parent/#slice missing from CLI.
  # parentScopeBlock uses \n escapes (simple YAML loader; no literal | blocks).
  epicRegistry:
    # 175 — Operations-System Orchestration PRD; registered 2026-08-17 for #1138
    # (repository-layer production fix lane, OPS-REPO-FIX routing).
    175:
      defaultSliceId: OPS-REPO-FIX
      handoffPath: docs/adr/013-operations-pipeline-spine.md
      parentScopeBlock: "# Parent #175 - Operations pipeline, repository-layer fixes\n## Product boundary\n- Production defect fixes in the repository/model layer of the operations pipeline (orders, returns, fulfillment)\n- No new features, no API shape changes, no UI\n## Locks\n- Datetime column semantics: match the column's declared tz-awareness exactly; regression tests must run against real Postgres/asyncpg where the defect manifests (SQLite masks tz mismatches)\n- One issue, one defect - do not sweep sibling columns without their own issue\n"
      doNotLoad:
        - apps/
        - docs/product/design/
        - docs/integrations/tiktok_corpora/
    977:
      defaultSliceId: AGT-W1A
      handoffPath: docs/adr/069-agent-tool-registry-and-write-path.md
      parentScopeBlock: "# Parent #977 - Agent tool registry, Optimize Product (constant)\n## Product boundary\n- Only optimize_product_2; the other 10 workflows arrive in P13\n- New module services/agent/tools/ only - the legacy services/execution/runner.py registry and its coarse chains stay registered and UNTOUCHED\n- No UI, no API routes, no migrations in this block\n## Architect locks\n- ADR-069's 6-tool granularity table is EXACT: get_product_information, get_seo_keywords (bundles seo_words+suggestions), upload_product_image, update_product_listing, update_product_price, check_product_status - never collapse to a mega-tool nor explode to per-endpoint tools\n- Tool input schemas carry NO identifier parameters; the executor injects the bound product identity from run context (ADR-070 d.1)\n- The model-facing JSON schema is DERIVED from the declared input model, never hand-written\n- Marketplace access only via the guarded factories (ProductionReadResources / SandboxWriteResources) - never a direct client (ADR-068 d.6b)\n- Capability names are business-semantic English snake_case, never vendor endpoint names\n- Tests live flat in tests/unit/ per repo convention - do not introduce tests/unit/agent/ subdirectories\n## Epic deferrals\n- ToolExecution idempotency ledger, claim-then-execute, crash reconciliation - ADR-073 / W3-A\n- Playbook allowlists and the playbook direction of cross-validation - ADR-072 / W2-A\n- The sanitization transform itself - ADR-070 / W1-C\n- The 4 unregistered legacy tools (fulfillment.process_order, returns.prevent_*) are FLAGGED, never fixed here\n"
      doNotLoad:
        - apps/
        - ios/
        - docs/product/design/
        - docs/integrations/tiktok_corpora/
        - Sibling issue context caches
    978:
      defaultSliceId: AGT-W1B
      handoffPath: docs/adr/071-llm-service-openai-adapter.md
      parentScopeBlock: "# Parent #978 - LLM service, neutral blocks over OpenAI adapter (constant)\n## Product boundary\n- New module services/agent/llm/ only; no prompts, no playbooks, no loop\n- No UI, no API routes, no migrations in this block\n## Architect locks\n- Base model is OpenAI GPT-5.4 nano via the Responses API - not Anthropic, superseding older plan drafts\n- Provider wire types NEVER leave the adapter module; the agent depends on the protocol, never the adapter\n- Stateless: never previous_response_id, never provider-side stored threads - the window is rebuilt every call\n- Non-streamed complete turns; token deltas are deliberately NOT implemented (assistant.text.delta is reserved only)\n- Config precedence is playbook override > environment > defaults; OPENAI_API_KEY via require_env, fail-closed, never an empty-string default\n- CORRECTION to the implementation handoff, flagged to the Architect: the handoff says the 3 no-LLM contract tests were lifted. ADR-068 decision 6 says the OPPOSITE - they are kept UNCHANGED and 3 new boundary tests are added alongside. ADR-068 wins. Do not modify test_rules_copy_layer_contract.py, TestRuleBasedNoLlmDependency, or the dashboard listing-rules test.\n- Tests live flat in tests/unit/ per repo convention\n## Epic deferrals\n- Fallback chains, multi-provider registry, failover\n- Budget enforcement and per-shop daily caps (P9); per-run iteration caps (W3-A)\n- Structured output validation and repair - user-deferred\n"
      doNotLoad:
        - apps/
        - ios/
        - docs/product/design/
        - docs/integrations/tiktok_corpora/
        - Sibling issue context caches
    979:
      defaultSliceId: AGT-W1C
      handoffPath: docs/adr/070-agent-safe-sanitization-contract.md
      parentScopeBlock: "# Parent #979 - Agent-safe sanitization contract (constant)\n## Product boundary\n- New module services/agent/sanitize/ plus the shared banned-pattern source in packages/contracts\n- Optimize Product tool surface only; no UI, no API routes, no migrations\n- The existing TypeScript guard is rewired to the shared source with ZERO behavior change; apps/demo re-exports and needs no edit\n## Architect locks\n- Provenance (source: juli | vendor | seller) is assigned SERVER-SIDE from field origin - text can never relabel itself. No buyer role. Field is named source, not role.\n- Every truncation is signalled with {truncated, omitted_count} - silent shortening is structurally forbidden\n- Compaction is DETERMINISTIC server code; no model-side summarization, so goldens stay reproducible\n- Machine values only: ISO-8601 UTC, numeric money beside a currency field, numeric rates; display formatting stays in the copy layer\n- retryable derives from the curated allowlist {100005, 100006, 36009003} plus transport errors; uncatalogued failures are NOT retryable (fail-closed)\n- Both chokepoints fail closed; new banned patterns must compile in BOTH the JS and Python regex dialects\n- Tests live flat in tests/unit/ per repo convention\n## Epic deferrals\n- Repair retry and rules-template fallback - user-deferred with structured output (P7); build the seam only\n- Opaque per-run reference ids for mid-run entity selection - reserved by ADR-070, not needed by Optimize Product\n- Invisible-Unicode and bidi stripping, adversarial fixture suite - ADR-075 / W4-A\n- Multi-product Optimize Product card shape - flagged open question at the ActionCard layer\n"
      doNotLoad:
        - apps/dashboard/
        - ios/
        - docs/product/design/
        - docs/integrations/tiktok_corpora/
        - Sibling issue context caches
    1115:
      defaultSliceId: AGT-W3A
      handoffPath: docs/adr/073-agent-execution-loop-and-write-path-hardening.md
      parentScopeBlock: "# Parent #1115 - Agent execution loop, WorkflowRunner and write-path hardening (constant)\n## Product boundary\n- New module services/agent/runner/ plus additive columns on workflow_runs (new table) and tool_executions\n- No UI, no API routes, no Celery tasks - those are W3-B; no approval authorization - that is W4-A\n- Consumes the merged W1/W2 surfaces unchanged: LLMService/AssistantTurn blocks, ToolRegistry/ToolSpec, Playbook/TerminationPolicy, compose(), the two sanitizer chokepoints\n## Architect locks\n- Termination values are READ off OPTIMIZE_PRODUCT_TERMINATION_POLICY. The runner never defines its own constants; a literal 6 or 300 in runner code is a defect.\n- Every loop exit records exactly one stop_reason. No silent exits. The stop_reason to WorkflowRunStatus mapping is TOTAL and test-asserted in both directions, including worker_lost (ADR-074 amendment) and output_validation_failed (reserved for P7, unreachable now).\n- Cancellation and timeout are CHECKPOINT-based, never preemptive. An in-flight mutation is never interrupted. Checkpoints are the top of each iteration and immediately before each tool execution.\n- A crash-window operation that cannot be verified by read-back FAILS CLOSED to tool_error_unrecoverable. Never a maybe-duplicate write.\n- The basis snapshot is a server-held SHA over mutable product fields, held in run state and INVISIBLE to the LLM. Compare-before-write rejects before signing.\n- Exactly one bounded revalidation per operation. A second conflict stops the run with concurrency_conflict. Unbounded revalidation against an actively-editing seller is the rejected design.\n- The LLM never sees vendor endpoints, credentials, raw payloads, or basis hashes. Tool results reach the conversation only through guard_inbound_tool_result; the final response leaves only through guard_outbound_agent_output.\n- Tool dispatch is allowlisted by the playbook. A tool name that is unregistered or absent from the playbook is refused, never dispatched.\n- Writes go to the SANDBOX shop only. The reference-shop production credential is read-only. Production write is a later capability flip on the ADR-068 unlock list, not this epic.\n- Tests live flat in tests/unit and tests/integration per repo convention.\n## Epic deferrals\n- Conversation storage (P-CS) - the workflow_runs.state JSONB blob behind the ConversationStore protocol is the stand-in; no Redis chat storage, no conversations/messages tables\n- Structured output (P7) - the final response stays prose; output_validation_failed is reserved in the enum so P7 adds no vocabulary later\n- The EventSink protocol and the event union - defined by W3-B slice P8-1, which lands first; this epic consumes that protocol and must not define a second one\n- Celery task shells, the SSE endpoint and the reaper - W3-B\n- Approval authorization, decision-request options and consent binding - W4-A\n"
      doNotLoad:
        - apps/
        - ios/
        - docs/product/design/
        - docs/integrations/tiktok_corpora/
        - Sibling issue context caches
    1116:
      defaultSliceId: AGT-W3B
      handoffPath: docs/adr/074-agent-event-streaming-and-relay.md
      parentScopeBlock: "# Parent #1116 - Agent event streaming, relay and SSE (constant)\n## Product boundary\n- New modules services/agent/events/ and the agent run routes, plus one new table (workflow_run_events), the agent_runs Celery queue, the reaper beat task, packages/contracts/src/agent-events.ts and one fetch-streaming helper in apps/demo/src/lib/\n- No runner - that is W3-A; no approval authorization - that is W4-A; no demo UI reducer or views - that is W4-B\n## Architect locks\n- Postgres is the REPLAY AUTHORITY, Redis is best-effort delivery. Anything a client sees must exist as a workflow_run_events row first.\n- Sequence numbers are minted by the WorkflowRunner from its run-state blob, never by this layer. The unique (workflow_run_id, sequence_number) index turns a crash-replayed emit into a no-op.\n- PersistingEventSink order is INSERT, COMMIT, then PUBLISH. Publish failure is logged and swallowed: liveness degrades, correctness does not. A subscriber can never observe an uncommitted event.\n- The SSE endpoint SUBSCRIBES BEFORE IT REPLAYS. Dedupe is server-side via last_sent tracking; clients never deduplicate.\n- If subscribe fails, degrade to polling Postgres every 2s. Redis is optional for availability, not only for correctness.\n- Eight event types, one envelope carrying v: 1. workflow.failed is the single failure-class terminal covering failed, cancelled and timed_out; stop_reason carries the precision and ADR-073's total mapping stays the single authority. assistant.text.delta stays RESERVED and unimplemented.\n- The Pydantic models are the emitting source; the TypeScript union mirrors them; one golden fixture per event type lives in packages/contracts and BOTH languages test against the same files.\n- Cross-tenant run ids return 404, never 403. No existence oracle.\n- The client consumes SSE via fetch plus ReadableStream, never native EventSource: bearer auth stays in headers, reconnect is owned, failures are inspectable, AbortController cancels cleanly.\n- The Celery broker defaults to memory:// today. The fail-closed boot assertion is the only thing standing between a green boot and a silently non-durable agent path; memory:// stays the unit-test default.\n- Reusing tool_error_unrecoverable for infrastructure death would corrupt the execution-quality metric. worker_lost is the additive member for it.\n- Tests live flat in tests/unit and tests/integration per repo convention.\n## Epic deferrals\n- The confirmations endpoint is a RESERVED SHAPE only - authorization, decision-request options and consent binding are W4-A\n- The demo reducer, staged run view and option picker - W4-B; this epic ships the transport helper only\n- assistant.text.delta and any token-level streaming - reserved, out of scope\n- The live browser gate needs W3-A's runner merged and is the wave-close checkpoint, not a contracts-stage item\n"
      childSlices:
        1132: AGT-W3B-UI
      doNotLoad:
        - apps/
        - ios/
        - docs/product/design/
        - docs/integrations/tiktok_corpora/
        - Sibling issue context caches
    # 1228 — W4 PRD; registered 2026-08-20. Two lanes under one parent:
    # AGT-W4A (P-CRED, ADR-081) is the default; the P-IM slices route to
    # AGT-W4B via childSlices and are given ADR-077 with --handoff.
    1228:
      defaultSliceId: AGT-W4A
      handoffPath: docs/adr/081-refresh-token-rotation.md
      parentScopeBlock: "# Parent #1228 - W4: credential lifecycle (P-CRED) and measurable runs (P-IM) (constant)\n## Which lane you are in\n- W4-A / AGT-W4A - P-CRED, ADR-081: #1230 #1231 #1232 #1233 #1234\n- W4-B / AGT-W4B - P-IM, ADR-077: #1215 #1216 #1219\nRead only your lane's ADR. The other lane is a different executor's tree; never edit its files.\n## Product boundary\n- W4-A touches core/security/, integrations/tiktok/, workers/tasks/, models/models.py, repositories/repos.py, and exactly one migration\n- W4-B touches services/agent/runner/ and workers/impact_reader/ only - no migration in this lane, both columns already exist\n- No UI, no API routes, no approval authorization in either lane - that is W5\n## Architect locks - both lanes\n- Migration numbering is ASSIGNED BY META, never read from head: #1230 takes 038. Revision ids stay <= 32 characters, or the upgrade fails at run time with StringDataRightTruncation.\n- A shape that crosses a module boundary is a TypedDict or Pydantic model, never an untyped dict. Six W3 defects were a producer and a consumer disagreeing about a key while both test suites stayed green.\n- A slice that changes such a shape adds one test that calls the REAL consumer. A test that hand-builds the payload does not satisfy this criterion.\n- Credential material never reaches a persisted payload, a log line, an artifact, or argv. Assert it; do not assume it.\n- Tests live flat in tests/unit and tests/integration per repo convention.\n## Architect locks - W4-A only\n- ADR-081 supersedes ADR-080 wherever they differ. ADR-080 was never implemented and the beat it specifies would refresh nothing.\n- status is a plain varchar checked in application code, following the workflow_runs.status precedent. No CREATE TYPE.\n- refresh_token_expires_at is populated only if the vendor sends it; nothing may assume it is ever non-null.\n- Do not rename token_expires_at to access_token_expires_at - ADR-081 d.7 rejects that rename explicitly.\n- W4-2 and W4-3 never touch the migration; #1230 is the only schema slice in this wave.\n## Architect locks - W4-B only\n- required_steps_completed is a RECORDED OUTCOME FACT, never a termination rule. ADR-073 d.2: a final_response without the required mutation is honest data, not a synthetic failure. Never change stop_reason or status to express it.\n- running_seconds_elapsed excludes paused time because the runner does not accumulate during the pause - never by subtracting afterwards.\n- No termination decision reads the mirrored column; evaluate_checkpoint keeps comparing the authoritative float.\n- No new numeric literal in core.py or termination.py - policy values are read off the termination policy.\n## Epic deferrals\n- Seller approval authorization, decision requests and consent binding - W5 / ADR-075\n- Production writes - the capability flip is a later ADR-068 unlock, not this wave\n- The first real impact reading needs a production-shop write and is the W5 gate, not a W4 slice\n## Scope protocol\n- Found a gap outside your spec? If your own acceptance criterion is false without the fix, fix it and say so in the PR. Otherwise REPORT it and touch nothing. Never open a new issue.\n"
