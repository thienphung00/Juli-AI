    1213:
      defaultSliceId: AGT-W5A
      handoffPath: docs/adr/075-agent-approval-gate-and-security-prerequisites.md
      parentScopeBlock: "# Parent #1213 - W5: sellers can approve Juli's changes (P9 + P14) (constant)\n## Which lane you are in\n- W5-A / AGT-W5A - P9 approval gate, ADR-075 d.1 and d.2: #1221 #1222 #1224 #1225 #1181\n- W5-A / AGT-W5A-DP - the wave's ONLY schema slice: #1214\n- W5-B / AGT-W5B - P14 security prerequisites, ADR-075 d.3 d.4 d.5: #1217 #1218 #1223\nRead only your lane's section. The other lanes are other executors' trees; never edit their files.\n## Product boundary\n- W5-A touches services/agent/runner/, services/agent/events/payloads.py, api/routes/agent_runs.py, workers/tasks/, packages/contracts/src/agent-events.ts\n- W5-A-DP touches exactly one migration plus models/models.py and repositories/repos.py\n- W5-B touches core/security/, services/agent/sanitize/, the boot assertion, and route dependencies\n- No demo UI in this wave - the option picker and staged run view are W6 / ADR-076\n## Architect locks - all lanes\n- MIGRATION NUMBERING IS ASSIGNED BY META, never read from head. #1214 takes 039 and chains off 038_credential_refresh_cols. The issue body says 037 on 036 - that is STALE: W4 landed 037_required_steps_completed and 038_credential_refresh_cols after the issue was written. #1269 takes 040 and chains off 039_run_confirmations. Note main is still at 038 while the wave carries 039 - reading head from the wrong base yields the wrong chain. Revision ids stay <= 32 characters or the upgrade fails at run time with StringDataRightTruncation.\n- OWNER DECISION 2026-08-21, ADR-082: the bound product is DERIVED SERVER-SIDE inside the approve transaction - no product_id parameter on the agent path. The rule is highest products.revenue first, tiebroken by tiktok_product_id ascending; products.revenue is the denormalised ETL-refreshed column from migration 030, NOT a windowed aggregate, and this wave introduces no window. The binding is a SNAPSHOT written once - never re-derived mid-run, or a revenue change could move the write onto a listing the seller never saw. A shop with zero products returns 409 naming the condition, never a 500 from the NOT NULL violation. Consent lives at the CONFIRM pause, not at approve.\n- workflow_runs.required_steps_completed ALREADY EXISTS (migration 037, W4 #1235). Item 3 of #1214 is DONE. Do not add the column a second time; read it where you need it.\n- The run-status vocabulary lives in services/agent/status.py, NOT services/agent/runner/status.py - #1139 relocated it to break an import cycle. StopReason.CONFIRMATION_DECLINED maps to COMPLETED; CONFIRMATION_EXPIRED maps to CANCELLED. The mapping is total and both directions are test-asserted.\n- resume_agent_workflow is NOT a shell. workers/tasks/agent_workflow.py already implements it end to end and celery_app.py already routes it to the agent_runs queue. What is missing is a CALLER. Do not rebuild the task.\n- The reaper is NOT a stub either. Both sweeps are implemented and beat-scheduled: 4h waiting_approval expiry to confirmation_expired, and the 5-min stale sweep to worker_lost.\n- services/demo_execution/ is quarantined by a static AST import-boundary test that walks the transitive graph from that package and forbids it reaching integrations.tiktok, services.execution, repositories, or api. Approval-transaction code goes in a NEW module reachable from api/routes/, never inside services/demo_execution/.\n- A shape that crosses a module boundary is a TypedDict or Pydantic model, never an untyped dict, and the producer's tests call the REAL consumer. Six W3 defects were a producer and a consumer disagreeing about a key while both suites stayed green.\n- Cross-tenant and nonexistent both return 404, never 403. No existence oracle, anywhere.\n- Tests live flat in tests/unit and tests/integration per repo convention.\n- Comments in api/routes/agent_runs.py label the confirmation-authorization work W4-A. That label is stale - it is W5-A. Correct the comments you are already editing; do not sweep the rest.\n## Architect locks - W5-A only\n- OWNER DECISION 2026-08-21, option A: approve-is-run-creation TAKES OVER POST /v1/demo/decisions/{action_card_id}/approve, and the DemoExecutionRecord dry-run behaviour on that path is RETIRED. Today that route calls approve_decision_dry_run and never creates a workflow_run. After #1222 it is the only way a run comes into existence, it authenticates via get_current_user + get_active_shop, and the atomic transaction lives in a NEW module reachable from api/routes/ - never inside services/demo_execution/, which a static AST import-boundary test quarantines. #1217 deliberately left this one route unauthenticated because it is yours; bringing it under auth is part of #1222.\n- The standalone POST /v1/demo/runs must stop being a way to create a run without an approved card. Assert that structurally by scanning route handlers, not only by testing the happy path.\n- params_sha DOES NOT EXIST yet. concurrency.py::_hash_field is a different, narrower mechanism over individual mutable product fields for the stale-read guard - do not rename it, do not reuse it as the consent fingerprint. Define params_sha deterministically over the tool params and document the canonicalization; a fingerprint that depends on dict iteration order fails intermittently in production.\n- proposed_change is stored VERBATIM. The audit is what was shown, never a re-derivation.\n- workflow.approval_required gains options[] ADDITIVELY; the envelope v: 1 does not change. The Pydantic payload and the TypeScript mirror in packages/contracts move in the SAME PR or the cross-language contract test fails CI.\n- Decline is a conversation, not a kill: the run ends completed / confirmation_declined with the prior analysis intact. Never cancelled, never failed.\n- required_steps_completed is a recorded outcome fact, never a termination rule (ADR-073 d.2). A decline that records False is honest data, not a failure.\n## Architect locks - W5-B only\n- BASELINE CORRECTION, verified against the tree on 2026-08-21. #1217's body says an empty SUPABASE_JWT_SECRET verifies every token. IT IS FALSE. get_current_user calls require_env(SUPABASE_JWT_SECRET) (core/security/dependencies.py) and api/main.py asserts it again in lifespan(); ADR-075's own baseline note says the same. Do not rewrite auth to fix a hole that is already closed - write the VERIFICATION test and move on.\n- SECOND BASELINE CORRECTION: all four agent-run routes (create, events/SSE, cancel, confirmations) ALREADY depend on get_active_shop and already 401 without a JWT, the SSE one included. Those acceptance criteria are verification tests, not builds. SUPERSEDED 2026-08-22 for slices after #1222 merged: the approve route at POST /v1/demo/decisions/{action_card_id}/approve is now authenticated real run creation and POST /v1/demo/runs no longer exists, so api/routes/demo_execution.py is the run-creation surface and is editable by a slice whose own brief names it. The do-not-edit note applied only while #1222 was in flight.\n- The real gap #1217 closes is the CONSOLIDATED assert_agent_runtime_config() with six individually-named checks, called at BOTH API boot and worker boot. The broker guard today runs at worker/beat boot only; the API process never calls it.\n- Check 4 has no per-tool config to iterate: all three WRITE tools resolve through one shared build_write_resources / load_sandbox_write_resources path. Assert resolvability for each registered WRITE name against that one resolver; do not invent a per-tool config table.\n- The existing memory:// broker assertion keeps its current behaviour and message. Absorb it into the consolidated check; never add a second broker check beside it.\n- There is NO security-event concept in the codebase - only structured logger.warning(extra={...}) call sites (webhook signature failures, JWT rejections). Whatever #1223 emits, follow that existing convention rather than inventing an event system mid-slice.\n- .importlinter.toml caps cross-package imports at depth 2: api may import juli_backend.integrations.tiktok but NOT juli_backend.integrations.tiktok.rate_limiter. Check the edge before you choose where the inward limiter lives; the existing 429 + Retry-After precedent is services/action_cards/refresh_cooldown.py behind api/routes/action_cards.py.\n- The sanitizer chokepoint today is a scan-and-BLOCK gate over banned patterns - guard_inbound_tool_result replaces the whole result on a hit; it strips nothing. #1218 adds the first stripping behaviour to that module, and no invisible-Unicode, control-character or bidi handling exists anywhere in services/agent/sanitize/ today.\n- The sanitizer tests are bespoke per-file with hardcoded golden paths; no fixture-directory discovery pattern exists to build on. #1218's one-file-per-attempt requirement means introducing that pattern.\n- A deployment with AGENT_WORKFLOWS_ENABLED unset stays unaffected - the fail-safe-by-omission shape does not change.\n- Cancel is NEVER throttled. It is the safety valve during exactly the storm that trips the other limits.\n- Over-stripping is the sanitizer's failure mode to guard: legitimate Vietnamese diacritics and legitimate emoji must survive untouched, proven by a fixture.\n## Epic deferrals\n- The demo option-picker UI, the staged run view and Supabase sign-in in apps/demo - W6 / ADR-076\n- RLS across the 13 tables and the production-write capability flip - W7 / P-PROD\n- Structured output (P7) and the per-workflow template - W9\n- The first real impact reading - OWNER DECISION 2026-08-21: W5's gate runs against the SANDBOX shop only. No production write in this wave. Observation 2 is recorded as still blocked with its reason, and ADR-077's gate stays open; producing a suppressed reading and calling it a reading is explicitly forbidden by #1226 itself.\n## Scope protocol\n- Found a gap outside your spec? If your own acceptance criterion is false without the fix, fix it and say so in the PR. Otherwise REPORT it and touch nothing. Never open a new issue.\n"
