      parentScopeBlock: "# Parent #1077 - Single-source seller-copy contract, TypeScript consumers (constant)\n## Product boundary\n- TypeScript consumers of packages/contracts/seller-copy-banned-patterns.json only: packages/ui, packages/contracts' TS surface, apps/demo\n- The Python guard and services/agent/sanitize/ belong to #979 - never edit them from this epic\n- No backend code, no migrations, no API routes\n## Architect locks\n- packages/contracts/seller-copy-banned-patterns.json is the single source of truth. A slice may READ it; a slice may not fork it, shadow it, or edit it to make a consumer pass.\n- A pattern must compile in BOTH the JS and the Python regex dialect. A change that suits only the TypeScript side breaks the contract ADR-070 d.6 exists to hold.\n- The list governs Vietnamese seller-facing copy. It is not a general-purpose word filter and must not be applied to surfaces it was not designed for - see #1014, where extending it to English model-facing schema text was correctly declined and the decision pinned in a test.\n- Tests prove WIRING, not contents: mutating the shared source must change the consumer's behaviour. A test that hardcodes the expected patterns re-creates the drift this epic removes.\n## Why this epic is separate from #979\n- ADR-070 d.6 spans two runtimes. #979 is routed executorDomain backend, correct for the sanitize package. The TypeScript half is ui-ux work, and routing it as backend briefs the Executor with the wrong domain skill. #1002 proved this: the Executor correctly self-declared ui-ux and executor_domain_matches_cache caught the mismatch. The gate was right; the routing was wrong.\n## Epic deferrals\n- Any change to the pattern list's CONTENTS - that is a copy decision, not a plumbing one\n- The Python guard and services/agent/sanitize/ - #979\n"
