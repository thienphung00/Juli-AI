      parentScopeBlock: "# Parent #758 — Decisions plan review (constant)\\n## Product boundary\\n- apps/demo mobile-web only; replaces the five-stage review (Why -> Analytics -> Inputs -> Preview -> Approve) with a sectioned agent-proposed plan card\\n- No native iOS/Android; no apps/dashboard changes; ADR-023 four-destination IA unchanged\\n## Architect locks (ADR-055)\\n- NO LLM LAYER: rule-based, every string pre-authored; 'ask a follow-up' reveals authored copy, never a conversation\\n- Juli pre-commits a value for EVERY field; no blank-by-default seller field (sole exception: create_hero_product_1 uploads)\\n- Uniform Situation -> Decision -> Details spine across all workflows; sections summarise (one row + affordance), never enumerate; expansion adds and keeps the summary visible\\n- Impact block shows the tied Main KPI's REAL current value and trend plus a directional goal; NO projected magnitude (barred by ADR-011 display-grade, ADR-032 'not claim experiment dGMV as Juli ROI', and deferred mediated impact); ONE state only (Mock executions are dry-run, so no effect exists to observe)\\n- LIVE hours is tied to no workflow - leave unmapped\\n- Repeat consent: completed-only, once per workflow kind, and never on a workflow whose shipped copy promises Juli will not act unaided (6 of 11 excluded); grants pre-approval WITH notification, never silent automation\\n- Execution progress is a lifecycle line + step fraction; steps behind one expansion; no time estimate, no cancel (the model has neither)\\n## Scope cuts (deferred, not reversed)\\n- risks display and decision-options editing are OUT for this epic; ADR-055 items 9 and 3 remain the design of record\\n- ratio-KPI numerator/denominator storage is flagged only - owned by the CDP track\\n## Evidence status\\n- Card structure, impact presentation and progress design are ENGINEERING JUDGEMENT: a research pass returned zero surviving claims for dataviz UX and impact framing. Unknown and load-bearing: whether users