    1057:
      defaultSliceId: AGT-W2A
      handoffPath: docs/adr/072-agent-prompt-architecture.md
      parentScopeBlock: "# Parent #1057 - Agent prompt architecture, Optimize Product (constant)\n## Product boundary\n- New modules services/agent/prompts/ and services/agent/playbooks/ only\n- No UI, no API routes, no migrations, no changes to services/agent/tools/ or sanitize/\n## Architect locks\n- The Playbook is SAFETY SURFACE: data only, so a future prompt optimizer can never mutate behaviour through it. The prose file is the entire tuning surface.\n- workflow_key is the system-wide key optimize_product_2 (matches WORKFLOW_TOOL_CATALOG and the outcome vocabulary). The prompt DIRECTORY is optimize_product - a different namespace. compose() maps key to directory explicitly and raises on an unknown key.\n- Run data is NEVER spliced into prompt text; it arrives as the opening source: juli context message (ADR-070). {playbook} is the only template slot.\n- Released vN.md is immutable: changes become vN+1.md, never an in-place edit. prompt_sha256 attribution depends on it.\n- v1's output contract is prose guidance plus the worked example ONLY. When P7 lands its machine schema the section tightens via an explicit bump to v2 - P7 must not edit v1.\n- Instructions in English, seller-facing output Vietnamese with the ban address form; banned patterns and _Avoid_ aliases checked against the SHARED sources, never a hand-copied list.\n- Tests live flat in tests/unit/ per repo convention\n## Epic deferrals\n- The agent loop that consumes compose() - ADR-073 / W3-A\n- prompt_version / prompt_sha256 COLUMNS on workflow_runs - P-CS is deferred; this epic specifies the fields, it does not add schema\n- Structured output schema and repair - user-deferred (P7)\n## Known divergence\n- ADR-072 d.6 says the token budget is tiktoken-measured; tiktoken is an undeclared dependency, so the gate uses the stdlib estimate_tokens proxy (rounds up, fails safe). Recorded for the Architect.\n"
