# AGT-W9D-UI — v1 build lane; see agent-runtime.config.yml epicRegistry and the epic's ADR.
AGT-W9D-UI:
  executorDomain: ui-ux
  requiredDocs:
    - dictionary.md
    - "{handoffPath}"
