# ONB-UI — first-connect onboarding, interface lane; epic #1951, design ADR-103.
#
# Design settled 2026-09-15 (owner grill), ADR-103 d.14-d.18:
#   route /onboarding, reachable ONCE per shop; a return visit lands on /decisions
#   layer 0  the three-step cold-start read + the Zalo/phone ask (#1973)
#   layer 1  Big Reveal -- the First Connect Score with its denominator disclosed
#   layer 2  3 Insights -- each IS an ActionCard, headlined by its KPI area
#            (layers 1 and 2 share ONE scroll; the score counts up ~700-900ms and
#             lands under prefers-reduced-motion, insights stagger behind)
#   layer 3  Next Steps -- a tutorial that HANDS OFF to the real plan review
# HARD CONSTRAINT: /onboarding never renders an approve control. The handoff opens
# the TOP insight at /decisions/recommendations/[id]. A second path to run creation
# violates S-FR-2; this is the one thing this slice must not do.
# S-FR-1 is NOT violated by the new route -- it binds workflows, not onboarding.
#
# THE GATE (d.20, supersedes d.19a). /onboarding renders ONLY when the shop has
# THREE surfaced insights. Fewer -> the seller goes to /decisions (its empty state
# already exists at recommendations-panel.tsx:185-196) and the onboarding record is
# left UNSPENT, so the flow fires on a later visit. The gate is re-evaluated on
# every entry until it opens once. There is ONE state: no thin screen, no healthy
# screen, and the awaiting_data/no_source split is OFF this slice's critical path.
# "3" in the CTA is a literal the gate guarantees, not a count rendered from data.
#
# Depends on ONB-BE (score + launch gate) and ONB-DP (onboarding record).
# THREE INSIGHTS need #1701 (W9-A subject-scoped cards), NOT W10. ADR-087 d.2 is
# one live card per SUBJECT per workflow -- a concurrency rule, not a supply cap.
# Today cards key on (shop, workflow_key) with no subject, so one workflow gives
# one card; #1701 re-keys to (shop_id, workflow_key, subject_type, subject_ref)
# and Optimize Product alone then yields one card per product.
# THREE AREAS need W10-A/B/C (#1624 #1625 #1626), since an area is a workflow.
# Pre-W10 the three insights usually share one area; the headline is per card, so
# the render does not change.
ONB-UI:
  executorDomain: ui-ux
  requiredDocs:
    - dictionary.md
    - "{handoffPath}"
    - CONTEXT.md
    - docs/adr/103-first-connect-onboarding.md
    - docs/adr/094-demo-surface-splits-anonymous-replay-and-signed-in-runs.md
    - docs/adr/055-decision-plan-review.md
    - docs/product/design/design-context.md
  requiredModules:
    - apps/demo/src/components/recommendations-panel.tsx
    - apps/demo/src/components/plan-review-card.tsx
    - apps/demo/src/components/connect-shop-view.tsx
    - apps/demo/src/lib/analytics/main-kpis.ts
    - packages/contracts/src/review.ts
  loadWhenNeeded:
    - apps/demo/src/components/decisions-page-client.tsx
    - apps/demo/src/components/impact-block.tsx
  doNotLoad:
    - apps/dashboard/
    - ios/
    - backend/src/juli_backend/workers/
    - docs/integrations/tiktok_corpora/
    - docs/product/design/Flows/home/onboarding.md
    - docs/adr/098-stage-keyed-onboarding-layer.md
    - Sibling issue context caches
