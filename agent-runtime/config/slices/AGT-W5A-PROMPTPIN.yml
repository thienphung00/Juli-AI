# AGT-W5A-PROMPTPIN — #1213 W5 gate-walk chain, blocker #1359. Found on run
# ac992b92 immediately after #1356/#1357 (AGT-W5A-CONFIRMPROMPT) shipped:
# `approval.py::_resolve_optimize_product_prompt_pin` stamps
# `workflow_runs.prompt_version` from `composer.production_version()` (== 2),
# while `runner/core.py`'s two compose sites (`run()` line ~414 and the
# resume path ~575) compose from `self._playbook.version` (== 1) instead — so
# the recorded pin and the executed prompt can disagree, silently, and did:
# the DB row said `optimize_product.v2`, v1 is what actually ran. This
# defeats ADR-072 d.4 ("what runs is what was reviewed") and made #1357's fix
# inert — no run has ever executed v2.
#
# Sibling of AGT-W5A (same #1213 approval-gate lane) and of
# AGT-W5A-CONFIRMPROMPT (same gate-#1226 defect chain, same file family) but
# a DISTINCT file surface — runner/core.py's two compose call sites are the
# write target here, where CONFIRMPROMPT's write target was
# services/agent/prompts/ + composer.py's pin bump. composer.py, approval.py,
# and playbooks/optimize_product.py are READ-ONLY context for this slice:
# they already resolve/compose correctly (approval.py's
# `_resolve_optimize_product_prompt_pin` already calls
# `prompts_module.production_version()`) and are not the defect.
#
# THE FIX SHAPE, READ BEFORE EDITING:
# - runner/core.py must compose from `production_version(self._playbook.workflow_key)`
#   (composer.py), not `self._playbook.version` (the playbook's own version,
#   which describes its steps/policies, not the prompt pin) — at BOTH compose
#   sites (the fresh-run path and the resume/continuation path). A candidate
#   fix extracting a `_compose_prompt()` helper already exists uncommitted in
#   this worktree; verify it with tests before trusting it, don't rebuild
#   from scratch.
# - `v1` stays intact and reachable (composer.py already supports
#   requesting any released version by number) — this changes which version
#   NEW runs select by default, not v1's immutability or availability.
# - tests/unit/test_agent_runner_core.py::TestPromptStamping
#   (`test_compose_called_exactly_once_and_prompt_identity_is_stable`) is
#   ITSELF WRONG in the same way as the bug: its `expected_version`/
#   `expected_sha` are computed from `OPTIMIZE_PRODUCT_PLAYBOOK.version`
#   (hardcoded 1), so it would pass against either a correct or a buggy
#   runner as long as the playbook's own version stays 1. It must be
#   rewritten to assert against `production_version(workflow_key)` instead,
#   or it keeps validating the wrong invariant.
# - The new guard test (issue AC: "a test proves the three agree for every
#   registered playbook, and fails if the constants are made to disagree")
#   belongs alongside TestPromptStamping or as a focused new test — iterate
#   every key in `composer.PRODUCTION_PROMPT_VERSION` (currently one:
#   `OPTIMIZE_PRODUCT_PLAYBOOK.workflow_key`), not just the one playbook, so
#   the assertion holds as P13 registers more workflows.
AGT-W5A-PROMPTPIN:
  executorDomain: backend
  requiredDocs:
    - "{handoffPath}"
    - CONTEXT.md
    - docs/adr/072-agent-prompt-architecture.md
    - docs/adr/075-agent-approval-gate-and-security-prerequisites.md
  requiredModules:
    - backend/src/juli_backend/services/agent/runner/core.py
    - backend/src/juli_backend/services/agent/prompts/composer.py
    - backend/src/juli_backend/services/agent/approval.py
    - backend/src/juli_backend/services/agent/playbooks/optimize_product.py
    - tests/unit/test_agent_runner_core.py
  loadWhenNeeded:
    - tests/unit/test_agent_prompt_compose.py
    - tests/unit/test_agent_runner_resume_params_sha_binding.py
    - docs/adr/073-agent-execution-loop-and-write-path-hardening.md
    - docs/product/agent-workflow-execution/PLAN.md
  doNotLoad:
    - apps/
    - ios/
    - packages/
    - backend/src/juli_backend/database/migrations/
    - backend/src/juli_backend/services/demo_execution/
    - backend/src/juli_backend/services/agent/sanitize/
    - backend/src/juli_backend/services/agent/prompts/optimize_product/
    - backend/src/juli_backend/api/routes/agent_runs.py
    - backend/src/juli_backend/api/routes/demo_decisions.py
    - backend/src/juli_backend/workers/impact_reader/
    - docs/product/design/
    - docs/adr/074-agent-event-streaming-and-relay.md
    - docs/adr/076-agent-demo-execution-experience.md
    - docs/adr/077-incremental-impact-measurement.md
    - docs/integrations/tiktok_corpora/
    - Sibling issue context caches
