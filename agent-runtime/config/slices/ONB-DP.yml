# ONB-DP — first-connect onboarding, data lane; epic #1951, design ADR-103.
# BLOCKED BY the data chain: #1966 (webhook grant -- 310 events/day dropped on a
# missing SELECT), #1948 (inventory sends sku_ids, endpoint needs product_ids),
# #1949 (poll never in beat_schedule), #1967 (poll loses the shop GUC across the
# ETL's commits, so the cycle cannot finish), #1968 (dedup ledger permanently
# blocks re-ingesting lost orders), #1969 (20-page cap, no progress, hangs).
# Measured 2026-09-15: orders 0 against 3,581 available; inventory_items 0 ever.
# Do not report this slice complete against an empty orders/inventory_items table.
ONB-DP:
  executorDomain: data-platform
  requiredDocs:
    - "{handoffPath}"
    - CONTEXT.md
    - docs/adr/103-first-connect-onboarding.md
    - docs/adr/086-runtime-database-role-and-tenant-isolation.md
    - docs/adr/089-fleet-scoped-work-under-tenant-isolation.md
  requiredModules:
    - backend/src/juli_backend/services/action_cards/refresh.py
    - backend/src/juli_backend/database/migrations/
    - backend/src/juli_backend/models/models.py
    - backend/src/juli_backend/database/tenant_scoped_tables.py
    - backend/src/juli_backend/core/security/credential_resolver.py
  loadWhenNeeded:
    - backend/src/juli_backend/workers/services/polling/orchestrate.py
    - backend/src/juli_backend/workers/services/polling/sync.py
    - backend/src/juli_backend/integrations/tiktok/factories.py
  doNotLoad:
    - apps/
    - ios/
    - backend/src/juli_backend/ai/
    - docs/integrations/tiktok_corpora/
    - docs/adr/098-stage-keyed-onboarding-layer.md
    - Sibling issue context caches
