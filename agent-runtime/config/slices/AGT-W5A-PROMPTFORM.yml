# AGT-W5A-PROMPTFORM — #1213 W5 gate-walk chain, blocker #1367. Third and
# (so far) last defect in the same chain, found on run 37a0e14e against the
# deployed host on 2026-08-26 — the FIRST run to actually execute v2, after
# #1359 fixed the pin/compose divergence.
#
# THE DEFECT. The model produced a complete, grounded `update_product_listing`
# proposal and PRINTED IT AS TEXT — a ```python fenced code block inside its
# Vietnamese seller-facing message, closing with "Bạn vui lòng phê duyệt".
# No tool call was emitted, so there was no CONFIRM pause and the run
# terminated final_response. The cause is v2.md Section 7's worked example
# (lines 177-192), which renders the CONFIRM call as exactly such a fence
# appended to the seller prose: "emit a tool call" and "print a code block"
# are indistinguishable in that exemplar, and the model copied the visible
# form. It thereby defeats the instruction 16 lines above it in the same
# section ("The seller cannot answer prose ... Never ask the seller to
# choose in text") — the example beat the rule.
#
# This is a regression from #1356/AGT-W5A-CONFIRMPROMPT: that fix replaced a
# prose *description* of the terminal call with a concrete code fence, curing
# "the example is too vague" and introducing "the example is copyable as
# text". Do not re-cure by going back toward prose; cure by making the
# example show ONLY the seller-facing text and stating the tool-call
# mechanism separately in instruction voice.
#
# RULED OUT before this slice was written — do not re-investigate:
# - Tool availability. `runner/core.py::_tool_definitions` (~line 1505)
#   renders the model-facing tool list straight from the playbook's steps
#   with NO capability filter, and playbooks/optimize_product.py line 111
#   declares `update_product_listing` at step 5 / ToolPolicy.CONFIRM. The
#   tool was on the list the model was given.
# - Nothing worth proposing. The bound sandbox product now has a real title,
#   a real description and a matching photo (`inspect_product_image` returned
#   verdict "aligned"); the model's printed arguments were concrete and
#   grounded. Content was never the blocker.
# - #1359 regression. That run's stamped `prompt_version` and its composed
#   prompt agree. The pin fix holds and is not in scope here.
#
# PROMPT VERSIONING, READ THIS BEFORE EDITING — the numbers have MOVED since
# AGT-W5A-CONFIRMPROMPT was written, and that slice's header is now stale:
# - v2.md is RELEASED (PRODUCTION_PROMPT_VERSION["optimize_product_2"] == 2
#   in composer.py, set by #1357) and has EXECUTED IN PRODUCTION with a
#   recorded prompt_sha256 on workflow_runs. It is therefore IMMUTABLE per
#   ADR-072 d.4 ("a released vN.md is never edited; any change becomes
#   vN+1.md"). Editing v2.md in place would also make that recorded hash
#   unverifiable. The fix is a NEW
#   backend/src/juli_backend/services/agent/prompts/optimize_product/v3.md,
#   plus bumping the pin to 3. v1.md and v2.md both stay intact and
#   reachable — composer.py already supports composing any released version
#   by number, and the resume path (#1359) depends on older versions staying
#   composable for runs pinned to them.
# - Both golden fixtures already exist —
#   tests/fixtures/agent_prompt_gates/optimize_product_v1_composed.golden.md
#   and ..._v2_composed.golden.md. Add a v3 counterpart on the same naming
#   pattern; do not regenerate or mutate the v1/v2 goldens.
# - Both version-scoped contract tests already exist —
#   test_agent_prompt_optimize_product_v1_contract.py and
#   ..._v2_contract.py. Both stay UNCHANGED (they are contract tests on files
#   that are not edited). Write a v3 counterpart alongside them.
# - The five shared prompt-gate tests (compose, snapshot, playbook
#   consistency, copy governance, budget) carry version-scoped assertions and
#   a pinned-constant assertion on PRODUCTION_PROMPT_VERSION == 2. Bumping
#   the pin to 3 without updating them breaks them. Check each; the v1->v2
#   commit for #1357 is the worked precedent for exactly this edit — read it
#   (`git log --oneline -- .../prompts/optimize_product/v2.md`) rather than
#   guessing at the shape.
# - prompt_sha256() is NEVER hand-edited — it is recomputed from compose()'s
#   output on every call. Bumping PRODUCTION_PROMPT_VERSION is the only pin
#   edit. Do not add a second, independent sha constant anywhere.
# - The 3,000-token ADR-072 d.6 budget gate is real and v2 sits at ~2,965.
#   Removing the fenced example frees more than the added prohibition and
#   mechanism sentence cost, so v3 should land comfortably under — but if it
#   does not, STOP AND REPORT rather than trimming safety sections to fit.
#
# REQUIRED REGRESSION TEST. A prompt-gate test asserting that no released
# prompt's worked example contains a fenced code block naming a registered
# tool. This pins the exact defect and is cheap; without it the next
# exemplar edit can reintroduce it silently, which is how this chain has
# already gone twice.
#
# Sibling of AGT-W5A (same #1213 approval-gate lane), of
# AGT-W5A-CONFIRMPROMPT (same file surface — prompts/ + composer.py pin +
# the prompt-gate test family) and of AGT-W5A-PROMPTPIN (same gate-#1226
# defect chain, different surface — runner/core.py). runner/core.py,
# approval.py and playbooks/optimize_product.py are READ-ONLY context here:
# all three already behave correctly and none is the defect.
AGT-W5A-PROMPTFORM:
  executorDomain: backend
  requiredDocs:
    - "{handoffPath}"
    - CONTEXT.md
    - docs/adr/072-agent-prompt-architecture.md
    - docs/adr/075-agent-approval-gate-and-security-prerequisites.md
  requiredModules:
    - backend/src/juli_backend/services/agent/prompts/optimize_product/v2.md
    - backend/src/juli_backend/services/agent/prompts/composer.py
    - backend/src/juli_backend/services/agent/playbooks/optimize_product.py
    - backend/src/juli_backend/services/agent/tools/product_write.py
  loadWhenNeeded:
    - backend/src/juli_backend/services/agent/prompts/optimize_product/v1.md
    - backend/src/juli_backend/services/agent/approval.py
    - tests/unit/test_agent_prompt_compose.py
    - tests/unit/test_agent_prompt_snapshot_gate.py
    - tests/unit/test_agent_prompt_playbook_consistency_gate.py
    - tests/unit/test_agent_prompt_copy_governance_gate.py
    - tests/unit/test_agent_prompt_budget_gate.py
    - tests/unit/test_agent_prompt_optimize_product_v2_contract.py
    - tests/fixtures/agent_prompt_gates/optimize_product_v2_composed.golden.md
    - dictionary.md
    - packages/contracts/seller-copy-banned-patterns.json
    - docs/adr/073-agent-execution-loop-and-write-path-hardening.md
    - docs/product/agent-workflow-execution/PLAN.md
  doNotLoad:
    - apps/
    - ios/
    - packages/ui/
    - packages/theme/
    - backend/src/juli_backend/database/migrations/
    - backend/src/juli_backend/services/demo_execution/
    - backend/src/juli_backend/services/agent/runner/
    - backend/src/juli_backend/api/routes/agent_runs.py
    - backend/src/juli_backend/api/routes/demo_decisions.py
    - backend/src/juli_backend/workers/impact_reader/
    - docs/product/design/
    - docs/adr/074-agent-event-streaming-and-relay.md
    - docs/adr/076-agent-demo-execution-experience.md
    - docs/adr/077-incremental-impact-measurement.md
    - docs/integrations/tiktok_corpora/
    - Sibling issue context caches
