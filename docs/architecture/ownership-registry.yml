schemaVersion: "1.0.0"

metadata:
  authority: docs/architecture/MODULES.md
  auditSource: docs/handoffs/modular-monolith-audit-data.json
  description: >
    Machine-readable runtime ownership for Postgres tables, Celery tasks, Redis key
    namespaces, and external integrations. Planning module names match the MODULES.md
    index (Tier-1 catalog).
  redisKeyPolicy:
    futureConvention: "juli:<module>:"
    description: >
      New application Redis keys MUST use the juli:<module>: prefix where <module> is a
      lowercase slug aligned with a planning module (e.g. juli:intelligence:,
      juli:data-pipeline:, juli:integrations:). Only the registry owner for a pattern
      may write matching keys. Celery broker/result keys are infrastructure-owned by
      Workers & Async — do not prefix them with juli:.
    legacyAllowlist:
      - "ratelimit:*"
      - "analytics:kpi_envelope:*"
      - "material_analytics:mutex:*"
      - "material_analytics:coalesce68:*"
    notes: >
      Legacy allowlist entries are grandfathered runtime formats — do not rename existing
      keys. New caches and gates must use juli:<module>: unless explicitly exempted here.
  boundaryGuidance:
    doNotImport: |
      Cross-module callers must use each module's published public facade (package
      __init__ or MODULE.md Public Interface). Do not import deep submodules such as
      integrations/tiktok/rate_limiter.py, services/execution/worker.py, or
      workers/tasks/* from domain packages — enqueue via dispatcher ports instead.
      The workers package owns Celery app wiring only; domain modules own task semantics.
      See docs/architecture/MODULES.md and .cursor/rules/patterns.mdc.
    readVsWrite: |
      Each databaseTables entry names one planning-module owner. Only the owner (or its
      published write API) may INSERT/UPDATE/DELETE that table; other modules read via
      repositories or public query helpers. Dual writers called out in audit notes are
      debt — new code must not add writers. Redis namespaces: only the listed owner may
      create keys matching the pattern. External integrations: HTTP/auth clients stay in
      the owning module; routes enqueue or delegate, they do not reimplement vendor I/O.

planningModules:
  - Agent Execution
  - Auth & Security
  - Backend API
  - Cross-cutting
  - Database
  - Data Pipeline
  - Integrations
  - Intelligence
  - Workers & Async

databaseTables:
  users:
    owner: Auth & Security
    access: write
    notes: Created during TikTok OAuth shop connect.
  shops:
    owner: Auth & Security
    access: write
    notes: >
      Sole write owner: TikTokOAuthService OAuth facade
      (core/security/tiktok_oauth.py). Shop connect/reconnect paths persist via
      this facade; API routes and services/tiktok delegate — no direct
      ShopsRepo.create outside Auth.
  tiktok_credentials:
    owner: Auth & Security
    access: write
    notes: >
      Encrypted tokens; sole write owner TikTokOAuthService OAuth facade
      (core/security/tiktok_oauth.py). credential_resolver is the read surface
      for TikTok callers.
  tiktok_sync_state:
    owner: Workers & Async
    access: write
    notes: Polling cursor state; exclusive to polling workers.
  orders:
    owner: Data Pipeline
    access: write
    notes: ETL upsert from webhook + polling handoff.
  order_items:
    owner: Data Pipeline
    access: write
  returns:
    owner: Data Pipeline
    access: write
  products:
    owner: Data Pipeline
    access: write
  inventory_items:
    owner: Data Pipeline
    access: write
  settlements:
    owner: Data Pipeline
    access: write
  creators:
    owner: Data Pipeline
    access: write
  livestreams:
    owner: Data Pipeline
    access: write
  analytics_performance_intervals:
    owner: Data Pipeline
    access: write
    notes: Shared write surface between analytics backfill and ETL transform path.
  analytics_backfill_partitions:
    owner: Data Pipeline
    access: write
    notes: >
      Backfill partition ledger. Writers are services/analytics_backfill and the exact
      services/cdp_batch/partition_checkpoints.py A2 transaction coordinator.
  analytics_kpi_envelopes:
    owner: Intelligence
    access: write
    notes: Phase 2.10 precomputed Analytics KPI read model envelopes.
  processed_events:
    owner: Data Pipeline
    access: write
    notes: Idempotency ledger — ETL exclusive.
  order_raw_payloads:
    owner: Data Pipeline
    access: write
    notes: >
      Append-only bronze order payloads (webhook and targeted fetch landing). The exact
      services/cdp_batch/partition_checkpoints.py A2 coordinator may append reconcile
      pages in the same transaction as its ops checkpoint.
  return_raw_payloads:
    owner: Data Pipeline
    access: write
    notes: Append-only bronze return/cancellation payloads (webhook landing).
  ctor_performance_raw_payloads:
    owner: Data Pipeline
    access: write
    notes: >
      Append-only bronze A-34 product performance rows (ctor Demo Main KPI domain,
      targeted-fetch landing, #880).
  live_hours_raw_payloads:
    owner: Data Pipeline
    access: write
    notes: >
      Append-only bronze A-28 LIVE performance rows — per-session plus the derived
      shop-grain daily rollup (live_hours Demo Main KPI domain, targeted-fetch
      landing, #880).
  kpi_envelopes:
    owner: Intelligence
    access: write
    notes: Gold serving SoT for analytics KPI envelopes (#606).
  webhook_raw_events:
    owner: Data Pipeline
    access: write
    notes: Audit trail before ETL handoff (TikTok webhook services).
  workflow_webhook_signals:
    owner: Data Pipeline
    access: write
    notes: Phase 2 catalog signal store from TikTok webhooks.
  action_cards:
    owner: Intelligence
    access: write
    notes: >
      Sole write owner via services/action_cards (Action Cards / Scoring);
      refresh → persist_scoring_result pipeline.
  decision_emission_novelty_ledger:
    owner: Intelligence
    access: write
    notes: >
      Sole write owner via services/action_cards.emission_budget
      (Decision emission/surfacing budget, #716 B-4). Durable, server-side
      weekly novelty counter/window state — Postgres SoT, not Redis.
  recommendations:
    owner: Intelligence
    access: write
    notes: >
      Legacy table retained for GET /v1/recommendations; sole write owner is
      services/action_cards.persist_legacy_recommendations (Action Cards / Scoring).
      API routes delegate — do not call RecommendationsRepo.create directly.
  demo_execution_records:
    owner: Intelligence
    access: write
    notes: >
      Sole write owner via services/demo_execution.approve_decision_dry_run
      (Public Demo approve → execute dry-run, #717 B-5, ADR-037/038 §9).
      Deliberately standalone — not tool_executions/Workers & Async — because
      these rows must never be reachable by the Celery/Partner-write path;
      no worker or Celery task ever writes this table.
  workflow_runs:
    owner: Agent Execution
    access: write
    notes: >
      WorkflowRunner (services/agent/runner) persists; Celery task (P8) drives the run.
      `action_card_id` (nullable, FK to `action_cards.id`, migration 040, #1269,
      ADR-082 decision 6) links a run back to the ActionCard whose approval created
      it, completing ADR-075 decision 1's "FK to the card". No backfill -- runs
      predating this column read back NULL. Schema landed in #1269; written as of
      #1222 by services/agent/approval.py::approve_action_card, the approve-is-
      run-creation transaction reached from POST /v1/demo/decisions/
      {action_card_id}/approve (api/routes/demo_execution.py) -- the sole writer.
  workflow_run_events:
    owner: Agent Execution
    access: write
    notes: >
      Postgres-authoritative event log for a workflow_runs row (ADR-074 decision 1,
      #1125 / AGT-W3B) — same owner as workflow_runs per MODULES.md §8 (Workers &
      Async owns the Celery-driven run records); P8-3's PersistingEventSink (a later
      slice) is the write path, invoked from the WorkflowRunner's Celery task.
  run_confirmations:
    owner: Agent Execution
    access: write
    notes: >
      Decision request presented at a CONFIRM pause (ADR-075 decision 2, #1214 /
      AGT-W5A-DP) — same owner as workflow_runs/workflow_run_events. The
      WorkflowRunner writes the row at the CONFIRM pause (#1221, a later slice);
      the confirmation endpoint transitions pending → approved/declined (#1224,
      a later slice). Schema landed in #1214; nothing reads or writes this table
      yet — the first writers are #1221 and #1224.
  action_card_approvals:
    owner: Agent Execution
    access: write
    notes: >
      Approval audit record — who approved which ActionCard, when, and a
      snapshot of the card as shown (ADR-075 decision 1, #1214 / AGT-W5A-DP).
      Deliberately Agent Execution, not Intelligence (Action Cards / Scoring,
      the owner of action_cards itself): ownership here tracks who *writes*,
      and the sole writer is the approve-is-run-creation transaction
      (services/agent/approval.py::approve_action_card, #1222, ADR-075
      decision 1) — the same transaction that flips action_cards.status and
      inserts the workflow_runs row — not the scoring pipeline that owns
      action_cards. Schema landed in #1214; written as of #1222.
  tool_executions:
    owner: Agent Execution
    access: write
    notes: Execution module persists; Celery task updates status.
  impact_readings:
    owner: Intelligence
    access: write
    notes: >
      Incremental impact measurement (P-IM, ADR-077 decision 5, #1040). Source of
      truth for every impact reading; will be written by the daily impact-reader
      beat task landing later in this wave (#1044). `tool_execution_id` FKs to
      tool_executions; `run_id` now FKs to `workflow_runs` as of migration 034
      (#1117, W3-A/ADR-073) — migration 033 shipped it as a plain nullable UUID
      with no FK because `workflow_runs` did not exist yet, see that migration's
      docstring for the original deferral rationale.
  workflow_outcome_records:
    owner: Workers & Async
    access: write
    notes: Operations schema; execution invokes record API — cycle risk under MMU-6.
  alert_configs:
    owner: Cross-cutting
    access: write
  alert_history:
    owner: Cross-cutting
    access: write
  campaigns:
    owner: Intelligence
    access: write
    notes: Commerce graph via GraphRepo (feedback ingest).
  graph_edges:
    owner: Intelligence
    access: write
    notes: Graph edges for matching/ranking; fuzzy ownership with AI ranking reads.

celeryTasks:
  juli_backend.refresh_action_cards:
    owner: Intelligence
    wrapper: backend/src/juli_backend/workers/tasks/action_card_refresh.py
    delegatesTo: services.action_cards.refresh.run_action_card_refresh
  juli_backend.execute_approved_tool:
    owner: Workers & Async
    wrapper: backend/src/juli_backend/workers/tasks/tool_execution.py
    delegatesTo: services.execution.worker.run_approved_tool
  juli_backend.material_analytics_precompute:
    owner: Data Pipeline
    wrapper: backend/src/juli_backend/workers/tasks/material_analytics_precompute.py
    delegatesTo: services.webhook.material_worker.run_material_analytics_compute
  juli_backend.mock_analytics_hourly_reconcile:
    owner: Data Pipeline
    wrapper: backend/src/juli_backend/workers/tasks/mock_analytics_reconcile.py
    delegatesTo: workers.tasks.material_analytics_precompute.material_analytics_precompute_sync
    notes: Phase 2.10 Mock-mode hourly Demo reference shop reconciliation only.
  juli_backend.cdp_batch_staggered_reconcile:
    owner: Data Pipeline
    wrapper: backend/src/juli_backend/workers/tasks/cdp_batch_reconcile.py
    delegatesTo: services.cdp_batch.batch_reconcile_orchestrator.BatchReconcileOrchestrator.run
    notes: A2 daily staggered per-shop reconcile via StaggerScheduler (#615/#621/#622). Config-flag gated, default OFF.
  juli_backend.analytics_backfill_topup:
    owner: Data Pipeline
    wrapper: backend/src/juli_backend/workers/tasks/analytics_backfill_topup.py
    delegatesTo: services.analytics_backfill.backfill_analytics_history
    notes: A1 automatic analytics history top-up for reference shop only (#791). Idempotent via resumable checkpoints.
  juli_backend.daily_impact_reader:
    owner: Intelligence
    wrapper: backend/src/juli_backend/workers/tasks/impact_reader.py
    delegatesTo: workers.impact_reader.pipeline.run_daily_impact_reader
    notes: >
      ADR-077 decision 5 (#1044). Scheduled strictly after analytics-backfill-topup.
      Scans terminal listing.optimize_product executions whose T+7/T+14 has elapsed
      and writes impact_readings rows; matches that table's own owner (Intelligence).
  juli_backend.run_agent_workflow:
    owner: Agent Execution
    wrapper: backend/src/juli_backend/workers/tasks/agent_workflow.py
    delegatesTo: services.agent.runner.WorkflowRunner.run
    notes: >
      ADR-073/ADR-074 decision 4 (#1129, reconciled against the real WorkflowRunner
      by #1145). Thin shell only -- no loop/state-machine logic in the wrapper.
      Nothing calls .delay() on this task anywhere in this codebase yet (P9/W4-A's
      job); it is not reachable from live traffic.
  juli_backend.resume_agent_workflow:
    owner: Agent Execution
    wrapper: backend/src/juli_backend/workers/tasks/agent_workflow.py
    delegatesTo: services.agent.runner.WorkflowRunner.resume
    notes: >
      ADR-073 decisions 1/5 (#1129, reconciled against the real WorkflowRunner.resume
      by #1145). Carries an already-authorized `approved` decision through to the
      runner; does not itself validate or authorize it (W4-A's job).
  juli_backend.reap_abandoned_workflow_runs:
    owner: Agent Execution
    wrapper: backend/src/juli_backend/workers/tasks/reaper.py
    delegatesTo: workers.tasks.reaper.reap_workflow_runs
    notes: >
      ADR-074 decision 4 (#1130). Beat task every 5 minutes; closes stale
      running/queued runs (no event + no live task -> worker_lost -> failed)
      and expired waiting_approval runs (past approval_timeout_h ->
      confirmation_expired -> cancelled) through the normal EventSink path.
  juli_backend.credential_refresh_beat:
    owner: Auth & Security
    wrapper: backend/src/juli_backend/workers/tasks/credential_refresh_beat.py
    delegatesTo: workers.tasks.credential_refresh_beat.run_credential_refresh_cycle
    notes: >
      ADR-081 decision 1 row 1 (#1232). Beat task every 30 minutes on the
      dedicated `credentials` queue; scans tiktok_credentials inside the 24h
      REFRESH_BUFFER window (needs_reauth rows already excluded by the repo
      method) and calls refresh_credential(force=False) per row. The fleet's
      FIRST scheduled refresh — run_fujiwa_poll_cycle has never appeared in
      beat_schedule, so before this nothing refreshed TikTok tokens on a
      schedule at all. One bad credential never aborts the cycle: that is why
      refresh_credential returns an outcome instead of raising.

redisNamespaces:
  - pattern: "ratelimit:*"
    owner: Integrations
    access: write
    env: REDIS_URL
    notes: TikTok RateLimiter token bucket (ratelimit:{app_id}:{shop_id}:{endpoint}).
  - pattern: "analytics:kpi_envelope:*"
    owner: Intelligence
    access: write
    env: REDIS_URL
    notes: Phase 2.10 Analytics KPI envelope read-through cache (analytics:kpi_envelope:{shop_id}).
  - pattern: "gold:kpi_envelope:*"
    owner: Data Pipeline
    access: write
    env: REDIS_URL
    notes: A1 gold.kpi_envelopes read-through cache (#631, gold:kpi_envelope:{shop_id}). Never SoT — Postgres gold.kpi_envelopes remains SoT (ADR-038).
  - pattern: "material_analytics:mutex:*"
    owner: Data Pipeline
    access: write
    env: REDIS_URL
    notes: Per-shop material Analytics precompute enqueue mutex (material_analytics:mutex:{shop_key}).
  - pattern: "material_analytics:coalesce68:*"
    owner: Data Pipeline
    access: write
    env: REDIS_URL
    notes: Catalog #68 coalesce window for material Analytics gate (material_analytics:coalesce68:{shop_key}).
  - pattern: "celery-*"
    owner: Workers & Async
    access: write
    env: CELERY_BROKER_URL
    notes: >
      Celery broker and result-backend key space when Redis is configured as broker or
      result backend (CELERY_BROKER_URL / CELERY_RESULT_BACKEND). Keys use Celery's own
      prefixes (_kombu.binding.*, celery-task-meta-*, etc.) — not namespaced under juli:.
      Workers & Async owns wiring in workers/celery_app.py; domain modules own task
      semantics only.

externalIntegrations:
  - id: tiktok_shop_api
    name: TikTok Shop Partner API
    owner: Integrations
    surfaces:
      - OAuth Shop
      - Business Advertiser
      - webhooks HMAC
      - polling sync
      - execution sandbox writes
    env:
      - TIKTOK_APP_KEY
      - TIKTOK_APP_SECRET
      - TIKTOK_BASE_URL
  - id: supabase_postgres
    name: Supabase Postgres
    owner: Database
    surfaces:
      - DATABASE_URL async SQLAlchemy sessions
      - Alembic migrations
    env:
      - DATABASE_URL
  - id: supabase_jwt
    name: Supabase Auth JWT
    owner: Auth & Security
    surfaces:
      - verify_supabase_jwt
      - get_current_user
    env:
      - SUPABASE_JWT_SECRET
  - id: redis
    name: Redis
    owner: Cross-cutting
    surfaces:
      - ratelimit:* keys (Integrations)
      - analytics:kpi_envelope:* (Intelligence)
      - material_analytics:mutex:* and material_analytics:coalesce68:* (Data Pipeline)
      - optional Celery broker/backend (Workers & Async)
    env:
      - REDIS_URL
  - id: celery_broker
    name: Celery broker
    owner: Workers & Async
    surfaces:
      - default task queue on CELERY_BROKER_URL
    env:
      - CELERY_BROKER_URL
      - CELERY_RESULT_BACKEND
