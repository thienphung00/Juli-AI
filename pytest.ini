[pytest]
asyncio_mode = auto
testpaths = tests
timeout = 30
markers =
    live: outbound TikTok Partner / sandbox HTTP (merge_group test-live-sandbox only)
    demo_contract: Demo deploy/exit-gate contracts (demo CI jobs only)
    migration_heavy: seeded Alembic round-trips (merge_group or migration-path PRs)
    phase_scaffold: completed Phase 2.5 deploy doc/scaffold contracts (merge_group only)
    schema_parity: ORM model vs migration-built schema parity guard (#943/#948; issue-tier and heavier)
