# Gitleaks config — extends default rules with doc/sample allowlists.
# One [allowlist] table (not [[allowlists]]): CI pins gitleaks 8.21, which only
# reads the singular form; newer versions still accept it.
title = "Juli AI gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Public samples: TikTok webhook contract collection (sanitized Partner Center payloads) and apiwatch snapshots (public platform doc field names / hash-suffixed changelog keys)"
paths = [
  '''docs/integrations/tiktok_api/webhook-contract-collection\.md''',
  '''infra/apiwatch/snapshots/[a-z]+\.json''',
]
# A test calling its own helper with a local variable named `key` (campaign_key=key, ...) trips
# generic-api-key; the value is a variable name, not a secret (P92 tests/unit/test_shopee_builder.py).
regexTarget = "line"
regexes = [
  '''campaign_key=key,''',
  # P93: a fake invite token literal in the /nhan-shop component test (a test fixture, not a secret).
  '''inviteToken="tok-123456789012345678901"''',
]
