# Gitleaks config — extends default rules with doc/sample allowlists.
title = "Juli AI gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "TikTok webhook contract collection — sanitized Partner Center sample payloads (IDs look like keys)"
paths = [
  '''docs/integrations/tiktok_api/webhook-contract-collection\.md''',
]

[[allowlists]]
description = "apiwatch snapshots — field names and changelog keys from PUBLIC platform docs (hash-suffixed keys look like keys)"
paths = [
  '''infra/apiwatch/snapshots/[a-z]+\.json''',
]
