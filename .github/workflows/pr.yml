          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Create PostgREST client roles + seed Supabase bootstrap grants
        run: python agent-runtime/scripts/ci/ensure_postgrest_client_roles.py
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Two-tenant RLS isolation proof (issue #1329)
