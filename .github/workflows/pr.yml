  # ADR-052: artifact validate/generate is deferred to the wave->main
  # artifact-gate job below — it is no longer an issue-tier blocker.
  # Deterministic existence+status check only (no meta_prepare_executor /
  # check_*.py re-run per issue push); see wave_manifest.py (CI-WAVE-1).
  artifact-gate:
    runs-on: ubuntu-latest
    needs: [classify-tier]
    if: needs.classify-tier.outputs.tier == 'main'
    env:
      HEAD_REF: ${{ github.head_ref }}
      MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate wave manifest issue artifacts (existence + PASS status)
        run: |
          branch="$HEAD_REF"
          if [[ -z "$branch" ]]; then
            branch="$MERGE_GROUP_HEAD_REF"
          fi
          if [[ ! "$branch" =~ ^feature/.+-wave$ ]]; then
            echo "artifact-gate: head '$branch' is not a wave branch; nothing to validate."
            exit 0
          fi
          mid="${branch#feature/}"
          mid="${mid%-wave}"
          wave_id="wave-${mid}"
          python agent-runtime/scripts/ci/wave_manifest.py \
            --wave-id "$wave_id" --branch "$branch" --check-artifacts

  # #1064 (design correction, superseding ADR-079's original "CI retention" framing):
  # pr.yml has no upload-artifact step for the five gitignored artifact body
  # directories and cannot have one -- they are gitignored and never reach the pushed
  # branch, so nothing lands on the runner to upload. What CI *can* see is the one
  # committed file `.gitignore` deliberately keeps tracked:
  # agent-runtime/artifacts/status/issue-<N>.json. This job fails an issue-tier PR when
  # that record is absent, or present but not PASS. It narrowly reverses one line of
  # ADR-052 (see the note added there for #1064): an existence + status read of one
  # committed JSON file, NOT the heavy meta_prepare_executor / check_*.py re-run
  # ADR-052 correctly deferred off this tier. Reuses classify-tier's tier == 'issue'
  # and resolve-issue's issue-([0-9]+) resolution rather than inventing a new branch
  # convention: wave-tier pushes and wave->main PRs are unaffected because this job
  # simply does not run for them (tier != 'issue'); a branch that reaches the issue
  # tier without resolving an issue number (docs/hotfix) is handled *inside* the
  # script as a logged SKIP -- never a silent pass. The check_*.py script never reads
  # or writes the five gitignored artifact body directories and never `git add -f`s
  # anything; agent-runtime/artifacts/status/ is the only artifact dir it touches.
  # Not wired into required branch-protection checks by this change -- that is a
  # repository-settings decision for the owner, called out in the PR body.
  artifact-retention-guard:
    runs-on: ubuntu-latest
    needs: [classify-tier, resolve-issue]
    if: needs.classify-tier.outputs.tier == 'issue'
    env:
      ISSUE_NUMBER: ${{ needs.resolve-issue.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check committed status record (existence + PASS)
        run: |
          python agent-runtime/scripts/ci/check_artifact_retention_guard.py \
            --issue "$ISSUE_NUMBER"

  # HE-A/P-EVAL-3 (#1440): the code-reading validate gates, run where the agent
  # is not. Before this job, `grep -rn "scripts/validate" .github/workflows/`
  # returned zero -- all 29 gates under agent-runtime/scripts/validate/ ran only
  # locally, invoked by an agent, against artifacts that same agent had just
  # written. This job runs the subset whose inputs are code, git or `gh`.
  #
  # Deliberately NOT wired: gates reading one of the five gitignored artifact
  # body directories (reviews/, implementations/, intent-reviews/, validation/,
  # optimization/). Those files never reach a pushed branch, so in CI such a
  # gate can only ever report "artifact missing" -- a universally failing check
  # that measures gitignore, not the change. check_acceptance_mapping appeared
  # in #1440's list and is dropped here for exactly that reason: its first
  # statement is load_review_artifact(issue). It follows once #1438's capture
  # seam gives it durable, CI-visible input.
  #
  # Blocking vs advisory follows Architect lock 5 (#1434) -- only a factual gate
  # that cannot false-positive ships blocking:
  #   check_differential_tdd     advisory, per #1440; keeps the promotion
  #                              criterion documented at
  #                              agent-runtime/scripts/ci/generate_validation_artifact.py:65-75.
  #                              It too reads the gitignored implementation
  #                              artifact and so reports FAIL in CI until #1438
  #                              lands -- the point of this slice is that it runs
  #                              at all, where today it appears in 1 session of 22.
  #   check_unpushed_issue_work  advisory; a repo-wide heuristic over local
  #                              branches and worktrees no PR author controls.
  validate-gates:
    runs-on: ubuntu-latest
    needs: [classify-tier, resolve-issue]
    if: needs.classify-tier.outputs.tier == 'issue'
    env:
      ISSUE_NUMBER: ${{ needs.resolve-issue.outputs.issue_number }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No dependency install: agent-runtime/scripts/ci/common.py and every gate
      # wired below are stdlib-only.
      - name: Materialise this PR's diff for the gates
        run: |
          set -euo pipefail
          if [[ -z "${BASE_REF:-}" ]]; then
            echo "validate-gates: no base ref to diff against - failing closed."
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "Diffing against merge base ${merge_base} (origin/${BASE_REF})"
          # Move HEAD back to the merge base, leaving this PR's changes in the
          # index. git_changed_files() (agent-runtime/scripts/ci/common.py) then
          # reads them through its `git diff --name-only HEAD` fallback.
          # The alternative -- leaving GITHUB_BASE_REF set so the gate takes its
          # own branch -- runs `git fetch origin <base> --depth=1`, which
          # shallow-grafts a fetch-depth:0 checkout. `git diff <base>...HEAD`
          # then aborts with "no merge base", the gate swallows the error and
          # returns an empty change list, and every diff-driven gate passes
          # vacuously. Verified: reproduced whenever the PR branch is behind the
          # base tip, i.e. the normal case.
          git reset --soft "${merge_base}"
          git --no-pager diff --name-only HEAD
      - name: Run code-reading validate gates
        run: |
          set -uo pipefail

          # Take the working-tree fallback in git_changed_files() rather than
          # its GITHUB_BASE_REF branch -- see the previous step.
          unset GITHUB_BASE_REF

          BLOCKING_GATES=(check_module_boundaries check_module_drift check_adr check_done_md)
          ADVISORY_GATES=(check_differential_tdd check_unpushed_issue_work)

          if [[ -z "${ISSUE_NUMBER:-}" ]]; then
            # Unreachable in practice: policy-checks already fails an issue-tier
            # PR whose branch carries no issue-N. Reported, never a silent pass.
            echo "validate-gates: SKIP - branch resolved no issue-N and every gate takes --issue."
            exit 0
          fi

          # print_check_result() in agent-runtime/scripts/ci/common.py prints
          # "<name>: PASS|FAIL". A gate that raises prints no such line, and
          # Python exits 1 for both a reported FAIL and an uncaught exception --
          # so the verdict line, not the exit code, is what separates "the gate
          # answered" from "the gate could not".
          verdict_re='^[a-z_]+: (PASS|FAIL)'
          rc=0

          run_gate() {
            local gate="$1" mode="$2"
            local script="agent-runtime/scripts/validate/${gate}.py"
            local args=(--issue "$ISSUE_NUMBER")
            local output status

            if [[ ! -f "$script" ]]; then
              echo "${gate}: ERROR - gate script not found at ${script}"
              return 1
            fi
            if [[ "$gate" == "check_unpushed_issue_work" ]]; then
              # This job has no GH_TOKEN, so the gate would skip its gh-backed
              # checks anyway; ask for that explicitly so the result cannot vary
              # with runner auth.
              args+=(--no-gh)
            fi

            output="$(python "$script" "${args[@]}" 2>&1)"
            status=$?
            printf '%s\n' "$output"

            if ! grep -Eq "$verdict_re" <<< "$output"; then
              echo "${gate}: ERROR - exited ${status} with no PASS/FAIL verdict (raised, or could not read its input)"
              return 1
            fi
            if [[ "$status" -ne 0 ]]; then
              if [[ "$mode" == "advisory" ]]; then
                echo "${gate}: FAIL (advisory - reported, does not block)"
                return 0
              fi
              echo "${gate}: FAIL (blocking)"
              return 1
            fi
            echo "${gate}: PASS (${mode})"
            return 0
          }

          for gate in "${BLOCKING_GATES[@]}"; do
            run_gate "$gate" blocking || rc=1
          done
          for gate in "${ADVISORY_GATES[@]}"; do
            run_gate "$gate" advisory || rc=1
          done

          if [[ "$rc" -ne 0 ]]; then
            echo "validate-gates: FAIL"
            exit 1
          fi
          echo "validate-gates: PASS"

  policy-checks:
    runs-on: ubuntu-latest
    needs: [classify-tier, resolve-issue]
    if: >-
      needs.classify-tier.outputs.tier == 'issue'
    steps:
      - name: Require issue branch and issue linkage
        env:
          HEAD_REF: ${{ github.head_ref }}
          ISSUE_NUMBER: ${{ needs.resolve-issue.outputs.issue_number }}
        run: |
          [[ "$HEAD_REF" == feature/* ]] || {
            echo "Issue-tier PRs must use feature/* branches (got $HEAD_REF)"
            exit 1
          }
          [[ -n "$ISSUE_NUMBER" ]] || {
            echo "Issue-tier PR branch must contain issue-N"
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require issue present in target wave manifest (CI-WAVE-1 validator)
        env:
          BASE_REF: ${{ github.base_ref }}
          ISSUE_NUMBER: ${{ needs.resolve-issue.outputs.issue_number }}
        run: |
          mid="${BASE_REF#feature/}"
          mid="${mid%-wave}"
          wave_id="wave-${mid}"
          python agent-runtime/scripts/ci/wave_manifest.py \
            --wave-id "$wave_id" --branch "$BASE_REF" --issue "$ISSUE_NUMBER"

  integration-tests:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'wave'
      && needs.changes.outputs.backend == 'true'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/test_db
      # The Postgres service above is created for this job and destroyed with
      # it. tests/conftest.py refuses to run destructive suites against a
      # database that has not declared itself throwaway, and fails closed here
      # rather than skipping — a silent skip would report success having run
      # no Postgres test at all.
      JULI_TEST_DATABASE_DISPOSABLE: "1"
      REDIS_URL: redis://localhost:6379
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Integration tests without live Partner calls
        run: python -m pytest tests/integration -v --tb=short -m "not live"

  dependency-validation:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    # CI-WAVE-3 (#661): main tier stays the full checkpoint (always runs);
    # wave-tier pushes are domain-matched like integration/architecture/
    # cross-module — only when the push range touched a dependency-graph
    # domain (backend/dashboard/demo), so agent/docs-only wave pushes stay
    # cheap. status-check allows this job to be "skipped" on wave tier.
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      || (needs.classify-tier.outputs.tier == 'wave'
          && (needs.changes.outputs.backend == 'true'
              || needs.changes.outputs.dashboard == 'true'
              || needs.changes.outputs.demo == 'true'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate Python dependency graph
        run: |
          pip install -e "./backend[dev]" -c backend/constraints.txt
          pip freeze | sort
          pip check
      - name: Validate pnpm lock graph
        run: pnpm install --frozen-lockfile --filter @juli/demo...
      - name: Validate dashboard npm lock
        working-directory: apps/dashboard
        run: npm ci --ignore-scripts

  cross-module-contracts:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'wave'
      && needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Dual-language contract tests (#1126's tests/unit/test_agent_events_contract.py)
      # shell out to `node -e` and `require("typescript")` with cwd
      # packages/contracts, so this job needs the same contracts dependency
      # graph the `test` job installs. Without it every such test fails with a
      # bare CalledProcessError — a job-config gap, not a product defect
      # (observed on the W3 wave push tier, 24 failures).
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install contracts dependency graph
        run: pnpm install --frozen-lockfile --filter "./packages/contracts..."
      - name: Install backend dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Cross-module contract tests
        run: >-
          python -m pytest tests/unit -q --tb=short
          -k "contract or boundary or ownership"

  full-regression:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.backend == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/test_db
      # The Postgres service above is created for this job and destroyed with
      # it. tests/conftest.py refuses to run destructive suites against a
      # database that has not declared itself throwaway, and fails closed here
      # rather than skipping — a silent skip would report success having run
      # no Postgres test at all.
      JULI_TEST_DATABASE_DISPOSABLE: "1"
      REDIS_URL: redis://localhost:6379
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
      # #1608: see `test` -- same convention as `validate-gates`/`policy-checks`.
      # This job runs at main tier (the `if:` above) via two different
      # triggers: a pull_request into `main`, where `github.base_ref` *is*
      # `main`, and `merge_group` (this workflow's merge queue gate before a
      # wave lands), where `github.base_ref` is empty -- GitHub does not
      # populate it for that event. `classify-tier` already special-cases
      # `merge_group` the same way, unconditionally: it is reachable only via
      # this workflow's own `merge_group: branches: [main]` trigger, so `main`
      # is the only value it could ever mean there, not a guess.
      BASE_REF: ${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # #1573: this job runs the whole of tests/unit — the same corpus as
          # `test`, including the base-anchored modules — so it needs the same
          # history. cross-module-contracts filters to
          # -k "contract or boundary or ownership", which does collect
          # test_three_tier_ci_contract.py but not the other four base-anchored
          # modules (test_checkout_preflight, test_differential_tdd,
          # test_environment_provider, test_ratchets) — verified with
          # --collect-only — which is why only these two jobs are deepened.
          # Bounded, not 0: see `test`.
          fetch-depth: 200
      # #1604: see `test` for why this is needed -- fetch-depth alone does
      # not create `origin/<base>`. The follow-up re-fetch of the checked-out
      # sha is likewise explained there (restores the shallow boundary this
      # step's fetch moves). #1608: fetches `origin/${BASE_REF}` -- see `test`.
      - name: Fetch base ref (origin/${{ github.base_ref || 'main' }})
        run: |
          git fetch --depth=200 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git fetch --depth=200 origin "$(git rev-parse HEAD)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Same reason as cross-module-contracts above: this job runs the whole
      # of tests/unit, which includes the node-shelling dual-language contract
      # tests. The `test` job already installs this graph; these two did not.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install contracts dependency graph
        run: pnpm install --frozen-lockfile --filter "./packages/contracts..."
      - name: Install backend dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Install PostgreSQL client 16
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Full non-live regression suite
        run: |
          coverage erase
          python -X faulthandler -m pytest tests/unit -v --tb=short \
            -m "not live and not demo_contract" \
            --cov=juli_backend --cov-report= --cov-fail-under=0
          python -X faulthandler -m pytest tests/integration -v --tb=short \
            -m "not live and not demo_contract" \
            --cov=juli_backend --cov-append \
            --cov-report=term-missing --cov-fail-under=80

  performance-smoke:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.backend == 'true'
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/test_db
      # The Postgres service above is created for this job and destroyed with
      # it. tests/conftest.py refuses to run destructive suites against a
      # database that has not declared itself throwaway, and fails closed here
      # rather than skipping — a silent skip would report success having run
      # no Postgres test at all.
      JULI_TEST_DATABASE_DISPOSABLE: "1"
      REDIS_URL: redis://localhost:6379
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Bounded integration runtime smoke
        run: >-
          timeout 5m python -m pytest
          tests/integration/test_material_deployed_webhook_handoff.py
          tests/integration/test_inventory_poll_etl_upsert.py
          tests/integration/test_analytics_poll_etl_upsert.py
          -q --tb=short -m "not live and not migration_heavy" --durations=20

  security-scan:
    runs-on: ubuntu-latest
    needs: [classify-tier, bandit, gitleaks]
    if: always() && needs.classify-tier.outputs.tier == 'main'
    steps:
      - name: Require code and secret scanning
        env:
          BANDIT_RESULT: ${{ needs.bandit.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          [[ "$BANDIT_RESULT" == "success" ]] || {
            echo "bandit: $BANDIT_RESULT"
            exit 1
          }
          [[ "$GITLEAKS_RESULT" == "success" ]] || {
            echo "gitleaks: $GITLEAKS_RESULT"
            exit 1
          }

  deployment-checks:
    runs-on: ubuntu-latest
    needs:
      - classify-tier
      - frontend
      - demo-frontend
      - landing-frontend
      - demo-deploy-contracts
    if: always() && needs.classify-tier.outputs.tier == 'main'
    steps:
      - name: Require production builds and deploy contracts
        env:
          DASHBOARD_RESULT: ${{ needs.frontend.result }}
          DEMO_RESULT: ${{ needs.demo-frontend.result }}
          LANDING_RESULT: ${{ needs.landing-frontend.result }}
          DEPLOY_CONTRACT_RESULT: ${{ needs.demo-deploy-contracts.result }}
        run: |
          # frontend/demo-frontend may report "skipped" here on wave->main
          # (main_via_wave) — they already ran per issue at issue tier.
          for result in "$DASHBOARD_RESULT" "$DEMO_RESULT" "$LANDING_RESULT"; do
            [[ "$result" == "success" || "$result" == "skipped" ]] || {
              echo "deployment readiness dependency: $result"
              exit 1
            }
          done
          [[ "$DEPLOY_CONTRACT_RESULT" == "success" ]] || {
            echo "deployment readiness dependency: $DEPLOY_CONTRACT_RESULT"
            exit 1
          }

  status-check:
    runs-on: ubuntu-latest
    needs:
      - classify-tier
      - changes
      - resolve-issue
      - lint
      - typecheck
      - architecture-gates
      - bandit
      - nginx-rate-limit-lint
      - nginx-config-parses
      - gitleaks
      - test
      - test-live-sandbox
      - integration-tests
      - dependency-validation
      - cross-module-contracts
      - full-regression
      - performance-smoke
      - migration-check
      - two-tenant-isolation-proof
      - frontend
      - demo-frontend
      - landing-frontend
      - demo-deploy-contracts
      - demo-e2e
      - artifact-gate
      - artifact-retention-guard
      - validate-gates
      - policy-checks
      - security-scan
      - deployment-checks
    if: always()
    steps:
      - name: Require tier jobs
        run: |
          tier="${{ needs.classify-tier.outputs.tier }}"
          lint="${{ needs.lint.result }}"
          typecheck="${{ needs.typecheck.result }}"
          arch="${{ needs.architecture-gates.result }}"
          bandit="${{ needs.bandit.result }}"
          nginx_lint="${{ needs.nginx-rate-limit-lint.result }}"
          nginx_parse="${{ needs.nginx-config-parses.result }}"
          gitleaks="${{ needs.gitleaks.result }}"
          test="${{ needs.test.result }}"
          live_sandbox="${{ needs.test-live-sandbox.result }}"
          integration="${{ needs.integration-tests.result }}"
          deps="${{ needs.dependency-validation.result }}"
          contracts="${{ needs.cross-module-contracts.result }}"
          regression="${{ needs.full-regression.result }}"
          perf="${{ needs.performance-smoke.result }}"
          mig="${{ needs.migration-check.result }}"
          isolation_proof="${{ needs.two-tenant-isolation-proof.result }}"
          fe="${{ needs.frontend.result }}"
          demo="${{ needs.demo-frontend.result }}"
          landing="${{ needs.landing-frontend.result }}"
          demo_deploy="${{ needs.demo-deploy-contracts.result }}"
          demo_e2e="${{ needs.demo-e2e.result }}"
          artifact_gate="${{ needs.artifact-gate.result }}"
          artifact_retention_guard="${{ needs.artifact-retention-guard.result }}"
          validate_gates="${{ needs.validate-gates.result }}"
          policy="${{ needs.policy-checks.result }}"
          security="${{ needs.security-scan.result }}"
          deployment="${{ needs.deployment-checks.result }}"
          main_via_wave="${{ needs.classify-tier.outputs.main_via_wave }}"
          dashboard_changed="${{ needs.changes.outputs.dashboard }}"
          demo_changed="${{ needs.changes.outputs.demo }}"
          landing_changed="${{ needs.changes.outputs.landing }}"

          fail() { echo "$1"; exit 1; }

          require() {
            local name="$1" result="$2" allow_skip="$3"
            if [[ "$allow_skip" == "true" ]]; then
              [[ "$result" == "success" || "$result" == "skipped" ]] || fail "$name: $result"
            else
              [[ "$result" == "success" ]] || fail "$name: $result"
            fi
          }

          # Stricter than require(): the job must have actually run. Used where
          # a "skipped" result would mean the check never happened at all.
          require_ran() {
            local name="$1" result="$2" changed="$3"
            [[ "$changed" == "true" ]] || return 0
            [[ "$result" == "success" ]] \
              || fail "$name: $result (sources changed; must not be skipped)"
          }

          require "gitleaks" "$gitleaks" "false"

          if [[ "$tier" == "issue" ]]; then
            require "lint" "$lint" "true"
            require "typecheck" "$typecheck" "true"
            require "test" "$test" "true"
            require "frontend" "$fe" "true"
            require "demo-frontend" "$demo" "true"
            require "landing-frontend" "$landing" "true"
            require "policy-checks" "$policy" "false"
            require "artifact-retention-guard" "$artifact_retention_guard" "false"
            require "validate-gates" "$validate_gates" "false"
          elif [[ "$tier" == "wave" ]]; then
            # lint/typecheck also run at wave tier so a wave assembled by local
            # merges (rather than issue-tier PRs) is still statically checked.
            # Allow "skipped": they are gated on changes.backend.
            require "lint" "$lint" "true"
            require "typecheck" "$typecheck" "true"
            require "integration-tests" "$integration" "true"
            require "dependency-validation" "$deps" "true"
            require "cross-module-contracts" "$contracts" "true"
            require "architecture-gates" "$arch" "true"
          elif [[ "$tier" == "main" ]]; then
            # merge_group requires success for the same main-tier gates.
            # lint/typecheck/frontend/demo-frontend allow "skipped": when
            # reached via wave->main (main_via_wave) they already ran per
            # issue at issue tier — no CI double-run (#658 audit addendum).
            require "lint" "$lint" "true"
            require "typecheck" "$typecheck" "true"
            require "architecture-gates" "$arch" "false"
            require "bandit" "$bandit" "false"
            require "nginx-rate-limit-lint" "$nginx_lint" "false"
            require "nginx-config-parses" "$nginx_parse" "false"
            require "full-regression" "$regression" "false"
            require "migration-check" "$mig" "false"
            require "two-tenant-isolation-proof" "$isolation_proof" "false"
            require "frontend" "$fe" "true"
            require "demo-frontend" "$demo" "true"
            require "landing-frontend" "$landing" "true"
            # #1437: main_via_wave means this main-tier run came from a wave
            # branch. A wave assembled by local merges never ran the frontend
            # jobs at issue tier, so a "skipped" result there is not a dedup —
            # it is zero eslint, tsc and jest. Fail closed for any frontend
            # domain the wave actually changed.
            if [[ "$main_via_wave" == "true" ]]; then
              require_ran "frontend" "$fe" "$dashboard_changed"
              require_ran "demo-frontend" "$demo" "$demo_changed"
              require_ran "landing-frontend" "$landing" "$landing_changed"
            fi
            require "demo-deploy-contracts" "$demo_deploy" "false"
            require "demo-e2e" "$demo_e2e" "false"
            require "performance-smoke" "$perf" "false"
            require "security-scan" "$security" "false"
            require "deployment-checks" "$deployment" "false"
            require "artifact-gate" "$artifact_gate" "false"
            if [[ "${{ github.event_name }}" == "merge_group" ]]; then
              require "test-live-sandbox" "$live_sandbox" "false"
            else
              require "test-live-sandbox" "$live_sandbox" "true"
            fi
            require "dependency-validation" "$deps" "false"
          else
            fail "Unknown CI tier: $tier"
          fi

          echo "All required $tier-tier checks passed."
