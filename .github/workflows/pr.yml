# Two-tier CI:
# - pull_request: path-filtered fast tier (skip unrelated packages) + always-on gitleaks.
# - merge_group: full required suite (no path skips).
# Enable GitHub Merge Queue on main and require this workflow's status-check job.

name: PR Validation

on:
  pull_request:
    branches: [main, staging]
  merge_group:
    branches: [main]

concurrency:
  group: >-
    ${{ github.event_name == 'merge_group'
        && format('merge-group-{0}', github.ref)
        || format('pr-{0}', github.head_ref) }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set-outputs.outputs.backend }}
      migrations: ${{ steps.set-outputs.outputs.migrations }}
      dashboard: ${{ steps.set-outputs.outputs.dashboard }}
      demo: ${{ steps.set-outputs.outputs.demo }}
      agent: ${{ steps.set-outputs.outputs.agent }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'merge_group'
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'alembic.ini'
              - 'alembic/**'
              - 'packages/contracts/**'
            migrations:
              - 'backend/**/migrations/**'
              - 'alembic.ini'
              - 'alembic/**'
            dashboard:
              - 'apps/dashboard/**'
            demo:
              - 'apps/demo/**'
              - 'packages/ui/**'
              - 'packages/theme/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            agent:
              - 'agent-runtime/**'
              - '.cursor/**'
      - name: Set path-filter outputs
        id: set-outputs
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            for key in backend migrations dashboard demo agent; do
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            done
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "migrations=${{ steps.filter.outputs.migrations }}" >> "$GITHUB_OUTPUT"
            echo "dashboard=${{ steps.filter.outputs.dashboard }}" >> "$GITHUB_OUTPUT"
            echo "demo=${{ steps.filter.outputs.demo }}" >> "$GITHUB_OUTPUT"
            echo "agent=${{ steps.filter.outputs.agent }}" >> "$GITHUB_OUTPUT"
          fi

  resolve-issue:
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.issue.outputs.number }}
    steps:
      - name: Resolve issue number from branch
        id: issue
        run: |
          branch="${{ github.head_ref }}"
          if [[ -z "$branch" ]]; then
            branch="${{ github.event.merge_group.head_ref }}"
          fi
          if [[ -z "$branch" ]]; then
            branch="${{ github.ref_name }}"
          fi
          if [[ "$branch" =~ issue-([0-9]+) ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

  lint-and-typecheck:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
      - name: Ruff
        run: ruff check backend/src/juli_backend tests scripts
      - name: Mypy
        run: mypy backend/src/juli_backend --ignore-missing-imports --disable-error-code=valid-type

  bandit:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Bandit (fail on medium+ severity)
        run: bandit -r backend/src/juli_backend -ll

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.backend == 'true'
    # ADR-040: PR-safe Tests — fail-fast if a test hangs (healthy suite ~4–5 min).
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      # APP_KEY/SECRET: ASGI webhook signature tests (non-live). Live oauth secrets
      # live only on test-live-sandbox (merge_group).
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]"
      - name: Install PostgreSQL client 16
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Pytest with coverage (PR-safe Tests)
        # ADR-040: exclude live + demo_contract.
        # PR also excludes migration_heavy + phase_scaffold (run on MQ / path jobs).
        # Floor set 5 points below the measured juli_backend baseline (85%, 2026-07-09).
        # timeout=30 comes from pytest.ini (pytest-timeout).
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            MARKERS='not live and not demo_contract'
          else
            MARKERS='not live and not demo_contract and not migration_heavy and not phase_scaffold'
          fi
          pytest tests/ -v --tb=short \
            -m "$MARKERS" \
            --cov=juli_backend --cov-report=term-missing --cov-fail-under=80
      - name: Pytest migration-heavy (migration paths on PR)
        if: >-
          github.event_name == 'pull_request'
          && needs.changes.outputs.migrations == 'true'
        run: pytest tests/ -v --tb=short -m migration_heavy

  test-live-sandbox:
    runs-on: ubuntu-latest
    needs: changes
    # ADR-040: live Partner oauth only on merge_group (not every PR push).
    if: github.event_name == 'merge_group'
    timeout-minutes: 15
    env:
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
      TIKTOK_SANDBOX_AUTH_CODE: ${{ secrets.TIKTOK_SANDBOX_AUTH_CODE }}
      TIKTOK_SANDBOX_REFRESH_TOKEN: ${{ secrets.TIKTOK_SANDBOX_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]"
      - name: Live TikTok sandbox pytest
        run: pytest tests/ -v --tb=short -m live

  migration-check:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'merge_group'
      || needs.changes.outputs.migrations == 'true'
      || needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/migration_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]"
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Alembic downgrade one
        run: alembic downgrade -1
      - name: Alembic re-upgrade head
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.dashboard == 'true'
    defaults:
      run:
        working-directory: apps/dashboard
    # Build-time env matches infra/scripts/env/web.env.example (App Review deploy) —
    # NEXT_PUBLIC_* values are baked into the bundle at build time.
    env:
      NEXT_PUBLIC_API_URL: https://api.app-juli.com
      NEXT_PUBLIC_UI_ONLY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install and test
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm run test
      - name: Production build
        run: npm run build

  demo-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Demo dependency graph
        run: pnpm install --frozen-lockfile --filter @juli/demo...
      - name: Check Demo independently
        run: pnpm check:demo

  demo-deploy-contracts:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: pip install -e "./backend[dev]"
      - name: Demo contract tests (ADR-040 demo_contract)
        run: python -m pytest -m demo_contract -q

  demo-e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Demo dependency graph
        run: pnpm install --frozen-lockfile --filter @juli/demo...
      - name: Install Playwright Chromium
        run: pnpm --filter @juli/demo exec playwright install chromium
      - name: Phase 2.6 Demo exit-gate Playwright (#407)
        run: pnpm --filter @juli/demo test:e2e

  validate-artifacts:
    runs-on: ubuntu-latest
    needs: resolve-issue
    if: needs.resolve-issue.outputs.issue_number != ''
    env:
      ISSUE_NUMBER: ${{ needs.resolve-issue.outputs.issue_number }}
      GITHUB_BASE_REF: ${{ github.base_ref }}
      GITHUB_HEAD_REF: ${{ github.head_ref }}
      # Required for meta_prepare_executor / fingerprint gates (gh issue view).
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run validate gates
        run: |
          issue="${ISSUE_NUMBER}"
          failed=0
          # Workflow caches are gitignored (machine-local). Bootstrap before gates
          # so check_workflow_cache_* / issue_load_profile can run in CI.
          echo "==> agent-runtime/scripts/meta_prepare_executor.py --issue $issue"
          python agent-runtime/scripts/meta_prepare_executor.py --issue "$issue" || failed=1
          for script in agent-runtime/scripts/validate/check_*.py; do
            echo "==> $script"
            python "$script" --issue "$issue" || failed=1
          done
          echo "==> agent-runtime/scripts/ci/normalize_review_artifacts.py --check"
          python agent-runtime/scripts/ci/normalize_review_artifacts.py --issue "$issue" --check || failed=1
          exit "$failed"

  generate-validation-artifact:
    runs-on: ubuntu-latest
    needs: [resolve-issue, validate-artifacts]
    if: needs.resolve-issue.outputs.issue_number != ''
    env:
      ISSUE_NUMBER: ${{ needs.resolve-issue.outputs.issue_number }}
      GITHUB_BASE_REF: ${{ github.base_ref }}
      GITHUB_HEAD_REF: ${{ github.head_ref }}
      # Required for meta_prepare_executor / fingerprint gates (gh issue view).
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate validation artifact
        run: |
          issue="${ISSUE_NUMBER}"
          # Workflow caches are gitignored (machine-local). Bootstrap before
          # CHECKS that load child cache (public_release_*, executor_domain,
          # phase_run_correlation, release_evidence_plan_continuity).
          echo "==> agent-runtime/scripts/meta_prepare_executor.py --issue $issue"
          python agent-runtime/scripts/meta_prepare_executor.py --issue "$issue"
          echo "==> agent-runtime/scripts/ci/generate_validation_artifact.py --issue $issue"
          python agent-runtime/scripts/ci/generate_validation_artifact.py --issue "$issue"
      - name: Upload validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: validation-issue-${{ needs.resolve-issue.outputs.issue_number }}
          path: agent-runtime/artifacts/validation/validation-issue-${{ needs.resolve-issue.outputs.issue_number }}.json

  status-check:
    runs-on: ubuntu-latest
    needs:
      - changes
      - resolve-issue
      - lint-and-typecheck
      - bandit
      - gitleaks
      - test
      - test-live-sandbox
      - migration-check
      - frontend
      - demo-frontend
      - demo-deploy-contracts
      - demo-e2e
      - validate-artifacts
      - generate-validation-artifact
    if: always()
    steps:
      - name: Require all jobs
        run: |
          event="${{ github.event_name }}"
          lint="${{ needs.lint-and-typecheck.result }}"
          bandit="${{ needs.bandit.result }}"
          gitleaks="${{ needs.gitleaks.result }}"
          test="${{ needs.test.result }}"
          live="${{ needs.test-live-sandbox.result }}"
          mig="${{ needs.migration-check.result }}"
          fe="${{ needs.frontend.result }}"
          demo="${{ needs.demo-frontend.result }}"
          demo_deploy="${{ needs.demo-deploy-contracts.result }}"
          demo_e2e="${{ needs.demo-e2e.result }}"
          val="${{ needs.validate-artifacts.result }}"
          gen="${{ needs.generate-validation-artifact.result }}"
          issue='${{ needs.resolve-issue.outputs.issue_number }}'

          fail() { echo "$1"; exit 1; }

          # merge_group: full suite must succeed (skipped = fail).
          # pull_request: path-filtered jobs may be skipped; gitleaks always required.
          require() {
            local name="$1" result="$2" allow_skip="$3"
            if [[ "$event" == "merge_group" ]]; then
              [[ "$result" == "success" ]] || fail "$name: $result (merge_group requires success, not skipped)"
            elif [[ "$allow_skip" == "true" ]]; then
              [[ "$result" == "success" || "$result" == "skipped" ]] || fail "$name: $result"
            else
              [[ "$result" == "success" ]] || fail "$name: $result"
            fi
          }

          require "gitleaks" "$gitleaks" "false"
          require "lint-and-typecheck" "$lint" "true"
          require "bandit" "$bandit" "true"
          require "test" "$test" "true"
          # PR: skipped (job if is merge_group only). merge_group: required.
          require "test-live-sandbox" "$live" "true"
          require "migration-check" "$mig" "true"
          require "frontend" "$fe" "true"
          require "demo-frontend" "$demo" "true"
          require "demo-deploy-contracts" "$demo_deploy" "true"
          require "demo-e2e" "$demo_e2e" "true"

          if [[ -n "$issue" ]]; then
            require "validate-artifacts" "$val" "false"
            require "generate-validation-artifact" "$gen" "false"
          else
            echo "Skipping artifact gates (no issue-N in branch ref)"
            if [[ "$event" == "pull_request" ]]; then
              [[ "$val" == "success" || "$val" == "skipped" ]] || fail "validate-artifacts: $val"
              [[ "$gen" == "success" || "$gen" == "skipped" ]] || fail "generate-validation-artifact: $gen"
            fi
          fi

          echo "All required checks passed."
