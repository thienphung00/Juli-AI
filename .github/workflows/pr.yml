# Three-tier CI:
# - issue PR -> feature/*-wave: affected-package unit, review, and policy checks.
# - push -> feature/*-wave: integration, dependency, contract, and architecture checks.
# - wave PR -> main: full pre-merge regression, E2E, runtime smoke, security, and deploy checks.
# release.yml remains the only workflow that deploys after merge to main.

name: PR Validation

on:
  pull_request:
    branches: [main, staging, "feature/*-wave"]
  push:
    branches: ["feature/*-wave"]
  merge_group:
    branches: [main]

concurrency:
  group: >-
    ${{ github.event_name == 'merge_group'
        && format('merge-group-{0}', github.ref)
        || github.event_name == 'push'
        && format('wave-{0}', github.ref)
        || format('pr-{0}', github.head_ref) }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-tier:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      # True when the main-tier run is reached via a feature/*-wave head on
      # the pull_request path (wave->main), which already ran
      # lint/typecheck/frontend/demo-frontend per-issue at issue tier —
      # avoids the CI double-run (#658 audit addendum). Scoped to
      # pull_request only: merge_group's head_ref is a synthetic
      # gh-readonly-queue/... ref that never matches feature/*-wave, so that
      # path is out of scope here (follow-up #671).
      main_via_wave: ${{ steps.classify.outputs.main_via_wave }}
    steps:
      - name: Classify CI tier
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "tier=main" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == feature/*-wave ]]; then
            echo "tier=wave" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == feature/*-wave ]]; then
            echo "tier=issue" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" && ( "$BASE_REF" == "main" || "$BASE_REF" == "staging" ) ]]; then
            echo "tier=main" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported CI flow: event=$EVENT_NAME base=$BASE_REF head=$HEAD_REF ref=$REF_NAME"
            exit 1
          fi
          # Note (ADR-052 / #660 rework): sibling base-reruns within a wave
          # are prevented at the branch-protection layer by ADR-052's
          # removal of "up-to-date-with-base" on feature/*-wave, NOT by an
          # event-level skip here. GitHub fires `synchronize` only when the
          # head SHA changes, so a before-SHA == after-SHA check on
          # synchronize is unreachable: a base-only advance (no head move)
          # fires no PR event at all. The retired signal from a prior
          # revision has been removed along with its job gates.
          wave_head=""
          if [[ "$EVENT_NAME" == "pull_request" && ( "$BASE_REF" == "main" || "$BASE_REF" == "staging" ) ]]; then
            wave_head="$HEAD_REF"
          fi
          if [[ "$wave_head" == feature/*-wave ]]; then
            echo "main_via_wave=true" >> "$GITHUB_OUTPUT"
          else
            echo "main_via_wave=false" >> "$GITHUB_OUTPUT"
          fi

  changes:
    runs-on: ubuntu-latest
    needs: classify-tier
    outputs:
      backend: ${{ steps.set-outputs.outputs.backend }}
      migrations: ${{ steps.set-outputs.outputs.migrations }}
      dashboard: ${{ steps.set-outputs.outputs.dashboard }}
      demo: ${{ steps.set-outputs.outputs.demo }}
      landing: ${{ steps.set-outputs.outputs.landing }}
      agent: ${{ steps.set-outputs.outputs.agent }}
      infra: ${{ steps.set-outputs.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CI-WAVE-3 (#661): resolve the push before->after diff range for a
      # wave-tier push, so the changes job can stop forcing every domain
      # true on push. A zero/missing before SHA (new branch) or an
      # unresolvable one (force-push whose prior tip this checkout can't
      # see) cannot be diffed safely, so it takes the documented bounded
      # fallback below: run every domain for that one push, same as the
      # pre-CI-WAVE-3 all-true behavior. That fallback is slower, never
      # less safe, and never skips gitleaks or status-check's tier-aware
      # classification (both stay unconditional on domain outputs).
      - name: Resolve wave-push diff range
        id: wave-range
        if: needs.classify-tier.outputs.tier == 'wave'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "$zero_sha" ]]; then
            echo "wave-push: before SHA is zero/missing (new or force-pushed branch); using bounded all-domain fallback."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "wave-push: before SHA $BEFORE_SHA is unresolvable in this checkout; using bounded all-domain fallback."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v4
        if: needs.classify-tier.outputs.tier == 'issue'
        id: filter
        with:
          filters: &domain-path-filters |
            backend:
              - 'backend/**'
              - 'tests/**'
              - 'scripts/**'
              # #1528: the Ruff step lints agent-runtime/scripts, and tests/unit
              # imports from it, so Python there belongs to the backend gate
              # set. Deliberately the scripts subtree only — agent-runtime docs,
              # config and artifacts, and .cursor/**, stay in the cheap `agent`
              # domain below.
              - 'agent-runtime/scripts/**'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'alembic.ini'
              - 'alembic/**'
              - 'packages/contracts/**'
              - '.importlinter.toml'
              - 'docs/architecture/ownership-registry.yml'
              - 'docs/architecture/import-boundaries.md'
            migrations:
              - 'backend/**/migrations/**'
              - 'alembic.ini'
              - 'alembic/**'
            dashboard:
              - 'apps/dashboard/**'
            demo:
              - 'apps/demo/**'
              - 'packages/ui/**'
              - 'packages/theme/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            landing:
              - 'apps/landing/**'
              - 'packages/brand/**'
              - 'packages/ui/**'
              - 'packages/theme/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            agent:
              - 'agent-runtime/**'
              - '.cursor/**'
            # Nginx edge config (#898/ADR-061 §2b). Scoped to the nginx tree and its
            # own CI scripts, not all of infra/**, so unrelated infra changes (deploy
            # scripts, systemd units) don't pay for a package install + nginx -t.
            infra:
              - 'infra/nginx/**'
              - 'infra/scripts/provision-nginx.sh'
              - 'agent-runtime/scripts/ci/check_nginx_rate_limits.py'
              - 'agent-runtime/scripts/ci/check_nginx_config_parses.sh'
      # Wave-tier push: diff the landed commit range (before->after) with
      # the same domain filter definitions used at issue tier, instead of
      # forcing every domain true. Skipped when the before SHA can't be
      # resolved (see the documented fallback above).
      - uses: dorny/paths-filter@v4
        if: >-
          needs.classify-tier.outputs.tier == 'wave'
          && steps.wave-range.outputs.fallback == 'false'
        id: filter-wave
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.event.after }}
          filters: *domain-path-filters
      - name: Set path-filter outputs
        id: set-outputs
        env:
          TIER: ${{ needs.classify-tier.outputs.tier }}
          WAVE_FALLBACK: ${{ steps.wave-range.outputs.fallback }}
        run: |
          {
            if [[ "$TIER" == "main" ]]; then
              # Wave->main remains the full, path-aware checkpoint (#658):
              # every domain runs regardless of what the wave push touched.
              for key in backend migrations dashboard demo landing agent infra; do
                echo "${key}=true"
              done
            elif [[ "$TIER" == "wave" && "$WAVE_FALLBACK" == "true" ]]; then
              # Documented bounded fallback: unresolvable before SHA.
              for key in backend migrations dashboard demo landing agent infra; do
                echo "${key}=true"
              done
            elif [[ "$TIER" == "wave" ]]; then
              echo "backend=${{ steps.filter-wave.outputs.backend }}"
              echo "migrations=${{ steps.filter-wave.outputs.migrations }}"
              echo "dashboard=${{ steps.filter-wave.outputs.dashboard }}"
              echo "demo=${{ steps.filter-wave.outputs.demo }}"
              echo "landing=${{ steps.filter-wave.outputs.landing }}"
              echo "agent=${{ steps.filter-wave.outputs.agent }}"
              echo "infra=${{ steps.filter-wave.outputs.infra }}"
            else
              echo "backend=${{ steps.filter.outputs.backend }}"
              echo "migrations=${{ steps.filter.outputs.migrations }}"
              echo "dashboard=${{ steps.filter.outputs.dashboard }}"
              echo "demo=${{ steps.filter.outputs.demo }}"
              echo "landing=${{ steps.filter.outputs.landing }}"
              echo "agent=${{ steps.filter.outputs.agent }}"
              echo "infra=${{ steps.filter.outputs.infra }}"
            fi
          } >> "$GITHUB_OUTPUT"

  resolve-issue:
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.issue.outputs.number }}
    steps:
      - name: Resolve issue number from branch
        id: issue
        env:
          HEAD_REF: ${{ github.head_ref }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch="$HEAD_REF"
          if [[ -z "$branch" ]]; then
            branch="$MERGE_GROUP_HEAD_REF"
          fi
          if [[ -z "$branch" ]]; then
            branch="$REF_NAME"
          fi
          if [[ "$branch" =~ issue-([0-9]+) ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      (needs.classify-tier.outputs.tier == 'issue'
      || needs.classify-tier.outputs.tier == 'wave'
      || (needs.classify-tier.outputs.tier == 'main'
          && needs.classify-tier.outputs.main_via_wave != 'true'))
      && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]" -c backend/constraints.txt
          pip freeze | sort
      # agent-runtime/scripts is inside the perimeter (#1528, CI-WAVE-1). It
      # holds every harness gate, generator and schema validator and was linted
      # by nothing until now. It resolves to the repo-root ruff.toml profile
      # (E4,E7,E9,F) by Ruff's nearest-config rule, exactly like `tests` and
      # `scripts` — no per-path narrowing was invented for it. Widening the
      # repo-root profile to backend/pyproject.toml's (E,F,I,UP) is the
      # follow-up already named in ruff.toml's own comment; it surfaces 86
      # further pre-existing findings here (59 E501) and needs its own change.
      - name: Ruff
        run: ruff check backend/src/juli_backend tests scripts agent-runtime/scripts
      - name: Credentials-in-URL guard (#904)
        run: python agent-runtime/scripts/ci/check_credentials_in_url.py backend/src/juli_backend tests scripts

  typecheck:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      (needs.classify-tier.outputs.tier == 'issue'
      || needs.classify-tier.outputs.tier == 'wave'
      || (needs.classify-tier.outputs.tier == 'main'
          && needs.classify-tier.outputs.main_via_wave != 'true'))
      && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Mypy
        run: mypy backend/src/juli_backend --ignore-missing-imports --disable-error-code=valid-type

  architecture-gates:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      (needs.classify-tier.outputs.tier == 'wave'
      || needs.classify-tier.outputs.tier == 'main')
      && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Import boundaries (strict)
        run: >-
          python agent-runtime/scripts/ci/check_import_boundaries.py --strict
          --baseline-file docs/architecture/import-boundary-baseline.json
      - name: Dependency cycle check
        run: python agent-runtime/scripts/ci/audit_cycles.py --ci
      - name: Ownership registry drift
        run: python agent-runtime/scripts/ci/check_ownership_registry.py

  bandit:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Bandit (fail on medium+ severity)
        run: bandit -r backend/src/juli_backend -ll

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Issue #898 / ADR-061 §2b exit gate, split in two like the ADR's own CI-invariant
  # split: a fast static lint that runs with no external dependency, and a slower
  # config-parse check pinned to the nginx version the review VPS actually runs
  # (precedent: #882 "nginx configs must parse on the nginx we actually run").
  nginx-rate-limit-lint:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: limit_req present on webhook + demo locations, absent on /health
        run: python agent-runtime/scripts/ci/check_nginx_rate_limits.py

  nginx-config-parses:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install nginx (same package/version family as the review VPS, ADR-057)
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx-core openssl
      - name: nginx -t against the assembled candidate config
        run: sudo bash agent-runtime/scripts/ci/check_nginx_config_parses.sh

  test:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'issue'
      && needs.changes.outputs.backend == 'true'
    # ADR-040: PR-safe Tests — fail-fast if a test hangs (healthy suite ~4–5 min).
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/test_db
      # The Postgres service above is created for this job and destroyed with
      # it. tests/conftest.py refuses to run destructive suites against a
      # database that has not declared itself throwaway, and fails closed here
      # rather than skipping — a silent skip would report success having run
      # no Postgres test at all.
      JULI_TEST_DATABASE_DISPOSABLE: "1"
      REDIS_URL: redis://localhost:6379
      # APP_KEY/SECRET: ASGI webhook signature tests (non-live). Live oauth secrets
      # live only on test-live-sandbox (merge_group).
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
      PYTHONUNBUFFERED: "1"
      # #1608: this run's real integration base, same convention as
      # `validate-gates`/`policy-checks` below. Consumed both by the fetch
      # step (which ref to fetch by name) and, in-process, by
      # `harness_bootstrap_pin.resolve_base_ref_token` -- the base-anchored
      # gates this job exercises live (tests/unit/test_mutants.py) must
      # anchor to this run's actual base, not a hardcoded `main`. At issue
      # tier that base is a wave branch; a hardcoded `main` reported the
      # wave's own landed harness commits as drift (PR #1561; ADR-094).
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          # #1540/#1570: a depth-1 checkout makes origin/main an unknown
          # revision, so any gate anchored to a base ref fails for a reason
          # unrelated to the change under test. This enables #1540/#1561's
          # base-ref resolver; it does not repair a currently-red test — all
          # five base-anchored modules pass at depth 1 as well as at 200
          # (82 passed in both, measured on real clones).
          #
          # Bounded, NOT 0. Depth 200 resolves merge-base while leaving
          # `git rev-parse --is-shallow-repository` true. At depth 0
          # eval/negative_dataset.py::history_is_complete() flips to True and
          # #1579's two rows fail. Note that 200 is NOT a state that predicate
          # describes: the clone is still shallow, yet 59 of the 125 git_commit
          # rows are reachable, so that suite judges each row against what git
          # actually holds rather than against a clone-wide verdict.
          fetch-depth: 200
      # #1604: fetch-depth alone does not create `origin/<base>`. actions/checkout
      # fetches only the ref it checks out (`+<sha>:refs/remotes/pull/<N>/merge`
      # on a PR event) -- depth bounds how far back *that ref* goes, it cannot
      # bring a second branch into existence. Without this, `origin/main` stayed
      # an unknown revision at any depth (live proof: PR #1561, run
      # 33848493670). Bounded to the same 200, so the clone stays shallow --
      # see the comment above; --depth 0 would flip history_is_complete().
      #
      # #1608: fetches `origin/${BASE_REF}` -- this run's *actual* base --
      # rather than a hardcoded `main`. At issue tier `github.base_ref` is a
      # wave branch, not `main`; fetching `main` there names a ref that is not
      # this PR's base at all, and every gate anchored to it (the
      # `harness_bootstrap_pin` gate this job exercises live, via
      # tests/unit/test_mutants.py) measures drift against the wrong history.
      # At main tier `github.base_ref` *is* `main`, so this one dynamic step
      # is correct at both tiers without a conditional (ADR-094).
      #
      # #1604 follow-up: this fetch is a second, independent depth-bounded
      # fetch against an already-shallow checkout. That combination moves the
      # shallow boundary and can drop a commit `actions/checkout`'s own fetch
      # had made reachable back out of `git rev-list --all` (measured:
      # fix_commits/957d94212a58b698's commit stayed `git cat-file -t`-visible
      # but became unreachable). A single fetch naming both refspecs together
      # avoids it, but actions/checkout owns the first fetch opaquely, so the
      # two calls cannot be merged into one invocation. Re-fetching the
      # checked-out commit by its own sha immediately after restores the
      # boundary this fetch moves -- verified empirically in a faithful
      # checkout repro (origin/<base> resolves, is-shallow-repository stays
      # true, merge-base resolves, and the #943 commit stays reachable).
      - name: Fetch base ref (origin/${{ github.base_ref }})
        run: |
          git fetch --depth=200 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git fetch --depth=200 origin "$(git rev-parse HEAD)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # #1126: tests/unit/test_agent_events_contract.py is the repo's first
      # dual-language contract test -- it shells out to node to introspect
      # packages/contracts' TypeScript event mirror and compares it against
      # the Python union. Without the workspace's node_modules it fails with
      # "Cannot find module 'typescript'" rather than skipping, so this
      # otherwise Python-only job needs the node toolchain.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install contracts dependency graph
        run: pnpm install --frozen-lockfile --filter "./packages/contracts..."
      - name: Install dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Install PostgreSQL client 16
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Pytest with coverage (PR-safe Tests)
        # ADR-040: issue tier excludes live, deploy contracts, and heavy suites.
        # Floor set 5 points below the measured juli_backend baseline (85%, 2026-07-09).
        # timeout=30 comes from pytest.ini (pytest-timeout).
        # #943/#948: tests/integration/test_schema_parity.py intentionally still
        # runs here — it carries its own `schema_parity` marker (not
        # `migration_heavy`) so this deselect does not skip it. It needs only
        # this job's existing postgres service + DATABASE_URL, and closes the
        # model/migration drift gap that shipped products.revenue/units_sold
        # (#943) and inventory_items.velocity (#948) past a fully green CI.
        run: |
          python -X faulthandler -m pytest tests/ -v --tb=short \
            -m "not live and not demo_contract and not migration_heavy and not phase_scaffold" \
            --cov=juli_backend --cov-report=term-missing --cov-fail-under=80

  test-live-sandbox:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    # ADR-040: live Partner oauth only on merge_group (not every PR push).
    if: github.event_name == 'merge_group'
    timeout-minutes: 15
    env:
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
      TIKTOK_SANDBOX_AUTH_CODE: ${{ secrets.TIKTOK_SANDBOX_AUTH_CODE }}
      TIKTOK_SANDBOX_REFRESH_TOKEN: ${{ secrets.TIKTOK_SANDBOX_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Live TikTok sandbox pytest
        run: python -m pytest tests/ -v --tb=short -m live

  migration-check:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && (needs.changes.outputs.migrations == 'true'
      || needs.changes.outputs.backend == 'true')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/migration_test
      # The Postgres service above is created for this job and destroyed with
      # it. tests/conftest.py refuses to run destructive suites against a
      # database that has not declared itself throwaway, and fails closed here
      # rather than skipping — a silent skip would report success having run
      # no Postgres test at all.
      JULI_TEST_DATABASE_DISPOSABLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      # #897 exit gate: create the PostgREST client roles BEFORE migrations run so
      # 021_medallion_schemas' + 032_close_public_schema_defaults' role-guarded
      # REVOKE/ALTER DEFAULT PRIVILEGES statements actually execute in CI instead of
      # silently skipping their `IF EXISTS (SELECT 1 FROM pg_roles ...)` guard.
      #
      # #929: this step ALSO seeds Supabase-equivalent bootstrap grants on `public`
      # (GRANT ALL ... TO anon, authenticated + matching ALTER DEFAULT PRIVILEGES)
      # BEFORE any migration runs. This simulates Supabase's own project-bootstrap
      # grant — vanilla postgres:16 never auto-grants table privileges to non-owner
      # roles, so without this seed there is nothing for migration 029's
      # `ALTER DEFAULT PRIVILEGES ... REVOKE ALL` clause to counteract, and a table
      # created after `upgrade head` is unreachable regardless of whether that
      # clause ran. Do NOT delete this as redundant setup — it is what makes the
      # "must PASS for a table created AFTER head" step below a real test of
      # ADR-061 decision 1 instead of a substrate artifact.
      - name: Create PostgREST client roles + seed Supabase bootstrap grants
        run: python agent-runtime/scripts/ci/ensure_postgrest_client_roles.py
      - name: Alembic upgrade to pre-#897 revision
        run: alembic upgrade 028_demo_execution_records
      # Demonstrates the exit-gate assertion actually detects the open boundary:
      # the public schema is still fully open to anon/authenticated at this
      # revision, so the check below MUST fail; invert its exit code and fail the
      # job if it doesn't.
      - name: Public-schema boundary check must FAIL before #897
        run: |
          if python agent-runtime/scripts/ci/check_public_schema_privileges.py; then
            echo "::error::privilege check unexpectedly PASSED against the pre-#897 schema state — it is not detecting the open public schema"
            exit 1
          fi
          echo "confirmed: privilege check correctly fails against the pre-#897 schema state"
      - name: Alembic upgrade head
        run: alembic upgrade head
      # #897 exit gate: live pg_catalog query, fails the build if any table outside
      # the explicit gold allowlist is reachable by anon/authenticated.
      - name: Public-schema boundary check must PASS at head
        run: python agent-runtime/scripts/ci/check_public_schema_privileges.py
      - name: Alembic downgrade one
        run: alembic downgrade -1
      - name: Alembic re-upgrade head
        run: alembic upgrade head
      - name: Public-schema boundary check must PASS after downgrade/re-upgrade
        run: python agent-runtime/scripts/ci/check_public_schema_privileges.py
      # #929 decisive proof: create a table AFTER `alembic upgrade head`, with no
      # explicit GRANT of any kind. Its reachability depends entirely on which
      # default privileges were in force at CREATE TABLE time — the Supabase
      # bootstrap grant seeded above if migration 029's `ALTER DEFAULT PRIVILEGES`
      # clause did nothing, or the closed default that clause installs if it did.
      # This is the property the "born closed" pytest test in
      # tests/integration/test_migrations.py also exercises; this step proves it
      # in CI's real fresh-cluster, straight-to-head substrate.
      - name: Create a new public table after upgrade head (#929)
        run: python agent-runtime/scripts/ci/create_post_head_scratch_table.py
      - name: Public-schema boundary check must PASS for a table created AFTER head
        run: python agent-runtime/scripts/ci/check_public_schema_privileges.py

  two-tenant-isolation-proof:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes, migration-check]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && (needs.changes.outputs.migrations == 'true'
      || needs.changes.outputs.backend == 'true')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: isolation_test
        ports:
          - 5433:5432
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5433/isolation_test
      # The Postgres service above is created for this job and destroyed with
      # it. tests/conftest.py refuses to run destructive suites against a
      # database that has not declared itself throwaway, and fails closed here
      # rather than skipping — a silent skip would report success having run
      # no Postgres test at all.
      JULI_TEST_DATABASE_DISPOSABLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
