# Three-tier CI:
# - issue PR -> feature/*-wave: affected-package unit, review, and policy checks.
# - push -> feature/*-wave: integration, dependency, contract, and architecture checks.
# - wave PR -> main: full pre-merge regression, E2E, runtime smoke, security, and deploy checks.
# release.yml remains the only workflow that deploys after merge to main.

name: PR Validation

on:
  pull_request:
    branches: [main, staging, "feature/*-wave"]
  push:
    branches: ["feature/*-wave"]
  merge_group:
    branches: [main]

concurrency:
  group: >-
    ${{ github.event_name == 'merge_group'
        && format('merge-group-{0}', github.ref)
        || github.event_name == 'push'
        && format('wave-{0}', github.ref)
        || format('pr-{0}', github.head_ref) }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-tier:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      # True when the main-tier run is reached via a feature/*-wave head on
      # the pull_request path (wave->main), which already ran
      # lint/typecheck/frontend/demo-frontend per-issue at issue tier —
      # avoids the CI double-run (#658 audit addendum). Scoped to
      # pull_request only: merge_group's head_ref is a synthetic
      # gh-readonly-queue/... ref that never matches feature/*-wave, so that
      # path is out of scope here (follow-up #671).
      main_via_wave: ${{ steps.classify.outputs.main_via_wave }}
    steps:
      - name: Classify CI tier
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "tier=main" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == feature/*-wave ]]; then
            echo "tier=wave" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == feature/*-wave ]]; then
            echo "tier=issue" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" && ( "$BASE_REF" == "main" || "$BASE_REF" == "staging" ) ]]; then
            echo "tier=main" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported CI flow: event=$EVENT_NAME base=$BASE_REF head=$HEAD_REF ref=$REF_NAME"
            exit 1
          fi
          # Note (ADR-052 / #660 rework): sibling base-reruns within a wave
          # are prevented at the branch-protection layer by ADR-052's
          # removal of "up-to-date-with-base" on feature/*-wave, NOT by an
          # event-level skip here. GitHub fires `synchronize` only when the
          # head SHA changes, so a before-SHA == after-SHA check on
          # synchronize is unreachable: a base-only advance (no head move)
          # fires no PR event at all. The retired signal from a prior
          # revision has been removed along with its job gates.
          wave_head=""
          if [[ "$EVENT_NAME" == "pull_request" && ( "$BASE_REF" == "main" || "$BASE_REF" == "staging" ) ]]; then
            wave_head="$HEAD_REF"
          fi
          if [[ "$wave_head" == feature/*-wave ]]; then
            echo "main_via_wave=true" >> "$GITHUB_OUTPUT"
          else
            echo "main_via_wave=false" >> "$GITHUB_OUTPUT"
          fi

  changes:
    runs-on: ubuntu-latest
    needs: classify-tier
    outputs:
      backend: ${{ steps.set-outputs.outputs.backend }}
      migrations: ${{ steps.set-outputs.outputs.migrations }}
      dashboard: ${{ steps.set-outputs.outputs.dashboard }}
      demo: ${{ steps.set-outputs.outputs.demo }}
      landing: ${{ steps.set-outputs.outputs.landing }}
      agent: ${{ steps.set-outputs.outputs.agent }}
      infra: ${{ steps.set-outputs.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CI-WAVE-3 (#661): resolve the push before->after diff range for a
      # wave-tier push, so the changes job can stop forcing every domain
      # true on push. A zero/missing before SHA (new branch) or an
      # unresolvable one (force-push whose prior tip this checkout can't
      # see) cannot be diffed safely, so it takes the documented bounded
      # fallback below: run every domain for that one push, same as the
      # pre-CI-WAVE-3 all-true behavior. That fallback is slower, never
      # less safe, and never skips gitleaks or status-check's tier-aware
      # classification (both stay unconditional on domain outputs).
      - name: Resolve wave-push diff range
        id: wave-range
        if: needs.classify-tier.outputs.tier == 'wave'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "$zero_sha" ]]; then
            echo "wave-push: before SHA is zero/missing (new or force-pushed branch); using bounded all-domain fallback."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "wave-push: before SHA $BEFORE_SHA is unresolvable in this checkout; using bounded all-domain fallback."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v4
        if: needs.classify-tier.outputs.tier == 'issue'
        id: filter
        with:
          filters: &domain-path-filters |
            backend:
              - 'backend/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'alembic.ini'
              - 'alembic/**'
              - 'packages/contracts/**'
              - '.importlinter.toml'
              - 'docs/architecture/ownership-registry.yml'
              - 'docs/architecture/import-boundaries.md'
            migrations:
              - 'backend/**/migrations/**'
              - 'alembic.ini'
              - 'alembic/**'
            dashboard:
              - 'apps/dashboard/**'
            demo:
              - 'apps/demo/**'
              - 'packages/ui/**'
              - 'packages/theme/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            landing:
              - 'apps/landing/**'
              - 'packages/brand/**'
              - 'packages/ui/**'
              - 'packages/theme/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            agent:
              - 'agent-runtime/**'
              - '.cursor/**'
            # Nginx edge config (#898/ADR-061 §2b). Scoped to the nginx tree and its
            # own CI scripts, not all of infra/**, so unrelated infra changes (deploy
            # scripts, systemd units) don't pay for a package install + nginx -t.
            infra:
              - 'infra/nginx/**'
              - 'infra/scripts/provision-nginx.sh'
              - 'agent-runtime/scripts/ci/check_nginx_rate_limits.py'
              - 'agent-runtime/scripts/ci/check_nginx_config_parses.sh'
      # Wave-tier push: diff the landed commit range (before->after) with
      # the same domain filter definitions used at issue tier, instead of
      # forcing every domain true. Skipped when the before SHA can't be
      # resolved (see the documented fallback above).
      - uses: dorny/paths-filter@v4
        if: >-
          needs.classify-tier.outputs.tier == 'wave'
          && steps.wave-range.outputs.fallback == 'false'
        id: filter-wave
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.event.after }}
          filters: *domain-path-filters
      - name: Set path-filter outputs
        id: set-outputs
        env:
          TIER: ${{ needs.classify-tier.outputs.tier }}
          WAVE_FALLBACK: ${{ steps.wave-range.outputs.fallback }}
        run: |
          {
            if [[ "$TIER" == "main" ]]; then
              # Wave->main remains the full, path-aware checkpoint (#658):
              # every domain runs regardless of what the wave push touched.
              for key in backend migrations dashboard demo landing agent infra; do
                echo "${key}=true"
              done
            elif [[ "$TIER" == "wave" && "$WAVE_FALLBACK" == "true" ]]; then
              # Documented bounded fallback: unresolvable before SHA.
              for key in backend migrations dashboard demo landing agent infra; do
                echo "${key}=true"
              done
            elif [[ "$TIER" == "wave" ]]; then
              echo "backend=${{ steps.filter-wave.outputs.backend }}"
              echo "migrations=${{ steps.filter-wave.outputs.migrations }}"
              echo "dashboard=${{ steps.filter-wave.outputs.dashboard }}"
              echo "demo=${{ steps.filter-wave.outputs.demo }}"
              echo "landing=${{ steps.filter-wave.outputs.landing }}"
              echo "agent=${{ steps.filter-wave.outputs.agent }}"
              echo "infra=${{ steps.filter-wave.outputs.infra }}"
            else
              echo "backend=${{ steps.filter.outputs.backend }}"
              echo "migrations=${{ steps.filter.outputs.migrations }}"
              echo "dashboard=${{ steps.filter.outputs.dashboard }}"
              echo "demo=${{ steps.filter.outputs.demo }}"
              echo "landing=${{ steps.filter.outputs.landing }}"
              echo "agent=${{ steps.filter.outputs.agent }}"
              echo "infra=${{ steps.filter.outputs.infra }}"
            fi
          } >> "$GITHUB_OUTPUT"

  resolve-issue:
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.issue.outputs.number }}
    steps:
      - name: Resolve issue number from branch
        id: issue
        env:
          HEAD_REF: ${{ github.head_ref }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch="$HEAD_REF"
          if [[ -z "$branch" ]]; then
            branch="$MERGE_GROUP_HEAD_REF"
          fi
          if [[ -z "$branch" ]]; then
            branch="$REF_NAME"
          fi
          if [[ "$branch" =~ issue-([0-9]+) ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      (needs.classify-tier.outputs.tier == 'issue'
      || needs.classify-tier.outputs.tier == 'wave'
      || (needs.classify-tier.outputs.tier == 'main'
          && needs.classify-tier.outputs.main_via_wave != 'true'))
      && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]" -c backend/constraints.txt
          pip freeze | sort
      - name: Ruff
        run: ruff check backend/src/juli_backend tests scripts
      - name: Credentials-in-URL guard (#904)
        run: python agent-runtime/scripts/ci/check_credentials_in_url.py backend/src/juli_backend tests scripts

  typecheck:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      (needs.classify-tier.outputs.tier == 'issue'
      || needs.classify-tier.outputs.tier == 'wave'
      || (needs.classify-tier.outputs.tier == 'main'
          && needs.classify-tier.outputs.main_via_wave != 'true'))
      && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Mypy
        run: mypy backend/src/juli_backend --ignore-missing-imports --disable-error-code=valid-type

  architecture-gates:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      (needs.classify-tier.outputs.tier == 'wave'
      || needs.classify-tier.outputs.tier == 'main')
      && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Import boundaries (strict)
        run: >-
          python agent-runtime/scripts/ci/check_import_boundaries.py --strict
          --baseline-file docs/architecture/import-boundary-baseline.json
      - name: Dependency cycle check
        run: python agent-runtime/scripts/ci/audit_cycles.py --ci
      - name: Ownership registry drift
        run: python agent-runtime/scripts/ci/check_ownership_registry.py

  bandit:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Bandit (fail on medium+ severity)
        run: bandit -r backend/src/juli_backend -ll

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Issue #898 / ADR-061 §2b exit gate, split in two like the ADR's own CI-invariant
  # split: a fast static lint that runs with no external dependency, and a slower
  # config-parse check pinned to the nginx version the review VPS actually runs
  # (precedent: #882 "nginx configs must parse on the nginx we actually run").
  nginx-rate-limit-lint:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: limit_req present on webhook + demo locations, absent on /health
        run: python agent-runtime/scripts/ci/check_nginx_rate_limits.py

  nginx-config-parses:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install nginx (same package/version family as the review VPS, ADR-057)
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx-core openssl
      - name: nginx -t against the assembled candidate config
        run: sudo bash agent-runtime/scripts/ci/check_nginx_config_parses.sh

  test:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'issue'
      && needs.changes.outputs.backend == 'true'
    # ADR-040: PR-safe Tests — fail-fast if a test hangs (healthy suite ~4–5 min).
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      # APP_KEY/SECRET: ASGI webhook signature tests (non-live). Live oauth secrets
      # live only on test-live-sandbox (merge_group).
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Install PostgreSQL client 16
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Pytest with coverage (PR-safe Tests)
        # ADR-040: issue tier excludes live, deploy contracts, and heavy suites.
        # Floor set 5 points below the measured juli_backend baseline (85%, 2026-07-09).
        # timeout=30 comes from pytest.ini (pytest-timeout).
        # #943/#948: tests/integration/test_schema_parity.py intentionally still
        # runs here — it carries its own `schema_parity` marker (not
        # `migration_heavy`) so this deselect does not skip it. It needs only
        # this job's existing postgres service + DATABASE_URL, and closes the
        # model/migration drift gap that shipped products.revenue/units_sold
        # (#943) and inventory_items.velocity (#948) past a fully green CI.
        run: |
          python -X faulthandler -m pytest tests/ -v --tb=short \
            -m "not live and not demo_contract and not migration_heavy and not phase_scaffold" \
            --cov=juli_backend --cov-report=term-missing --cov-fail-under=80

  test-live-sandbox:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    # ADR-040: live Partner oauth only on merge_group (not every PR push).
    if: github.event_name == 'merge_group'
    timeout-minutes: 15
    env:
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
      TIKTOK_SANDBOX_AUTH_CODE: ${{ secrets.TIKTOK_SANDBOX_AUTH_CODE }}
      TIKTOK_SANDBOX_REFRESH_TOKEN: ${{ secrets.TIKTOK_SANDBOX_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Live TikTok sandbox pytest
        run: python -m pytest tests/ -v --tb=short -m live

  migration-check:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && (needs.changes.outputs.migrations == 'true'
      || needs.changes.outputs.backend == 'true')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/migration_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      # #897 exit gate: create the PostgREST client roles BEFORE migrations run so
      # 021_medallion_schemas' + 032_close_public_schema_defaults' role-guarded
      # REVOKE/ALTER DEFAULT PRIVILEGES statements actually execute in CI instead of
      # silently skipping their `IF EXISTS (SELECT 1 FROM pg_roles ...)` guard.
      #
      # #929: this step ALSO seeds Supabase-equivalent bootstrap grants on `public`
      # (GRANT ALL ... TO anon, authenticated + matching ALTER DEFAULT PRIVILEGES)
      # BEFORE any migration runs. This simulates Supabase's own project-bootstrap
      # grant — vanilla postgres:16 never auto-grants table privileges to non-owner
      # roles, so without this seed there is nothing for migration 029's
      # `ALTER DEFAULT PRIVILEGES ... REVOKE ALL` clause to counteract, and a table
      # created after `upgrade head` is unreachable regardless of whether that
      # clause ran. Do NOT delete this as redundant setup — it is what makes the
      # "must PASS for a table created AFTER head" step below a real test of
      # ADR-061 decision 1 instead of a substrate artifact.
      - name: Create PostgREST client roles + seed Supabase bootstrap grants
        run: python agent-runtime/scripts/ci/ensure_postgrest_client_roles.py
      - name: Alembic upgrade to pre-#897 revision
        run: alembic upgrade 028_demo_execution_records
      # Demonstrates the exit-gate assertion actually detects the open boundary:
      # the public schema is still fully open to anon/authenticated at this
      # revision, so the check below MUST fail; invert its exit code and fail the
      # job if it doesn't.
      - name: Public-schema boundary check must FAIL before #897
        run: |
          if python agent-runtime/scripts/ci/check_public_schema_privileges.py; then
            echo "::error::privilege check unexpectedly PASSED against the pre-#897 schema state — it is not detecting the open public schema"
            exit 1
          fi
          echo "confirmed: privilege check correctly fails against the pre-#897 schema state"
      - name: Alembic upgrade head
        run: alembic upgrade head
      # #897 exit gate: live pg_catalog query, fails the build if any table outside
      # the explicit gold allowlist is reachable by anon/authenticated.
      - name: Public-schema boundary check must PASS at head
        run: python agent-runtime/scripts/ci/check_public_schema_privileges.py
      - name: Alembic downgrade one
        run: alembic downgrade -1
      - name: Alembic re-upgrade head
        run: alembic upgrade head
      - name: Public-schema boundary check must PASS after downgrade/re-upgrade
        run: python agent-runtime/scripts/ci/check_public_schema_privileges.py
      # #929 decisive proof: create a table AFTER `alembic upgrade head`, with no
      # explicit GRANT of any kind. Its reachability depends entirely on which
      # default privileges were in force at CREATE TABLE time — the Supabase
      # bootstrap grant seeded above if migration 029's `ALTER DEFAULT PRIVILEGES`
      # clause did nothing, or the closed default that clause installs if it did.
      # This is the property the "born closed" pytest test in
      # tests/integration/test_migrations.py also exercises; this step proves it
      # in CI's real fresh-cluster, straight-to-head substrate.
      - name: Create a new public table after upgrade head (#929)
        run: python agent-runtime/scripts/ci/create_post_head_scratch_table.py
      - name: Public-schema boundary check must PASS for a table created AFTER head
        run: python agent-runtime/scripts/ci/check_public_schema_privileges.py

  frontend:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      (needs.classify-tier.outputs.tier == 'issue'
      || (needs.classify-tier.outputs.tier == 'main'
          && needs.classify-tier.outputs.main_via_wave != 'true'))
      && needs.changes.outputs.dashboard == 'true'
    defaults:
      run:
        working-directory: apps/dashboard
    # Build-time env matches infra/scripts/env/web.env.example (App Review deploy) —
    # NEXT_PUBLIC_* values are baked into the bundle at build time.
    env:
      NEXT_PUBLIC_API_URL: https://api.app-juli.com
      NEXT_PUBLIC_UI_ONLY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install and test
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm run test
      - name: Production build
        run: npm run build

  demo-frontend:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      (needs.classify-tier.outputs.tier == 'issue'
      || (needs.classify-tier.outputs.tier == 'main'
          && needs.classify-tier.outputs.main_via_wave != 'true'))
      && needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Demo dependency graph
        run: pnpm install --frozen-lockfile --filter @juli/demo...
      - name: Check Demo independently
        run: pnpm check:demo

  landing-frontend:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      (needs.classify-tier.outputs.tier == 'issue'
      || (needs.classify-tier.outputs.tier == 'main'
          && needs.classify-tier.outputs.main_via_wave != 'true'))
      && needs.changes.outputs.landing == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Landing dependency graph
        run: pnpm install --frozen-lockfile --filter @juli/landing...
      - name: Check Landing independently
        run: pnpm check:landing

  demo-deploy-contracts:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Demo deploy contract tests (#406)
        run: |
          python -m pytest tests/unit/test_phase_2_6_demo_deploy_config.py \
            tests/unit/test_phase_2_6_demo_deploy.py -q

  demo-e2e:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.demo == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Demo dependency graph
        run: pnpm install --frozen-lockfile --filter @juli/demo...
      - name: Install Playwright Chromium
        run: pnpm --filter @juli/demo exec playwright install chromium
      - name: Phase 2.6 Demo exit-gate Playwright (#407)
        run: pnpm --filter @juli/demo test:e2e
      - name: Install Python test dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Demo exit-gate contract tests (#407)
        run: python -m pytest tests/unit/test_phase_2_6_demo_exit_gate.py -q

  # ADR-052: artifact validate/generate is deferred to the wave->main
  # artifact-gate job below — it is no longer an issue-tier blocker.
  # Deterministic existence+status check only (no meta_prepare_executor /
  # check_*.py re-run per issue push); see wave_manifest.py (CI-WAVE-1).
  artifact-gate:
    runs-on: ubuntu-latest
    needs: [classify-tier]
    if: needs.classify-tier.outputs.tier == 'main'
    env:
      HEAD_REF: ${{ github.head_ref }}
      MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate wave manifest issue artifacts (existence + PASS status)
        run: |
          branch="$HEAD_REF"
          if [[ -z "$branch" ]]; then
            branch="$MERGE_GROUP_HEAD_REF"
          fi
          if [[ ! "$branch" =~ ^feature/.+-wave$ ]]; then
            echo "artifact-gate: head '$branch' is not a wave branch; nothing to validate."
            exit 0
          fi
          mid="${branch#feature/}"
          mid="${mid%-wave}"
          wave_id="wave-${mid}"
          python agent-runtime/scripts/ci/wave_manifest.py \
            --wave-id "$wave_id" --branch "$branch" --check-artifacts

  # #1064 (design correction, superseding ADR-079's original "CI retention" framing):
  # pr.yml has no upload-artifact step for the five gitignored artifact body
  # directories and cannot have one -- they are gitignored and never reach the pushed
  # branch, so nothing lands on the runner to upload. What CI *can* see is the one
  # committed file `.gitignore` deliberately keeps tracked:
  # agent-runtime/artifacts/status/issue-<N>.json. This job fails an issue-tier PR when
  # that record is absent, or present but not PASS. It narrowly reverses one line of
  # ADR-052 (see the note added there for #1064): an existence + status read of one
  # committed JSON file, NOT the heavy meta_prepare_executor / check_*.py re-run
  # ADR-052 correctly deferred off this tier. Reuses classify-tier's tier == 'issue'
  # and resolve-issue's issue-([0-9]+) resolution rather than inventing a new branch
  # convention: wave-tier pushes and wave->main PRs are unaffected because this job
  # simply does not run for them (tier != 'issue'); a branch that reaches the issue
  # tier without resolving an issue number (docs/hotfix) is handled *inside* the
  # script as a logged SKIP -- never a silent pass. The check_*.py script never reads
  # or writes the five gitignored artifact body directories and never `git add -f`s
  # anything; agent-runtime/artifacts/status/ is the only artifact dir it touches.
  # Not wired into required branch-protection checks by this change -- that is a
  # repository-settings decision for the owner, called out in the PR body.
  artifact-retention-guard:
    runs-on: ubuntu-latest
    needs: [classify-tier, resolve-issue]
    if: needs.classify-tier.outputs.tier == 'issue'
    env:
      ISSUE_NUMBER: ${{ needs.resolve-issue.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check committed status record (existence + PASS)
        run: |
          python agent-runtime/scripts/ci/check_artifact_retention_guard.py \
            --issue "$ISSUE_NUMBER"

  policy-checks:
    runs-on: ubuntu-latest
    needs: [classify-tier, resolve-issue]
    if: >-
      needs.classify-tier.outputs.tier == 'issue'
    steps:
      - name: Require issue branch and issue linkage
        env:
          HEAD_REF: ${{ github.head_ref }}
          ISSUE_NUMBER: ${{ needs.resolve-issue.outputs.issue_number }}
        run: |
          [[ "$HEAD_REF" == feature/* ]] || {
            echo "Issue-tier PRs must use feature/* branches (got $HEAD_REF)"
            exit 1
          }
          [[ -n "$ISSUE_NUMBER" ]] || {
            echo "Issue-tier PR branch must contain issue-N"
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require issue present in target wave manifest (CI-WAVE-1 validator)
        env:
          BASE_REF: ${{ github.base_ref }}
          ISSUE_NUMBER: ${{ needs.resolve-issue.outputs.issue_number }}
        run: |
          mid="${BASE_REF#feature/}"
          mid="${mid%-wave}"
          wave_id="wave-${mid}"
          python agent-runtime/scripts/ci/wave_manifest.py \
            --wave-id "$wave_id" --branch "$BASE_REF" --issue "$ISSUE_NUMBER"

  integration-tests:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'wave'
      && needs.changes.outputs.backend == 'true'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Integration tests without live Partner calls
        run: python -m pytest tests/integration -v --tb=short -m "not live"

  dependency-validation:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    # CI-WAVE-3 (#661): main tier stays the full checkpoint (always runs);
    # wave-tier pushes are domain-matched like integration/architecture/
    # cross-module — only when the push range touched a dependency-graph
    # domain (backend/dashboard/demo), so agent/docs-only wave pushes stay
    # cheap. status-check allows this job to be "skipped" on wave tier.
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      || (needs.classify-tier.outputs.tier == 'wave'
          && (needs.changes.outputs.backend == 'true'
              || needs.changes.outputs.dashboard == 'true'
              || needs.changes.outputs.demo == 'true'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate Python dependency graph
        run: |
          pip install -e "./backend[dev]" -c backend/constraints.txt
          pip freeze | sort
          pip check
      - name: Validate pnpm lock graph
        run: pnpm install --frozen-lockfile --filter @juli/demo...
      - name: Validate dashboard npm lock
        working-directory: apps/dashboard
        run: npm ci --ignore-scripts

  cross-module-contracts:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'wave'
      && needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Dual-language contract tests (#1126's tests/unit/test_agent_events_contract.py)
      # shell out to `node -e` and `require("typescript")` with cwd
      # packages/contracts, so this job needs the same contracts dependency
      # graph the `test` job installs. Without it every such test fails with a
      # bare CalledProcessError — a job-config gap, not a product defect
      # (observed on the W3 wave push tier, 24 failures).
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install contracts dependency graph
        run: pnpm install --frozen-lockfile --filter "./packages/contracts..."
      - name: Install backend dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Cross-module contract tests
        run: >-
          python -m pytest tests/unit -q --tb=short
          -k "contract or boundary or ownership"

  full-regression:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.backend == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Same reason as cross-module-contracts above: this job runs the whole
      # of tests/unit, which includes the node-shelling dual-language contract
      # tests. The `test` job already installs this graph; these two did not.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install contracts dependency graph
        run: pnpm install --frozen-lockfile --filter "./packages/contracts..."
      - name: Install backend dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Install PostgreSQL client 16
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Full non-live regression suite
        run: |
          coverage erase
          python -X faulthandler -m pytest tests/unit -v --tb=short \
            -m "not live and not demo_contract" \
            --cov=juli_backend --cov-report= --cov-fail-under=0
          python -X faulthandler -m pytest tests/integration -v --tb=short \
            -m "not live and not demo_contract" \
            --cov=juli_backend --cov-append \
            --cov-report=term-missing --cov-fail-under=80

  performance-smoke:
    runs-on: ubuntu-latest
    needs: [classify-tier, changes]
    if: >-
      needs.classify-tier.outputs.tier == 'main'
      && needs.changes.outputs.backend == 'true'
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      TIKTOK_APP_KEY: ${{ secrets.TIKTOK_APP_KEY }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -e "./backend[dev]" -c backend/constraints.txt
      - name: Log resolved backend dependency versions
        run: pip freeze | sort
      - name: Bounded integration runtime smoke
        run: >-
          timeout 5m python -m pytest
          tests/integration/test_material_deployed_webhook_handoff.py
          tests/integration/test_inventory_poll_etl_upsert.py
          tests/integration/test_analytics_poll_etl_upsert.py
          -q --tb=short -m "not live and not migration_heavy" --durations=20

  security-scan:
    runs-on: ubuntu-latest
    needs: [classify-tier, bandit, gitleaks]
    if: always() && needs.classify-tier.outputs.tier == 'main'
    steps:
      - name: Require code and secret scanning
        env:
          BANDIT_RESULT: ${{ needs.bandit.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          [[ "$BANDIT_RESULT" == "success" ]] || {
            echo "bandit: $BANDIT_RESULT"
            exit 1
          }
          [[ "$GITLEAKS_RESULT" == "success" ]] || {
            echo "gitleaks: $GITLEAKS_RESULT"
            exit 1
          }

  deployment-checks:
    runs-on: ubuntu-latest
    needs:
      - classify-tier
      - frontend
      - demo-frontend
      - landing-frontend
      - demo-deploy-contracts
    if: always() && needs.classify-tier.outputs.tier == 'main'
    steps:
      - name: Require production builds and deploy contracts
        env:
          DASHBOARD_RESULT: ${{ needs.frontend.result }}
          DEMO_RESULT: ${{ needs.demo-frontend.result }}
          LANDING_RESULT: ${{ needs.landing-frontend.result }}
          DEPLOY_CONTRACT_RESULT: ${{ needs.demo-deploy-contracts.result }}
        run: |
          # frontend/demo-frontend may report "skipped" here on wave->main
          # (main_via_wave) — they already ran per issue at issue tier.
          for result in "$DASHBOARD_RESULT" "$DEMO_RESULT" "$LANDING_RESULT"; do
            [[ "$result" == "success" || "$result" == "skipped" ]] || {
              echo "deployment readiness dependency: $result"
              exit 1
            }
          done
          [[ "$DEPLOY_CONTRACT_RESULT" == "success" ]] || {
            echo "deployment readiness dependency: $DEPLOY_CONTRACT_RESULT"
            exit 1
          }

  status-check:
    runs-on: ubuntu-latest
    needs:
      - classify-tier
      - changes
      - resolve-issue
      - lint
      - typecheck
      - architecture-gates
      - bandit
      - nginx-rate-limit-lint
      - nginx-config-parses
      - gitleaks
      - test
      - test-live-sandbox
      - integration-tests
      - dependency-validation
      - cross-module-contracts
      - full-regression
      - performance-smoke
      - migration-check
      - frontend
      - demo-frontend
      - landing-frontend
      - demo-deploy-contracts
      - demo-e2e
      - artifact-gate
      - artifact-retention-guard
      - policy-checks
      - security-scan
      - deployment-checks
    if: always()
    steps:
      - name: Require tier jobs
        run: |
          tier="${{ needs.classify-tier.outputs.tier }}"
          lint="${{ needs.lint.result }}"
          typecheck="${{ needs.typecheck.result }}"
          arch="${{ needs.architecture-gates.result }}"
          bandit="${{ needs.bandit.result }}"
          nginx_lint="${{ needs.nginx-rate-limit-lint.result }}"
          nginx_parse="${{ needs.nginx-config-parses.result }}"
          gitleaks="${{ needs.gitleaks.result }}"
          test="${{ needs.test.result }}"
          live_sandbox="${{ needs.test-live-sandbox.result }}"
          integration="${{ needs.integration-tests.result }}"
          deps="${{ needs.dependency-validation.result }}"
          contracts="${{ needs.cross-module-contracts.result }}"
          regression="${{ needs.full-regression.result }}"
          perf="${{ needs.performance-smoke.result }}"
          mig="${{ needs.migration-check.result }}"
          fe="${{ needs.frontend.result }}"
          demo="${{ needs.demo-frontend.result }}"
          landing="${{ needs.landing-frontend.result }}"
          demo_deploy="${{ needs.demo-deploy-contracts.result }}"
          demo_e2e="${{ needs.demo-e2e.result }}"
          artifact_gate="${{ needs.artifact-gate.result }}"
          artifact_retention_guard="${{ needs.artifact-retention-guard.result }}"
          policy="${{ needs.policy-checks.result }}"
          security="${{ needs.security-scan.result }}"
          deployment="${{ needs.deployment-checks.result }}"

          fail() { echo "$1"; exit 1; }

          require() {
            local name="$1" result="$2" allow_skip="$3"
            if [[ "$allow_skip" == "true" ]]; then
              [[ "$result" == "success" || "$result" == "skipped" ]] || fail "$name: $result"
            else
              [[ "$result" == "success" ]] || fail "$name: $result"
            fi
          }

          require "gitleaks" "$gitleaks" "false"

          if [[ "$tier" == "issue" ]]; then
            require "lint" "$lint" "true"
            require "typecheck" "$typecheck" "true"
            require "test" "$test" "true"
            require "frontend" "$fe" "true"
            require "demo-frontend" "$demo" "true"
            require "landing-frontend" "$landing" "true"
            require "policy-checks" "$policy" "false"
            require "artifact-retention-guard" "$artifact_retention_guard" "false"
          elif [[ "$tier" == "wave" ]]; then
            # lint/typecheck also run at wave tier so a wave assembled by local
            # merges (rather than issue-tier PRs) is still statically checked.
            # Allow "skipped": they are gated on changes.backend.
            require "lint" "$lint" "true"
            require "typecheck" "$typecheck" "true"
            require "integration-tests" "$integration" "true"
            require "dependency-validation" "$deps" "true"
            require "cross-module-contracts" "$contracts" "true"
            require "architecture-gates" "$arch" "true"
          elif [[ "$tier" == "main" ]]; then
            # merge_group requires success for the same main-tier gates.
            # lint/typecheck/frontend/demo-frontend allow "skipped": when
            # reached via wave->main (main_via_wave) they already ran per
            # issue at issue tier — no CI double-run (#658 audit addendum).
            require "lint" "$lint" "true"
            require "typecheck" "$typecheck" "true"
            require "architecture-gates" "$arch" "false"
            require "bandit" "$bandit" "false"
            require "nginx-rate-limit-lint" "$nginx_lint" "false"
            require "nginx-config-parses" "$nginx_parse" "false"
            require "full-regression" "$regression" "false"
            require "migration-check" "$mig" "false"
            require "frontend" "$fe" "true"
            require "demo-frontend" "$demo" "true"
            require "landing-frontend" "$landing" "true"
            require "demo-deploy-contracts" "$demo_deploy" "false"
            require "demo-e2e" "$demo_e2e" "false"
            require "performance-smoke" "$perf" "false"
            require "security-scan" "$security" "false"
            require "deployment-checks" "$deployment" "false"
            require "artifact-gate" "$artifact_gate" "false"
            if [[ "${{ github.event_name }}" == "merge_group" ]]; then
              require "test-live-sandbox" "$live_sandbox" "false"
            else
              require "test-live-sandbox" "$live_sandbox" "true"
            fi
            require "dependency-validation" "$deps" "false"
          else
            fail "Unknown CI tier: $tier"
          fi

          echo "All required $tier-tier checks passed."
