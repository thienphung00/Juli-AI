name: Fast-track deploy

# Manual production deploy for the fast-track branch (fasttrack/ DECISIONS D2, D8;
# ACCEPTANCE AC-0.5). `main` is frozen while the fast track runs, so release.yml
# (push-to-main) never fires; this is the only way the branch reaches production.
#
# Each job `needs` its predecessor, so a failure anywhere stops everything after it:
#   validate -> plan -> backup -> check -> deploy
#   validate -> build ------------------------^   (build runs in parallel with plan/backup/check)
#   validate -> frontend -------------^   (the three gates below also run in
#   validate -> backend-unit ---------^    parallel with backup/check; deploy
#   validate -> static ---------------^    needs every one of them; P55, D64)
#
#   validate  the SHA is a full commit SHA on the fast-track branch. No secrets.
#   plan      P62-A (D72.1): does this deploy carry a migration? Reads production's
#             `alembic current` on the VPS (one SELECT, no dump) and compares it with
#             the SHA's alembic head (infra/scripts/migration_heads.py, stdlib only).
#             backup=true when they differ, when either is unknown, or on force_backup
#             (workflow_dispatch input, a tag ending in `-force-backup`, or the repo
#             variable FASTTRACK_FORCE_BACKUP=true).
#   backup    ONLY when plan says backup=true (otherwise skipped, and a skipped
#             backup counts as success for check/deploy; a FAILED one stops them).
#             The daily juli-db-backup.timer dump on the VPS is the standing recovery
#             point. infra/scripts/backup-database.sh (copied from the SHA) does a
#             pg_dump of the production database ON THE VPS, verified (non-empty,
#             above a size floor, `pg_restore --list` readable, and the TOC carries
#             the data of alembic_version / users / shops / tiktok_credentials).
#             Any failure fails the job, so check and deploy never run and no
#             migration is attempted. The dump never leaves the VPS (ADR-027).
#   check     fasttrack/check.sh on the SHA, with a throwaway Postgres service.
#   build     the demo release artifact, built here because a branch SHA has no
#             release.yml run to download one from (AC-7.9). Same script, same
#             Supabase build-time secrets and same tarball as release.yml's
#             app-release-artifact job. Touches nothing in production.
#   frontend  demo + landing: eslint, tsc --noEmit, vitest (what `pnpm check:demo` /
#             `check:landing` run, minus `next build`, which `build` already does),
#             plus packages/ui and utils tests. Node from .nvmrc.
#   backend-unit  the FULL `pytest tests/unit -m "not live"` with no database: the
#             Postgres-backed tests skip through tests/support/postgres.py's
#             `requires_postgres` (check.sh's migrations/isolation/pytest steps are
#             the ones with a database). check.sh alone runs only touched tests.
#   static    mypy on backend/src/juli_backend (backend/pyproject.toml's [tool.mypy])
#             and bandit -ll on the same package (pr.yml's `bandit` job), whole
#             package: ~1 min and ~15 s, so no changed-files scoping.
#             None of the three reads secrets or touches production.
#   deploy    the existing VPS path: infra/scripts/deploy.sh <sha> over SSH, exactly
#             as release.yml's `deploy` job runs it (same secrets, same environment).
#             Migrations run inside deploy.sh (additive gate + safe-alembic-upgrade.sh,
#             which takes its own pre-migration dump only when a migration is
#             pending) — only after backup (or its skip) and check succeeded. If the demo lane changed, the built tarball is copied
#             to the VPS and handed to deploy.sh as DEMO_ARTIFACT_TARBALL, so the demo
#             lane (deploy-demo-release.sh) runs after the API lane, as in release.yml.
#             Landing is built and handed over the same way (LANDING_ARTIFACT_TARBALL),
#             because it shares packages/ and pnpm-lock.yaml with demo.
#
# Triggers:
#   - pushing a tag `fasttrack-deploy-*` (owner decision, 2026-10-05). A push
#     trigger runs the workflow file from the pushed commit, so this works while
#     `main` -- the default branch -- is frozen. The tagged commit must be on the
#     fast-track branch (validate + the VPS re-check refuse anything else).
#       git tag fasttrack-deploy-$(date -u +%Y%m%dT%H%MZ) <sha> && git push origin <tag>
#     Force the backup job on a tag push by ending the tag in `-force-backup`:
#       git tag fasttrack-deploy-$(date -u +%Y%m%dT%H%MZ)-force-backup <sha> && git push origin <tag>
#   - workflow_dispatch, once this file exists on the default branch (input
#     force_backup).
# Never triggers on a branch push.

on:
  push:
    tags:
      - "fasttrack-deploy-*"
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA on the fast-track branch to deploy.
        required: true
        type: string
      since:
        description: >-
          Base ref for check.sh's "changed files" (ruff + pytest). Default is the
          branch point, so every fast-track change is re-checked on every deploy.
        required: false
        default: origin/main
        type: string
      force_backup:
        description: >-
          Run the pre-deploy backup even when the deploy carries no migration (P62-A).
        required: false
        default: false
        type: boolean

# Shared with release.yml (push to main => group release-refs/heads/main) and
# rollback.yml: all three mutate the same VPS release pool and nginx upstreams, so
# none of them may overlap. Never cancel a deploy mid-flight.
concurrency:
  group: release-refs/heads/main
  cancel-in-progress: false

permissions:
  contents: read

env:
  FASTTRACK_BRANCH: fasttrack/optimize-product

jobs:
  validate:
    name: Validate the requested SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.FASTTRACK_BRANCH }}
          fetch-depth: 0
      - name: SHA is a full commit on the fast-track branch
        env:
          SHA: ${{ inputs.sha || github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The workflow definition itself must come from the fast-track branch, so a
          # stale copy dispatched from another ref cannot deploy. A tag push runs the
          # file from the tagged commit, which the ancestry check below pins to the
          # fast-track branch -- so a fasttrack-deploy-* tag carries the same guarantee.
          case "${REF}" in
            "refs/heads/${FASTTRACK_BRANCH}"|refs/tags/fasttrack-deploy-*) ;;
            *)
              echo "::error::run from ${FASTTRACK_BRANCH} or a fasttrack-deploy-* tag (got ${REF})"
              exit 1
              ;;
          esac
          # Full SHA only: it is interpolated into the VPS script, and a short or
          # symbolic ref could resolve differently on the VPS than here.
          if ! [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full lowercase 40-character commit SHA (got '${SHA}')"
            exit 1
          fi
          git cat-file -e "${SHA}^{commit}" || {
            echo "::error::${SHA} is not a commit in this repository"; exit 1; }
          if ! git merge-base --is-ancestor "${SHA}" "origin/${FASTTRACK_BRANCH}"; then
            echo "::error::${SHA} is not on origin/${FASTTRACK_BRANCH} — push it to the branch first"
            exit 1
          fi
          echo "OK: ${SHA} is on ${FASTTRACK_BRANCH}"
          git log -1 --format='%H %s' "${SHA}"

  # AC-7.9. The demo lane normally downloads a juli-demo-<short-sha> tarball from a
  # release.yml run for the SHA; a fast-track SHA never has one, so build it here
  # with release.yml's own script (infra/scripts/build-release-artifact.sh) and the
  # same toolchain setup. Needs only `validate`: it neither reads nor changes
  # production, so it can run beside backup/check, but `deploy` needs it AND check.
  build:
    name: Build the demo and landing release artifacts
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      short: ${{ steps.paths.outputs.short }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Resolve artifact paths
        id: paths
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          short="${SHA::7}"
          {
            echo "short=${short}"
            echo "out=${GITHUB_WORKSPACE}/dist/release"
            echo "stage=${GITHUB_WORKSPACE}/dist/release/juli-demo-${short}"
            echo "tarball=${GITHUB_WORKSPACE}/dist/release/juli-demo-${short}.tar.gz"
          } >> "$GITHUB_OUTPUT"
      # NEXT_PUBLIC_* are inlined at `next build` time only (issue #1905), so the
      # Supabase sign-in door exists only if these two secrets are present for THIS
      # step. apps/demo's `pnpm build` ends with verify-supabase-env-in-build.mjs,
      # which fails the step non-zero if they did not make it into the build.
      - name: Build release artifact
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SHA: ${{ inputs.sha || github.sha }}
          OUT: ${{ steps.paths.outputs.out }}
        run: |
          ./infra/scripts/build-release-artifact.sh --app demo --commit "${SHA}" --out "${OUT}"
      - name: Assert the artifact is traceable to this commit
        env:
          SHA: ${{ inputs.sha || github.sha }}
          TARBALL: ${{ steps.paths.outputs.tarball }}
          STAGE: ${{ steps.paths.outputs.stage }}
        run: |
          set -euo pipefail
          test -f "${TARBALL}"
          recorded="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' \
            "${STAGE}/release-artifact.json")"
          if [[ "${recorded}" != "${SHA}" ]]; then
            echo "FAIL: artifact records commit ${recorded}, not ${SHA}" >&2
            exit 1
          fi
          echo "PASS: artifact is traceable to ${recorded}"
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: juli-demo-${{ steps.paths.outputs.short }}
          path: ${{ steps.paths.outputs.tarball }}
          if-no-files-found: error
      # Landing shares packages/ and pnpm-lock.yaml with demo, so a fast-track SHA
      # that touches those trips deploy.sh's landing lane too. Build it the same
      # way release.yml does (no Supabase env: apps/landing does not use it).
      - name: Build landing release artifact
        env:
          SHA: ${{ inputs.sha || github.sha }}
          OUT: ${{ steps.paths.outputs.out }}
        run: |
          ./infra/scripts/build-release-artifact.sh --app landing --commit "${SHA}" --out "${OUT}"
      - name: Assert the landing artifact is traceable to this commit
        env:
          SHA: ${{ inputs.sha || github.sha }}
          OUT: ${{ steps.paths.outputs.out }}
          SHORT: ${{ steps.paths.outputs.short }}
        run: |
          set -euo pipefail
          test -f "${OUT}/juli-landing-${SHORT}.tar.gz"
          recorded="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' \
            "${OUT}/juli-landing-${SHORT}/release-artifact.json")"
          if [[ "${recorded}" != "${SHA}" ]]; then
            echo "FAIL: landing artifact records commit ${recorded}, not ${SHA}" >&2
            exit 1
          fi
          echo "PASS: landing artifact is traceable to ${recorded}"
      - name: Upload landing release artifact
        uses: actions/upload-artifact@v7
        with:
          name: juli-landing-${{ steps.paths.outputs.short }}
          path: ${{ steps.paths.outputs.out }}/juli-landing-${{ steps.paths.outputs.short }}.tar.gz
          if-no-files-found: error

  # P55 (D64). The three gates main's pr.yml runs and this workflow did not: the
  # full backend unit suite, the demo/landing frontend checks, and mypy + bandit.
  # Each needs only `validate`, so they run beside backup/check and add no wall
  # time unless they are the slowest branch; `deploy` needs all three. Job ids are
  # stable names referenced from fasttrack/README.md -- rename them in both places.
  frontend:
    name: Frontend checks (demo + landing)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # `pnpm check:demo` minus `pnpm build:demo` (the build job builds the shipped
      # artifact from the same SHA with the real Supabase env).
      - name: Demo — eslint, tsc --noEmit, vitest
        run: pnpm lint:demo && pnpm type-check:demo && pnpm test:demo
      - name: packages/ui and packages/utils tests
        run: pnpm --filter @juli/ui test && pnpm --filter @juli/utils test
      # Not packages/theme: pr.yml's demo-frontend runs it, but 2 of its 79 tests are
      # stale against the fast-track demo (apps/demo/src/lib/run-surface/tokens.ts
      # is gone; auth-screen.css uses #121214). DEBT P55.
      # `pnpm check:landing` minus `pnpm build:landing` (built in the build job).
      - name: Landing — eslint, tsc --noEmit, vitest
        run: pnpm lint:landing && pnpm type-check:landing && pnpm test:landing

  backend-unit:
    name: Backend unit suite (no database)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      JULI_REQUIRE_ARCHIVED_COMMITS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          # Some unit tests read git history (base-anchored gates, the negative
          # dataset's commit rows); full history keeps them on the same footing as
          # a local clone, which is where this suite was verified green.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # P56, D65: two negative-dataset rows cite commits a squash-merge dissolved
      # (PR #1472). No branch or tag reaches them, so even fetch-depth 0 does not
      # bring them; GitHub keeps them under refs/pull/1472/head. Fetch the declared
      # archive refs into refs/archive/* so those rows resolve with their digest
      # checked, and require that they do (JULI_REQUIRE_ARCHIVED_COMMITS above).
      - name: Fetch archived evidence refs (negative dataset)
        run: |
          set -euo pipefail
          refspecs="$(python3 -c 'from eval.negative_dataset import archive_fetch_refspecs as f; print(" ".join(f()))')"
          echo "fetching: ${refspecs}"
          # shellcheck disable=SC2086
          git fetch --no-tags origin ${refspecs}
      # Contract tests shell out to node + typescript in packages/contracts (same
      # install as the check job and pr.yml's test job).
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install contracts dependency graph
        run: pnpm install --frozen-lockfile --filter "./packages/contracts..."
      - name: Install backend
        run: |
          pip install -e "./backend[dev]" -c backend/constraints.txt
          pip freeze | sort
      # No DATABASE_URL on purpose: Postgres-backed tests skip (requires_postgres),
      # and the per-test timeout is pytest.ini's 30 s except where a test carries
      # its own `pytest.mark.timeout`.
      - name: pytest tests/unit -m "not live"
        run: python -X faulthandler -m pytest tests/unit -m "not live" -q --tb=short -p no:cacheprovider

  static:
    name: Static analysis (mypy + bandit)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          pip install -e "./backend[dev]" -c backend/constraints.txt
          pip freeze | sort
      # Same target and flags as pr.yml's typecheck job; they are also
      # backend/pyproject.toml's [tool.mypy], read via --config-file.
      - name: Mypy (backend/src/juli_backend)
        run: mypy --config-file backend/pyproject.toml backend/src/juli_backend
      # pr.yml's bandit job: fail on medium+ severity. The constraints-pinned
      # bandit from backend[dev] instead of an unpinned `pip install bandit`.
      - name: Bandit (fail on medium+ severity)
        run: bandit -r backend/src/juli_backend -ll

  # P62-A (D72.1). Every deploy used to take a full pg_dump here AND another in
  # safe-alembic-upgrade.sh: ~300 dumps in a cycle, most of Supabase's egress. The
  # backup exists to protect a migration, so it runs only when the SHA's alembic
  # head differs from what production is stamped at. Fails toward a backup: an
  # unreadable production revision or a target with several heads answers true.
  plan:
    name: Does this deploy carry a migration?
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    outputs:
      backup: ${{ steps.decide.outputs.backup }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
      # The live release's venv and helper, exactly as the backup job uses them.
      # Prints one marker line; everything else is diagnostics.
      - name: Read production's alembic revision on the VPS
        id: prod
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          capture_stdout: true
          script: |
            set -euo pipefail
            LIVE="$(readlink -f "${HOME}/releases/current" || true)"
            REV=""
            if [ -n "${LIVE}" ] && [ -x "${LIVE}/.venv/bin/python" ]; then
              set -a; . /etc/juli/api.env; set +a
              REV="$(PYTHONPATH="${LIVE}/infra/scripts" "${LIVE}/.venv/bin/python" \
                "${LIVE}/infra/scripts/safe_alembic_helpers.py" current-revision 2>/dev/null || true)"
            fi
            echo "PRODUCTION_ALEMBIC_REVISION=${REV}"
      - name: Decide
        id: decide
        env:
          PROD_STDOUT: ${{ steps.prod.outputs.stdout }}
          FORCE_INPUT: ${{ inputs.force_backup && 'true' || 'false' }}
          FORCE_VAR: ${{ vars.FASTTRACK_FORCE_BACKUP || 'false' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rev="$(printf '%s\n' "${PROD_STDOUT}" | sed -n 's/^PRODUCTION_ALEMBIC_REVISION=//p' | tail -n 1 | tr -d '[:space:]')"
          force=()
          if [[ "${FORCE_INPUT}" == "true" || "${FORCE_VAR}" == "true" || "${REF_NAME}" == *-force-backup ]]; then
            force=(--force)
          fi
          echo "production alembic revision: ${rev:-<unknown>}"
          echo "target heads: $(python3 infra/scripts/migration_heads.py heads \
            --migrations-dir backend/src/juli_backend/database/migrations/versions | tr '\n' ' ')"
          python3 infra/scripts/migration_heads.py decide \
            --migrations-dir backend/src/juli_backend/database/migrations/versions \
            --production-revision "${rev}" "${force[@]}" | tee -a "$GITHUB_OUTPUT"

  # D8 step 1. Runs on the VPS because that is where production DB access lives:
  # /etc/juli/api.env holds the URLs, and safe-alembic-upgrade.sh / restore-drill.sh
  # already dump and restore there. Uses the LIVE release's venv and its
  # safe_alembic_helpers.py, so the owner-role check and URL resolution are exactly
  # the ones the migration path uses (#1575: never dump as the RLS-bound runtime
  # role, which "succeeds" with zero rows). The dump + verify logic is
  # infra/scripts/backup-database.sh, shared with the daily juli-db-backup.timer
  # (P62-A); it is copied from the SHA being deployed, so the first deploy that
  # ships it does not depend on the live release already having it. The file is
  # named juli-pre-migrate-*-fasttrack-<short>.dump in ~/backups so the rotation
  # and the weekly restore drill cover it.
  # P62-A: runs only when `plan` says so; skipped otherwise (see check's `if`).
  backup:
    name: Back up the production database
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.backup == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          sparse-checkout: infra/scripts/backup-database.sh
          sparse-checkout-cone-mode: false
      - name: Copy backup-database.sh to the VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: infra/scripts/backup-database.sh
          target: fasttrack-artifacts
          strip_components: 2
          overwrite: true
      - name: pg_dump on the VPS and verify it
        uses: appleboy/ssh-action@v1.2.5
        env:
          SHA: ${{ inputs.sha || github.sha }}
          REASON: ${{ needs.plan.outputs.reason }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          envs: SHA,REASON
          script: |
            set -euo pipefail
            echo "backup reason: ${REASON}"
            LIVE="$(readlink -f "${HOME}/releases/current" || true)"
            [ -n "${LIVE}" ] && [ -d "${LIVE}" ] || { echo "BACKUP FAILED: no live API release at ~/releases/current" >&2; exit 1; }
            RELEASE_DIR="${LIVE}" API_ENV_FILE=/etc/juli/api.env BACKUP_DIR="${HOME}/backups" \
              BACKUP_LABEL="fasttrack-${SHA:0:7}" \
              bash "${HOME}/fasttrack-artifacts/backup-database.sh"

  check:
    name: fasttrack/check.sh
    runs-on: ubuntu-latest
    needs: [plan, backup]
    # P62-A: a SKIPPED backup (no migration) counts as success; a FAILED or
    # cancelled one does not. Without an explicit `if`, a skipped need skips this
    # job too. plan must have succeeded, so "skipped" can only mean "not needed".
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && (needs.backup.result == 'success'
          || (needs.backup.result == 'skipped' && needs.plan.outputs.backup == 'false'))
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: check_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Created for this job and destroyed with it — check.sh wipes it.
      CHECK_DATABASE_URL: postgresql://postgres:test@localhost:5432/check_db
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          # check.sh diffs against merge-base(--since, HEAD) and gitleaks scans that
          # commit range, so full history is needed.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Contract tests in the pytest step shell out to node + typescript in
      # packages/contracts (same reason release.yml's build job installs this).
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install contracts dependency graph
        run: pnpm install --frozen-lockfile --filter "./packages/contracts..."
      - name: Install backend
        run: |
          pip install -e "./backend[dev]" -c backend/constraints.txt
          pip freeze | sort
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run check.sh
        env:
          SINCE: ${{ inputs.since || 'origin/main' }}
          # CHECK_DATABASE_URL above is this job's own postgres service, destroyed
          # with the job. check.sh exports the same marker beside DATABASE_URL in
          # use_db(); declaring it here too keeps the workflow-level parity that
          # test_destructive_migration_isolation pins for every pytest workflow
          # (P53, D62). It means nothing while DATABASE_URL is empty.
          JULI_TEST_DATABASE_DISPOSABLE: "1"
        run: PYTHON="$(command -v python)" ./fasttrack/check.sh --since "${SINCE}"

  deploy:
    name: Deploy to the VPS
    runs-on: ubuntu-latest
    needs: [check, build, frontend, backend-unit, static]
    # The implicit success() fails as soon as ANY ancestor was skipped (a skipped
    # backup, P62-A), so every direct need is checked explicitly instead. check
    # itself only runs when backup succeeded or was legitimately skipped.
    if: >-
      !cancelled()
      && needs.check.result == 'success'
      && needs.build.result == 'success'
      && needs.frontend.result == 'success'
      && needs.backend-unit.result == 'success'
      && needs.static.result == 'success'
    environment: production
    steps:
      # The demo tarball built above, copied to the VPS with the same host/user/key/
      # port secrets the SSH step below uses. Placed in ~/fasttrack-artifacts; it is
      # only used if the demo lane turns out to have changed.
      - name: Download the demo artifact
        uses: actions/download-artifact@v7
        with:
          name: juli-demo-${{ needs.build.outputs.short }}
          path: dist/release
      - name: Download the landing artifact
        uses: actions/download-artifact@v7
        with:
          name: juli-landing-${{ needs.build.outputs.short }}
          path: dist/release
      - name: Copy the demo artifact to the VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "dist/release/juli-demo-*.tar.gz,dist/release/juli-landing-*.tar.gz"
          target: fasttrack-artifacts
          strip_components: 2
          overwrite: true
      # Same SSH action, secrets and entry point as release.yml's `deploy` job. The
      # differences, all forced by deploying a branch SHA instead of main's HEAD:
      #   - fetch the fast-track branch (the SHA is not on main), and refuse a SHA
      #     that is not on it;
      #   - check the canonical clone out at the SHA (detached), so deploy.sh, the
      #     systemd units it installs and the gates it runs are the versions being
      #     deployed — the property release.yml gets from `git pull` on main.
      #     release.yml starts with `git checkout main`, so it still works from a
      #     detached clone. rollback.yml (P57) never moves the clone: it runs the
      #     rollback-release.sh this deploy leaves there;
      #   - run the demo lane from the artifact built above (DEMO_ARTIFACT_TARBALL, which
      #     deploy.sh passes through to deploy-demo-release.sh) instead of downloading
      #     one from a release.yml run, and refuse up front if the Landing lane would
      #     run: it still needs a release.yml artifact. deploy.sh runs the API lane
      #     first, so without that preflight it would ship the API and then fail
      #     half-deployed.
      - name: Deploy on the VPS via infra/scripts/deploy.sh
        uses: appleboy/ssh-action@v1.2.5
        env:
          SHA: ${{ inputs.sha || github.sha }}
          SHORT: ${{ needs.build.outputs.short }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 45m
          envs: SHA,SHORT,FASTTRACK_BRANCH
          script: |
            set -euo pipefail
            cd ~/Juli-AI-v2
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "FAIL: ~/Juli-AI-v2 has local modifications to tracked files; refusing to move it" >&2
              git status --short --untracked-files=no >&2
              exit 1
            fi
            git fetch origin main "+refs/heads/${FASTTRACK_BRANCH}:refs/remotes/origin/${FASTTRACK_BRANCH}"
            git cat-file -e "${SHA}^{commit}"
            if ! git merge-base --is-ancestor "${SHA}" "origin/${FASTTRACK_BRANCH}"; then
              echo "FAIL: ${SHA} is not on origin/${FASTTRACK_BRANCH}" >&2
              exit 1
            fi
            git checkout --detach "${SHA}"

            # Landing shares packages/ and pnpm-lock.yaml with demo, so deploy.sh may
            # run its lane too; it uses the tarball built above (same commit check as
            # release.yml's artifact) instead of a release.yml run.
            LANDING_ARTIFACT_TARBALL="${HOME}/fasttrack-artifacts/juli-landing-${SHORT}.tar.gz"
            [ -f "${LANDING_ARTIFACT_TARBALL}" ] || { echo "FAIL: ${LANDING_ARTIFACT_TARBALL} missing" >&2; exit 1; }
            export LANDING_ARTIFACT_TARBALL

            # The demo tarball copied by the previous step. deploy.sh runs the demo lane
            # (after the API lane) only if it changed, and then deploy-demo-release.sh
            # uses this tarball instead of `gh run download`. It refuses any tarball
            # whose recorded commit is not ${SHA}.
            DEMO_ARTIFACT_TARBALL="${HOME}/fasttrack-artifacts/juli-demo-${SHORT}.tar.gz"
            [ -f "${DEMO_ARTIFACT_TARBALL}" ] || { echo "FAIL: ${DEMO_ARTIFACT_TARBALL} missing" >&2; exit 1; }
            export DEMO_ARTIFACT_TARBALL

            ./infra/scripts/deploy.sh "${SHA}"
            echo "live API release: $(readlink -f ~/releases/current)"

      # deploy.sh already verifies the candidate (/health shape + core routes), cuts
      # over, and rolls back automatically if the public check fails. This is the
      # runner's independent look from outside the VPS.
      - name: Post-deploy health check (public)
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            body="$(curl -sS -m 10 https://api.app-juli.com/health || true)"
            if python3 -c 'import json,sys; sys.exit(0 if json.loads(sys.argv[1]).get("status") == "ok" else 1)' "${body}" 2>/dev/null; then
              echo "PASS: https://api.app-juli.com/health -> ${body}"
              exit 0
            fi
            sleep 6
          done
          echo "::error::https://api.app-juli.com/health did not report status=ok after deploy (last: ${body:-<none>})"
          exit 1
