name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and verify
        run: |
          pip install -e "./backend[dev]" -c backend/constraints.txt
          pip freeze | sort
          ruff check backend/src/juli_backend tests scripts
          mypy backend/src/juli_backend --ignore-missing-imports --disable-error-code=valid-type
          pytest tests/ -q

  # Deploys to the single review VPS via SSH — no Railway/Vercel/containers.
  # Skipped on tag pushes (tags cut a GitHub Release from what's already live;
  # only a push to main triggers a new deploy). See infra/scripts/deploy-release.sh
  # for the release-worktree/symlink/health-check mechanics run on the VPS.
  # Must wait on app-release-artifact: deploy.sh's demo/landing lanes pull the built
  # artifact with `gh run download` for this commit. As siblings on `needs: build`
  # alone, deploy raced ahead and failed with "no valid artifacts found" while the
  # matrix was still running Playwright (#820).
  deploy:
    runs-on: ubuntu-latest
    needs: [build, app-release-artifact]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          # Pulls the canonical checkout up to this SHA first so deploy-release.sh
          # itself is always the version being deployed, then hands off to it —
          # see infra/scripts/deploy-release.sh for the worktree/health-check flow.
          script: |
            set -euo pipefail
            cd ~/Juli-AI-v2
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            ./infra/scripts/deploy.sh "${{ github.sha }}"

  # Application release artifacts (#837, slice P0-DEL-ARTIFACT of PRD #820).
  #
  # NOT the same thing as `generate-release-artifact` below. That job emits release
  # *metadata* (a JSON provenance document). This one emits the *deployable* — the
  # built application plus its production dependency tree, in the shape ADR-058
  # fixed. Both are uploaded; neither replaces the other.
  #
  # This job is why the server no longer compiles: `infra/scripts/build-demo.sh` used
  # to run `pnpm install --frozen-lockfile` and `turbo run build` on a 2 vCPU / 4 GB
  # box mid-release. Both now happen here.
  #
  # Producing and publishing the artifact is the whole of this slice. Delivering it to
  # the server, starting a candidate from it, and cutover are #838 and #841.
  app-release-artifact:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      # One deployable failing must not suppress the others' artifacts.
      fail-fast: false
      matrix:
        # PRD #820's Next deployables. apps/dashboard is absent on purpose: it is
        # npm-owned, is not a pnpm workspace member, and PRD #820 retires it from
        # production rather than deploying it.
        app: [demo, landing]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Resolve artifact paths
        id: paths
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          {
            echo "short=$short"
            echo "out=${{ github.workspace }}/dist/release"
            echo "stage=${{ github.workspace }}/dist/release/juli-${{ matrix.app }}-$short"
            echo "tarball=${{ github.workspace }}/dist/release/juli-${{ matrix.app }}-$short.tar.gz"
          } >> "$GITHUB_OUTPUT"
      # Fails non-zero and writes no tarball if the install, the build, the
      # dependency resolution, or the packaging fails.
      - name: Build release artifact
        run: |
          ./infra/scripts/build-release-artifact.sh \
            --app "${{ matrix.app }}" \
            --commit "${{ github.sha }}" \
            --out "${{ steps.paths.outputs.out }}"
      # Browser-level gate — the deliberate counterpart to the protocol-level
      # on-server checks in infra/scripts/verify-release-assets.sh (#833). Computed
      # styling and interactivity need a real browser, which is too expensive to run
      # on the server mid-release, so they run here instead. This extends apps/demo's
      # existing exit-gate Playwright suite rather than adding a parallel one; the
      # only change is DEMO_E2E_ARTIFACT_DIR, which makes it start the artifact
      # instead of rebuilding, so it checks what actually ships.
      - name: Install Playwright Chromium
        if: matrix.app == 'demo'
        run: pnpm --filter @juli/demo exec playwright install --with-deps chromium
      - name: Browser-level checks against the artifact
        if: matrix.app == 'demo'
        env:
          DEMO_E2E_ARTIFACT_DIR: ${{ steps.paths.outputs.stage }}
        run: pnpm --filter @juli/demo test:e2e
      # apps/landing has no browser suite yet (#841 gives it a production home).
      # Until it does, prove at least that the artifact's own dependency tree starts
      # and serves — which is what a broken CI-resolved tree would fail.
      - name: Smoke-start the artifact
        if: matrix.app != 'demo'
        working-directory: ${{ steps.paths.outputs.stage }}
        run: |
          set -euo pipefail
          node_modules/.bin/next start -p 3210 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3210/ || true)"
            if [[ "$code" =~ ^2 ]]; then
              echo "PASS: ${{ matrix.app }} artifact served / with HTTP $code"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: ${{ matrix.app }} artifact did not serve / within 60s" >&2
          exit 1
      # Assert on the artifact itself, not on a success line in the log above: a
      # step that dies before it prints leaves no marker to grep for.
      - name: Assert the artifact is traceable to this commit
        run: |
          set -euo pipefail
          test -f "${{ steps.paths.outputs.tarball }}"
          recorded="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' \
            "${{ steps.paths.outputs.stage }}/release-artifact.json")"
          if [[ "$recorded" != "${{ github.sha }}" ]]; then
            echo "FAIL: artifact records commit $recorded, not ${{ github.sha }}" >&2
            exit 1
          fi
          echo "PASS: artifact is traceable to $recorded"
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: juli-${{ matrix.app }}-${{ steps.paths.outputs.short }}
          path: ${{ steps.paths.outputs.tarball }}
          # A missing artifact must fail the job rather than upload nothing.
          if-no-files-found: error

  generate-release-artifact:
    runs-on: ubuntu-latest
    needs: deploy
    # Runs when deploy succeeded (push to main) or was skipped (tag push cutting
    # a release from what's already live) — but not when deploy actually failed.
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0+${GITHUB_SHA::7}"
          fi
          echo "value=$ver" >> "$GITHUB_OUTPUT"
      - name: Generate release artifact
        run: |
          python agent-runtime/scripts/ci/generate_release_artifact.py \
            --version "${{ steps.version.outputs.value }}" \
            --commit "${{ github.sha }}" \
            --branch main \
            --environment production
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.value }}
          # generate_release_artifact.py writes to common.RELEASES_DIR, which is
          # agent-runtime/artifacts/releases. The path was missing that prefix, so
          # every release silently uploaded nothing.
          path: agent-runtime/artifacts/releases/release-${{ steps.version.outputs.value }}.json
          # Default is a warning; a missing provenance artifact should fail the job
          # rather than disappear into the log.
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: [generate-release-artifact]
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/releases/release-*.json
