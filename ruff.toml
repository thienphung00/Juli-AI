# Ruff config for the repo-root paths that CI lints but backend/pyproject.toml
# does not cover — `tests/` and `scripts/` (see .github/workflows/pr.yml "Ruff":
# `ruff check backend/src/juli_backend tests scripts`). Files under `backend/`
# resolve to backend/pyproject.toml's `[tool.ruff]` instead, because Ruff uses
# the *nearest* config to each file; this file only applies outside `backend/`.
#
# Why it exists: without it, `tests/` and `scripts/` fell back to Ruff's BUILT-IN
# defaults, so the linted rule set silently changed with the Ruff version. The
# 0.15 -> 0.16 bump widened those built-in defaults and turned 599 previously
# unreported findings into CI failures in one step. Pinning the selection here
# makes the rule set a reviewable decision instead of a side effect of a version
# bump. The value below is Ruff's historical default selection, so it is exactly
# what these paths were already being linted under — no behavior change.
#
# Deliberately NARROWER than backend/pyproject.toml (which selects E, F, I, UP).
# Widening these paths to match the backend is a worthwhile follow-up but is not
# a dependency bump: it surfaces 114 pre-existing findings (53 E501, 34 UP017,
# 27 I001) that need their own reviewed change.
line-length = 100
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]
